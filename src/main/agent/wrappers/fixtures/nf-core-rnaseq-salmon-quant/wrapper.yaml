# Standalone wrapper chaining three modules of nf-core/rnaseq 3.26.0 —
# transcript extraction (gffread), Salmon index, Salmon quantification.
#
# See ../nf-core-rnaseq-fastqc/wrapper.yaml's doc comment for why this
# exists as its own independently runnable Phi wrapper rather than being
# composed into the full `nf-core/rnaseq/rnaseq` pipeline wrapper — Phi has
# no wrapper-composition mechanism (product docs explicitly rule it out for
# now). Like the star-align wrapper in this namespace, this one chains
# multiple real modules itself (GFFREAD + SALMON_INDEX + SALMON_QUANT)
# since quantification needs a transcript-level Salmon index built from
# the genome fasta/gtf, and there's no separate wrapper to depend on for
# that — see main.nf's own doc comment. All modules vendored unmodified.
phiWrapperVersion: 1
id: nf-core/rnaseq/salmon-quant
shortId: salmon-quant
name: Salmon quantification (nf-core/rnaseq modules)
version: 3.26.0
summary: Quantify transcript/gene expression from FASTQ reads with Salmon (quasi-mapping) — the quantification modules nf-core/rnaseq uses internally, wrapped standalone.

runtime:
  minVersion: 1.0.0
  maxVersion: 1.x

source:
  repository: https://github.com/nf-core/rnaseq
  ref: 3.26.0

verification:
  status: unverified
  registry: none

registryStatus: active
resourceClass: standard

engine:
  type: nextflow
  entrypoint: main.nf
  profiles:
    - id: local
      executor: local
      containerRuntime: docker
      nextflowProfile: docker
    - id: slurm-controller
      executor: remote
      scheduler: slurm
      controller: sbatch
      containerRuntime: singularity
      nextflowProfile: singularity

inputs:
  - id: reads
    type: fastq_reads
    layout: paired_end
    required: true
    samplesheet:
      columns:
        - sample
        - fastq_1
        - fastq_2
  - id: fasta
    type: reference_fasta
    required: true
  - id: gtf
    type: reference_gtf
    required: true

parameters:
  schema:
    type: object
    properties: {}

outputs:
  - id: salmon_index
    label: Salmon transcript index
    type: directory
    path: salmon_index
  - id: quant
    label: Per-sample quantification results
    type: directory
    path: salmon_quant
    primary: true

resources:
  defaults:
    cpus: 4
    memory: 16 GB
    time: 4h

permissions:
  filesystem:
    read:
      - input_paths
    write:
      - run_workdir
      - declared_outdir
  network:
    default: disabled
  remote:
    allowed: false

license:
  wrapper: MIT
  tools:
    - name: Salmon
      license: GPL-3.0
    - name: gffread
      license: MIT

citations:
  - id: nf-core
    doi: 10.1038/s41587-020-0439-x

dataPolicy:
  acceptedSensitivity:
    - public
    - internal
  externalTransfer:
    default: false
