# Standalone wrapper around one module of nf-core/rnaseq 3.26.0 — Trim
# Galore adapter/quality trimming.
#
# See ../nf-core-rnaseq-fastqc/wrapper.yaml's doc comment for why this
# exists as its own independently runnable Phi wrapper rather than being
# composed into the full `nf-core/rnaseq/rnaseq` pipeline wrapper — Phi has
# no wrapper-composition mechanism (product docs explicitly rule it out for
# now). The module itself (modules/nf-core/trimgalore/main.nf) is vendored
# unmodified; `main.nf`/`nextflow.config` here are a small Phi-authored
# launcher.
phiWrapperVersion: 1
id: nf-core/rnaseq/trimgalore
shortId: trimgalore
name: Trim Galore (nf-core/rnaseq module)
version: 3.26.0
summary: Adapter/quality-trim paired-end FASTQ reads with Trim Galore — the trimming module nf-core/rnaseq uses internally, wrapped standalone.

runtime:
  minVersion: 1.0.0
  maxVersion: 1.x

source:
  repository: https://github.com/nf-core/rnaseq
  ref: 3.26.0

verification:
  status: unverified
  registry: none

registryStatus: active
resourceClass: light

engine:
  type: nextflow
  entrypoint: main.nf
  profiles:
    - id: local
      executor: local
      containerRuntime: docker
      nextflowProfile: docker
    - id: slurm-controller
      executor: remote
      scheduler: slurm
      controller: sbatch
      containerRuntime: singularity
      nextflowProfile: singularity

inputs:
  - id: reads
    type: fastq_reads
    layout: paired_end
    required: true
    samplesheet:
      columns:
        - sample
        - fastq_1
        - fastq_2

parameters:
  schema:
    type: object
    properties: {}

outputs:
  - id: trimmed_reads
    label: Trimmed FASTQ files
    type: directory
    path: trimgalore
    primary: true
  - id: reports
    label: Trimming reports (FastQC + Trim Galore logs)
    type: directory
    path: trimgalore/reports

resources:
  defaults:
    cpus: 4
    memory: 8 GB
    time: 2h

permissions:
  filesystem:
    read:
      - input_paths
    write:
      - run_workdir
      - declared_outdir
  network:
    default: disabled
  remote:
    allowed: false

license:
  wrapper: MIT
  tools:
    - name: Trim Galore
      license: GPL-3.0

citations:
  - id: nf-core
    doi: 10.1038/s41587-020-0439-x

dataPolicy:
  acceptedSensitivity:
    - public
    - internal
  externalTransfer:
    default: false
