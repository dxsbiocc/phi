phiDbConnectorVersion: 1
id: entrez/ncbi
name: NCBI Entrez
protocolFamily: entrez
curationTier: curated
baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
networkPolicy:
  allowedHosts:
    - eutils.ncbi.nlm.nih.gov
    - ftp.ncbi.nlm.nih.gov
  allowRedirects: false
auth:
  type: api_key_query_param
  envVar: NCBI_API_KEY
  paramName: api_key
  required: false
  label: NCBI API key
  signupUrl: https://www.ncbi.nlm.nih.gov/account/settings/
rateLimit:
  withAuth:
    requestsPerSecond: 10
  withoutAuth:
    requestsPerSecond: 3
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: gene
    dbParam: gene
    summary: Gene records, locations, aliases, and summaries.
    identity:
      stableIdFields: [uid]
      namespace: ncbi.gene_id
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/gene/{stable_id}
    commonFields:
      - uid
      - symbol
      - description
      - summary
      - chromosome
      - mapLocation
      - aliases
      - gene_type
      - organism
      - tax_id
    fields:
      - name: uid
        type: string
        description: Entrez Gene identifier.
        namespace: entrez.gene_id
      - name: symbol
        type: string
        description: Official gene symbol.
        synonyms:
          - gene_symbol
          - hgnc_symbol
        namespace: hgnc.symbol
      - name: description
        type: string
        description: Gene description.
      - name: summary
        type: string
        description: Gene summary text fetched from NCBI EFetch XML, when available.
      - name: chromosome
        type: string
        description: Chromosome or genomic location label.
      - name: mapLocation
        type: string
        description: Cytogenetic map location, when available.
      - name: aliases
        type: array
        description: Gene aliases and synonyms from Entrez summaries and EFetch XML.
      - name: gene_type
        type: string
        description: Entrez gene type label, when available.
      - name: organism
        type: object
        description: Source organism metadata, when available.
      - name: tax_id
        type: number
        description: NCBI Taxonomy identifier, when available.
  - id: pubmed
    dbParam: pubmed
    summary: Literature metadata from PubMed summaries.
    identity:
      stableIdFields: [uid]
      namespace: pubmed.pmid
      primaryUrlTemplate: https://pubmed.ncbi.nlm.nih.gov/{stable_id}/
    commonFields:
      - uid
      - title
      - authors
      - abstract
      - journal
      - pubdate
      - doi
      - mesh_terms
      - keywords
      - publication_types
    fields:
      - name: uid
        type: string
        description: PubMed identifier.
        namespace: pubmed.pmid
      - name: title
        type: string
        description: Article title.
      - name: authors
        type: array
        description: Author display names.
      - name: abstract
        type: string
        description: Article abstract text from PubMed EFetch XML, when available.
      - name: journal
        type: string
        description: Journal name.
      - name: pubdate
        type: date
        description: Publication date.
      - name: doi
        type: string
        description: Digital Object Identifier, when available.
      - name: mesh_terms
        type: array
        description: MeSH descriptor terms from PubMed EFetch XML, when available.
      - name: keywords
        type: array
        description: Author or indexing keywords from PubMed EFetch XML, when available.
      - name: publication_types
        type: array
        description: PubMed publication type labels from PubMed EFetch XML, when available.
  - id: protein
    dbParam: protein
    summary: NCBI Protein records with RefSeq/GenPept accessions and FASTA sequences.
    identity:
      stableIdFields: [accession, uid]
      namespace: ncbi.protein_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/protein/{stable_id}
    commonFields:
      - uid
      - accession
      - title
      - organism
      - sequence
    fields:
      - name: uid
        type: string
        description: NCBI Protein Entrez UID.
      - name: accession
        type: string
        description: Protein accession.version, when available.
        synonyms:
          - refseq_accession
          - protein_accession
        namespace: ncbi.protein_accession
      - name: title
        type: string
        description: Protein record title.
      - name: organism
        type: string
        description: Source organism name, when available.
      - name: sequence
        type: string
        description: Amino acid sequence fetched from NCBI EFetch FASTA.
  - id: nucleotide
    dbParam: nuccore
    summary: NCBI Nucleotide records with RefSeq/GenBank accessions and FASTA sequences.
    identity:
      stableIdFields: [accession, uid]
      namespace: ncbi.nucleotide_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/nuccore/{stable_id}
    commonFields:
      - uid
      - accession
      - title
      - organism
      - sequence_length
      - molecule_type
      - sequence
    fields:
      - name: uid
        type: string
        description: NCBI Nucleotide Entrez UID.
      - name: accession
        type: string
        description: Nucleotide accession.version, when available.
        synonyms:
          - refseq_accession
          - genbank_accession
          - nucleotide_accession
        namespace: ncbi.nucleotide_accession
      - name: title
        type: string
        description: Nucleotide record title.
      - name: organism
        type: string
        description: Source organism name, when available.
      - name: sequence_length
        type: number
        description: Sequence length in bases, when available.
      - name: molecule_type
        type: string
        description: Molecule type label from the NCBI summary, when available.
      - name: sequence
        type: string
        description: Nucleotide sequence fetched from NCBI EFetch FASTA.
  - id: biosample
    dbParam: biosample
    summary: NCBI BioSample records with organism, submitter, package, and sample attributes.
    identity:
      stableIdFields: [accession, uid]
      namespace: ncbi.biosample_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/biosample/{stable_id}
    commonFields:
      - uid
      - accession
      - title
      - organism
      - tax_id
      - sample_name
      - owner
      - package
      - model
      - attributes
      - collection_date
      - geo_loc_name
      - tissue
      - isolation_source
    fields:
      - name: uid
        type: string
        description: NCBI BioSample Entrez UID.
      - name: accession
        type: string
        description: BioSample accession, such as SAMN identifiers.
        synonyms:
          - biosample_accession
          - sample_accession
        namespace: ncbi.biosample_accession
      - name: title
        type: string
        description: BioSample title.
      - name: organism
        type: string
        description: Source organism name, when available.
      - name: tax_id
        type: number
        description: NCBI Taxonomy identifier for the sample organism, when available.
        namespace: ncbi.taxonomy_id
      - name: sample_name
        type: string
        description: Submitted sample name, when available.
      - name: owner
        type: string
        description: Submitting organization or owner name, when available.
      - name: package
        type: string
        description: BioSample package display name, when available.
      - name: model
        type: string
        description: BioSample model label, when available.
      - name: attributes
        type: object
        description: Sample attribute key-value metadata from BioSample EFetch XML.
      - name: collection_date
        type: string
        description: Collection date attribute, when available.
      - name: geo_loc_name
        type: string
        description: Geographic location attribute, when available.
      - name: tissue
        type: string
        description: Tissue attribute, when available.
      - name: isolation_source
        type: string
        description: Isolation source attribute, when available.
  - id: sra
    dbParam: sra
    summary: NCBI Sequence Read Archive records with study, experiment, sample, and run metadata.
    identity:
      stableIdFields: [experiment_accession, accession, uid]
      namespace: ncbi.sra_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/sra/{stable_id}
    commonFields:
      - uid
      - accession
      - title
      - study_accession
      - experiment_accession
      - sample_accession
      - biosample_accession
      - bioproject_accession
      - organism
      - tax_id
      - platform
      - instrument_model
      - library_strategy
      - library_source
      - library_selection
      - library_layout
      - run_accessions
      - runs
      - download_urls
      - download_files
    fields:
      - name: uid
        type: string
        description: NCBI SRA Entrez UID.
      - name: accession
        type: string
        description: Primary SRA accession, usually experiment, run, study, or sample accession.
        synonyms:
          - sra_accession
          - experiment_accession
          - run_accession
        namespace: ncbi.sra_accession
      - name: title
        type: string
        description: SRA experiment title.
      - name: study_accession
        type: string
        description: SRA study accession, when available.
      - name: experiment_accession
        type: string
        description: SRA experiment accession, when available.
      - name: sample_accession
        type: string
        description: SRA sample accession, when available.
      - name: biosample_accession
        type: string
        description: Linked BioSample accession, when available.
        namespace: ncbi.biosample_accession
      - name: bioproject_accession
        type: string
        description: Linked BioProject accession, when available.
      - name: organism
        type: string
        description: Source organism name, when available.
      - name: tax_id
        type: number
        description: NCBI Taxonomy identifier for the sample organism, when available.
        namespace: ncbi.taxonomy_id
      - name: platform
        type: string
        description: Sequencing platform family, when available.
      - name: instrument_model
        type: string
        description: Sequencing instrument model, when available.
      - name: library_strategy
        type: string
        description: SRA library strategy, for example RNA-Seq or WGS.
      - name: library_source
        type: string
        description: SRA library source, when available.
      - name: library_selection
        type: string
        description: SRA library selection method, when available.
      - name: library_layout
        type: string
        description: SRA library layout, for example SINGLE or PAIRED.
      - name: run_accessions
        type: array
        description: SRA run accessions associated with the experiment.
      - name: runs
        type: array
        description: Structured SRA run metadata from EFetch XML.
      - name: download_urls
        type: object
        description: SRA run browser and NCBI SRA record URLs derived from run accessions. These are download-planning links, not executed downloads.
      - name: download_files
        type: array
        description: Structured SRA download candidates using the shared download-file schema (kind, accession, url, format, availability, source, and optional size/md5 metadata). Wrappers may consume these later; the DB connector does not execute downloads.
  - id: geo
    dbParam: gds
    summary: NCBI Gene Expression Omnibus records from Entrez GEO DataSets metadata.
    identity:
      stableIdFields: [series_accession, accession, uid]
      namespace: ncbi.geo_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc={stable_id}
    commonFields:
      - uid
      - accession
      - title
      - summary
      - fetch_summary
      - organism
      - entry_type
      - gds_type
      - series_accession
      - platform_accession
      - dataset_accession
      - sample_accessions
      - samples
      - sample_count
      - pubmed_ids
      - bioproject_accession
      - ftp_link
      - download_urls
      - download_files
      - geo2r_available
      - published_date
    fields:
      - name: uid
        type: string
        description: NCBI GEO DataSets Entrez UID.
      - name: accession
        type: string
        description: Primary GEO accession, such as GSE, GSM, GPL, or GDS identifiers.
        synonyms:
          - geo_accession
          - gse_accession
          - gsm_accession
          - gpl_accession
          - gds_accession
        namespace: ncbi.geo_accession
      - name: title
        type: string
        description: GEO record title.
      - name: summary
        type: string
        description: GEO summary text from Entrez ESummary, when available.
      - name: fetch_summary
        type: string
        description: Short GEO EFetch text summary, when available.
      - name: organism
        type: string
        description: Source organism or taxa label, when available.
      - name: entry_type
        type: string
        description: GEO entry type, for example GSE, GSM, GPL, or GDS.
      - name: gds_type
        type: string
        description: GEO dataset or series study type, such as expression profiling by array.
      - name: series_accession
        type: string
        description: Linked GEO Series accession, when available.
        namespace: ncbi.geo_series_accession
      - name: platform_accession
        type: string
        description: Linked GEO Platform accession, when available.
        namespace: ncbi.geo_platform_accession
      - name: dataset_accession
        type: string
        description: Linked GEO DataSet accession, when available.
        namespace: ncbi.geo_dataset_accession
      - name: sample_accessions
        type: array
        description: GEO Sample accessions associated with this record, when available.
      - name: samples
        type: array
        description: Structured GEO sample metadata from Entrez ESummary.
      - name: sample_count
        type: number
        description: Number of GEO samples associated with this record, when available.
      - name: pubmed_ids
        type: array
        description: PubMed identifiers linked to this GEO record.
      - name: bioproject_accession
        type: string
        description: Linked BioProject accession, when available.
      - name: ftp_link
        type: string
        description: NCBI GEO FTP download URL, when available.
      - name: download_urls
        type: object
        description: Derived GEO Series download URLs for matrix, SOFT, MINiML, supplementary, and raw archive files when a GSE accession is available.
      - name: download_files
        type: array
        description: Structured GEO Series download candidates using the shared download-file schema (kind, accession, url, format, availability, source, and optional filename/size/compression metadata), derived from a GSE accession and enriched from official GEO matrix/SOFT/MINiML/supplementary directory listings when available.
      - name: geo2r_available
        type: boolean
        description: Whether GEO2R is available for this record, when reported by NCBI.
      - name: published_date
        type: date
        description: GEO publication or public release date, when available.
  - id: bioproject
    dbParam: bioproject
    summary: NCBI BioProject records with project scope, organism, data type, submitter, and linked accessions.
    identity:
      stableIdFields: [accession, project_id, uid]
      namespace: ncbi.bioproject_accession
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/bioproject/{stable_id}
    commonFields:
      - uid
      - accession
      - project_id
      - title
      - name
      - description
      - organism
      - tax_id
      - project_type
      - data_type
      - target_scope
      - target_material
      - target_capture
      - method_type
      - objectives
      - relevance
      - submitter_organization
      - registration_date
      - release_date
      - submitted_date
      - last_update
      - submission_id
      - access
      - geo_accessions
      - pubmed_ids
      - supergroup
      - sequencing_status
    fields:
      - name: uid
        type: string
        description: NCBI BioProject Entrez UID.
      - name: accession
        type: string
        description: BioProject accession, such as PRJNA identifiers.
        synonyms:
          - bioproject_accession
          - project_accession
          - prjna
        namespace: ncbi.bioproject_accession
      - name: project_id
        type: number
        description: Numeric BioProject identifier.
      - name: title
        type: string
        description: BioProject title.
      - name: name
        type: string
        description: BioProject name, when distinct from the title.
      - name: description
        type: string
        description: BioProject description text.
      - name: organism
        type: string
        description: Project organism name, when available.
      - name: tax_id
        type: number
        description: NCBI Taxonomy identifier for the BioProject organism, when available.
        namespace: ncbi.taxonomy_id
      - name: project_type
        type: string
        description: BioProject submission type.
      - name: data_type
        type: string
        description: BioProject data type label.
      - name: target_scope
        type: string
        description: Project target scope, when available.
      - name: target_material
        type: string
        description: Project target material, when available.
      - name: target_capture
        type: string
        description: Project target capture, when available.
      - name: method_type
        type: string
        description: Project method type, when available.
      - name: objectives
        type: array
        description: Project objectives reported by NCBI.
      - name: relevance
        type: object
        description: Project relevance flags, such as medical or agricultural relevance.
      - name: submitter_organization
        type: string
        description: Submitting organization, when available.
      - name: registration_date
        type: date
        description: BioProject registration date from ESummary.
      - name: release_date
        type: date
        description: BioProject public release date from EFetch XML, when available.
      - name: submitted_date
        type: date
        description: BioProject submission date from EFetch XML, when available.
      - name: last_update
        type: date
        description: BioProject last update date from EFetch XML, when available.
      - name: submission_id
        type: string
        description: BioProject submission identifier, when available.
      - name: access
        type: string
        description: BioProject access status, for example public.
      - name: geo_accessions
        type: array
        description: Linked GEO accessions from BioProject EFetch XML.
      - name: pubmed_ids
        type: array
        description: PubMed identifiers linked to this BioProject.
      - name: supergroup
        type: string
        description: NCBI organism supergroup, when available.
      - name: sequencing_status
        type: string
        description: Sequencing status label, when available.
  - id: taxonomy
    dbParam: taxonomy
    summary: NCBI Taxonomy organism records, ranks, lineage, and genetic code metadata.
    identity:
      stableIdFields: [tax_id, uid]
      namespace: ncbi.taxonomy_id
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?id={stable_id}
    commonFields:
      - uid
      - tax_id
      - scientific_name
      - common_name
      - rank
      - division
      - lineage
      - parent_tax_id
      - synonyms
      - genetic_code
      - mitochondrial_genetic_code
    fields:
      - name: uid
        type: string
        description: NCBI Taxonomy Entrez UID.
      - name: tax_id
        type: number
        description: NCBI Taxonomy identifier.
        namespace: ncbi.taxonomy_id
      - name: scientific_name
        type: string
        description: Scientific organism name.
      - name: common_name
        type: string
        description: Common organism name, when available.
      - name: rank
        type: string
        description: Taxonomic rank, when available.
      - name: division
        type: string
        description: NCBI taxonomy division label, when available.
      - name: lineage
        type: string
        description: Semicolon-delimited lineage text from NCBI EFetch XML, when available.
      - name: parent_tax_id
        type: number
        description: Parent NCBI Taxonomy identifier, when available.
      - name: synonyms
        type: array
        description: Taxonomy synonyms and equivalent names from NCBI EFetch XML, when available.
      - name: genetic_code
        type: object
        description: Nuclear genetic code id and label from NCBI EFetch XML, when available.
      - name: mitochondrial_genetic_code
        type: object
        description: Mitochondrial genetic code id and label from NCBI EFetch XML, when available.
  - id: clinvar
    dbParam: clinvar
    summary: Clinical variant assertions and significance.
    identity:
      stableIdFields: [variation_id]
      namespace: clinvar.variation_id
      primaryUrlTemplate: https://www.ncbi.nlm.nih.gov/clinvar/variation/{stable_id}/
    commonFields:
      - uid
      - title
      - accession
      - variation_id
      - clinical_significance
      - condition
      - review_status
      - last_evaluated
      - gene
    fields:
      - name: uid
        type: string
        description: ClinVar Entrez UID.
      - name: title
        type: string
        description: ClinVar summary title.
      - name: accession
        type: string
        description: ClinVar accession, when available.
      - name: variation_id
        type: string
        description: ClinVar variation identifier.
        namespace: clinvar.variation_id
      - name: clinical_significance
        type: string
        description: Reported clinical significance.
      - name: condition
        type: array
        description: Reported disease or phenotype names from ClinVar EFetch XML, when available.
      - name: review_status
        type: string
        description: ClinVar review status, when available.
      - name: last_evaluated
        type: date
        description: Last evaluation date for the clinical significance assertion, when available.
      - name: molecular_consequence
        type: array
        description: Reported molecular consequences from ClinVar EFetch XML, when available.
      - name: variant_type
        type: string
        description: ClinVar variant type, when available.
xref:
  - from:
      domain: gene
      field: symbol
      namespace: hgnc.symbol
      species: '9606'
    to:
      database: rest-json/uniprot
      domain: protein
      field: gene_name
      namespace: hgnc.symbol
