phiDbConnectorVersion: 1
id: ontology/doid
name: Disease Ontology (OLS)
protocolFamily: ontology
curationTier: curated
baseUrl: https://www.ebi.ac.uk/ols4/api
networkPolicy:
  allowedHosts:
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: term
    summary: Look up a Disease Ontology term by DOID or IRI through EBI OLS.
    identity:
      stableIdFields: [obo_id]
      namespace: doid.id
      primaryUrlTemplate: https://disease-ontology.org/?id={stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: doid
      operation: lookup
      idPrefix: DOID
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Disease Ontology identifier such as DOID:162.
        synonyms: [doid, disease_id, term_id]
        namespace: doid.id
      - name: obo_id
        type: string
        description: Compact OBO identifier.
        namespace: doid.id
      - name: label
        type: string
        description: Preferred disease label.
      - name: description
        type: string
        description: Disease definition.
      - name: synonyms
        type: array
        description: Synonym list.
  - id: search
    summary: Search Disease Ontology terms by label, synonym, or free text.
    identity:
      stableIdFields: [obo_id]
      namespace: doid.id
      primaryUrlTemplate: https://disease-ontology.org/?id={stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: doid
      operation: search
      idPrefix: DOID
    fields:
      - name: q
        type: string
        description: Free-text disease search query.
        synonyms: [query, term, keyword, disease]
  - id: children
    summary: Direct child terms of a Disease Ontology term.
    identity:
      stableIdFields: [obo_id]
      namespace: doid.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: doid
      operation: children
      idPrefix: DOID
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Parent DOID.
        namespace: doid.id
  - id: parents
    summary: Direct parent terms of a Disease Ontology term.
    identity:
      stableIdFields: [obo_id]
      namespace: doid.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: doid
      operation: parents
      idPrefix: DOID
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Child DOID.
        namespace: doid.id
  - id: ancestors
    summary: Hierarchical ancestor terms of a Disease Ontology term.
    identity:
      stableIdFields: [obo_id]
      namespace: doid.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: doid
      operation: ancestors
      idPrefix: DOID
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Descendant DOID.
        namespace: doid.id
xref:
  - from:
      domain: search
      field: obo_id
      namespace: doid.id
    to:
      domain: term
      field: id
      namespace: doid.id
