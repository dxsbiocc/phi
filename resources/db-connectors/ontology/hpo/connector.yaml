phiDbConnectorVersion: 1
id: ontology/hpo
name: Human Phenotype Ontology (OLS)
protocolFamily: ontology
curationTier: curated
baseUrl: https://www.ebi.ac.uk/ols4/api
networkPolicy:
  allowedHosts:
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: term
    summary: Look up a Human Phenotype Ontology term by HP id or IRI through EBI OLS.
    identity:
      stableIdFields: [obo_id]
      namespace: hpo.id
      primaryUrlTemplate: https://hpo.jax.org/browse/term/{stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: hp
      operation: lookup
      idPrefix: HP
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: HPO identifier such as HP:0001250.
        synonyms: [hp_id, phenotype_id, term_id]
        namespace: hpo.id
      - name: obo_id
        type: string
        description: Compact OBO identifier.
        namespace: hpo.id
      - name: label
        type: string
        description: Preferred phenotype label.
      - name: description
        type: string
        description: Phenotype definition.
      - name: synonyms
        type: array
        description: Synonym list.
  - id: search
    summary: Search Human Phenotype Ontology terms by label, synonym, or free text.
    identity:
      stableIdFields: [obo_id]
      namespace: hpo.id
      primaryUrlTemplate: https://hpo.jax.org/browse/term/{stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: hp
      operation: search
      idPrefix: HP
    fields:
      - name: q
        type: string
        description: Free-text phenotype search query.
        synonyms: [query, term, keyword, phenotype]
  - id: children
    summary: Direct child terms of an HPO term.
    identity:
      stableIdFields: [obo_id]
      namespace: hpo.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: hp
      operation: children
      idPrefix: HP
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Parent HPO identifier.
        namespace: hpo.id
  - id: parents
    summary: Direct parent terms of an HPO term.
    identity:
      stableIdFields: [obo_id]
      namespace: hpo.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: hp
      operation: parents
      idPrefix: HP
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Child HPO identifier.
        namespace: hpo.id
  - id: ancestors
    summary: Hierarchical ancestor terms of an HPO term.
    identity:
      stableIdFields: [obo_id]
      namespace: hpo.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: hp
      operation: ancestors
      idPrefix: HP
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Descendant HPO identifier.
        namespace: hpo.id
xref:
  - from:
      domain: search
      field: obo_id
      namespace: hpo.id
    to:
      domain: term
      field: id
      namespace: hpo.id
