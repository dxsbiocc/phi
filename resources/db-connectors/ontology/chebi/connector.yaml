phiDbConnectorVersion: 1
id: ontology/chebi
name: ChEBI (OLS)
protocolFamily: ontology
curationTier: curated
baseUrl: https://www.ebi.ac.uk/ols4/api
networkPolicy:
  allowedHosts:
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: term
    summary: Look up a ChEBI chemical entity by CHEBI id through EBI OLS.
    identity:
      stableIdFields: [obo_id]
      namespace: chebi.id
      primaryUrlTemplate: https://www.ebi.ac.uk/chebi/searchId.do?chebiId={stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: chebi
      operation: lookup
      idPrefix: CHEBI
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: ChEBI identifier such as CHEBI:15365.
        synonyms: [chebi_id, term_id, accession]
        namespace: chebi.id
      - name: obo_id
        type: string
        description: Compact OBO identifier.
        namespace: chebi.id
      - name: label
        type: string
        description: Preferred ChEBI name.
      - name: description
        type: string
        description: Term definition text.
      - name: synonyms
        type: array
        description: Synonym list.
  - id: search
    summary: Search ChEBI terms by name, synonym, or free text.
    identity:
      stableIdFields: [obo_id]
      namespace: chebi.id
      primaryUrlTemplate: https://www.ebi.ac.uk/chebi/searchId.do?chebiId={stable_id}
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id, is_obsolete]
    ontology:
      ontologyId: chebi
      operation: search
      idPrefix: CHEBI
    fields:
      - name: q
        type: string
        description: Free-text ChEBI search query.
        synonyms: [query, term, keyword, name]
  - id: children
    summary: Direct child terms of a ChEBI entity in OLS.
    identity:
      stableIdFields: [obo_id]
      namespace: chebi.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: chebi
      operation: children
      idPrefix: CHEBI
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Parent ChEBI identifier.
        namespace: chebi.id
  - id: parents
    summary: Direct parent terms of a ChEBI entity in OLS.
    identity:
      stableIdFields: [obo_id]
      namespace: chebi.id
    commonFields: [id, obo_id, iri, label, description, synonyms, ontology_id]
    ontology:
      ontologyId: chebi
      operation: parents
      idPrefix: CHEBI
      iriTemplate: http://purl.obolibrary.org/obo/{local_id}
    fields:
      - name: id
        type: string
        description: Child ChEBI identifier.
        namespace: chebi.id
xref:
  - from:
      domain: search
      field: obo_id
      namespace: chebi.id
    to:
      domain: term
      field: id
      namespace: chebi.id
  - from:
      domain: term
      field: label
      namespace: chebi.name
    to:
      database: rest-json/pubchem
      domain: compound_by_name
      field: name
      namespace: pubchem.name
