phiDbConnectorVersion: 1
id: sparql/uniprot
name: UniProt SPARQL (advanced)
protocolFamily: sparql
curationTier: curated
baseUrl: https://sparql.uniprot.org/sparql
networkPolicy:
  allowedHosts:
    - sparql.uniprot.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 3
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: protein
    summary: Advanced UniProt RDF/SPARQL protein graph query endpoint for custom graph joins; use rest-json/uniprot for ordinary UniProtKB lookups.
    identity:
      stableIdFields: [accession]
      namespace: uniprot.accession
      primaryUrlTemplate: https://www.uniprot.org/uniprotkb/{stable_id}/entry
    commonFields:
      - accession
      - mnemonic
      - protein_name
      - gene_name
      - organism
      - sequence
    sparql:
      query: |
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX up: <http://purl.uniprot.org/core/>
        PREFIX taxon: <http://purl.uniprot.org/taxonomy/>
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        SELECT ?accession ?mnemonic ?protein_name ?gene_name ?organism ?sequence WHERE {
          ?protein a up:Protein ;
            up:organism taxon:9606 ;
            up:mnemonic ?mnemonic ;
            up:encodedBy ?gene .
          ?gene skos:prefLabel ?gene_name .
          OPTIONAL { ?protein up:recommendedName/up:fullName ?protein_name . }
          OPTIONAL { ?protein up:sequence/rdf:value ?sequence . }
          FILTER (UCASE(STR(?gene_name)) = UCASE("{filter:gene_name}"))
          BIND(REPLACE(STR(?protein), "^http://purl.uniprot.org/uniprot/", "") AS ?accession)
          BIND("Homo sapiens" AS ?organism)
        }
    fields:
      - name: gene_name
        type: string
        description: Human gene symbol used to find encoded UniProt proteins.
        synonyms:
          - gene
          - gene_symbol
          - hgnc_symbol
        namespace: hgnc.symbol
      - name: accession
        type: string
        description: UniProt accession.
        namespace: uniprot.accession
      - name: mnemonic
        type: string
        description: UniProt entry mnemonic.
      - name: protein_name
        type: string
        description: Recommended protein name, when available.
      - name: organism
        type: string
        description: Organism label constrained to Homo sapiens in this Phase 1 connector.
      - name: sequence
        type: string
        description: Canonical UniProt protein amino acid sequence, when available.
xref:
  - from:
      domain: protein
      field: gene_name
      namespace: hgnc.symbol
      species: '9606'
    to:
      domain: protein
      field: accession
      namespace: uniprot.accession
      species: '9606'
