phiDbConnectorVersion: 1
id: rest-json/myvariant
name: MyVariant.info
protocolFamily: rest-json
curationTier: curated
baseUrl: https://myvariant.info/v1
networkPolicy:
  allowedHosts:
    - myvariant.info
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 8
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: query
    summary: Query MyVariant.info by rsID or text for cached ClinVar/gnomAD/dbNSFP/CADD snippets.
    identity:
      stableIdFields: [_id]
      namespace: myvariant.id
      primaryUrlTemplate: https://myvariant.info/v1/variant/{stable_id}
    commonFields:
      [_id, _score, rsid, chrom, hg19, dbsnp, clinvar, gnomad_exome, cadd]
    rest:
      request:
        path: /query
        rawQueryParam: q
        limitParam: size
        cursorParam: from
        filterParamMap: { fields: fields, assembly: assembly, email: email }
      response:
        rowsPath: hits
        totalRowsPath: total
    fields:
      - name: _id
        type: string
        description: MyVariant document id (often hg19 HGVS genomic).
      - name: rsid
        type: string
        description: dbSNP rsID when present.
        namespace: dbsnp.rsid
      - name: clinvar
        type: object
        description: Cached ClinVar snippet (confirm at live ClinVar for clinical use).
      - name: cadd
        type: object
        description: Cached CADD scores (treat as approximate; prefer live VEP for reporting).
  - id: variant
    summary: Fetch one MyVariant document by genomic HGVS id (default assembly hg19).
    identity:
      stableIdFields: [_id]
      namespace: myvariant.id
      primaryUrlTemplate: https://myvariant.info/v1/variant/{stable_id}
    commonFields:
      [_id, rsid, chrom, hg19, dbsnp, clinvar, gnomad_exome, cadd, snpeff]
    rest:
      request:
        path: /variant/{filter:variantId}
        filterParamMap: { fields: fields, assembly: assembly, email: email }
      response:
        rowsPath: $
    fields:
      - name: variantId
        type: string
        description: MyVariant id such as chr17:g.7578406C>G (hg19 by default).
        synonyms: [id, _id, hgvs]
      - name: assembly
        type: string
        description: Optional assembly hint; prefer querying by rsID when unsure.
xref:
  - from:
      domain: query
      field: rsid
      namespace: dbsnp.rsid
    to:
      database: entrez/ncbi
      domain: snp
      field: uid
      namespace: dbsnp.rsid
