phiDbConnectorVersion: 1
id: rest-json/openfda
name: OpenFDA
protocolFamily: rest-json
curationTier: curated
baseUrl: https://api.fda.gov
networkPolicy:
  allowedHosts:
    - api.fda.gov
  allowRedirects: false
auth:
  type: api_key_query_param
  envVar: OPENFDA_API_KEY
  paramName: api_key
  required: false
  label: OpenFDA API key
  signupUrl: https://open.fda.gov/apis/authentication/
rateLimit:
  withAuth:
    requestsPerSecond: 4
  withoutAuth:
    requestsPerSecond: 1
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: drug_label
    summary: Drug product labeling (SPL) by OpenFDA search syntax or drug name.
    identity:
      stableIdFields: [id]
      namespace: openfda.label
    commonFields:
      [id, effective_time, brand_name, generic_name, manufacturer_name, indications_and_usage, warnings]
    rest:
      request:
        path: /drug/label.json
        rawQueryParam: search
        limitParam: limit
        cursorParam: skip
        filterParamMap: { count: count }
      response:
        rowsPath: results
        totalRowsPath: meta.results.total
        fieldMap:
          id: id
          effective_time: effective_time
          brand_name: openfda.brand_name
          generic_name: openfda.generic_name
          manufacturer_name: openfda.manufacturer_name
          indications_and_usage: indications_and_usage
          warnings: warnings
    fields:
      - name: brand_name
        type: array
        description: Brand name(s) from openfda harmonized fields.
      - name: generic_name
        type: array
        description: Generic name(s).
      - name: indications_and_usage
        type: array
        description: Indications and usage text sections.
  - id: drug_event
    summary: FAERS adverse event reports by OpenFDA search syntax.
    identity:
      stableIdFields: [safetyreportid]
      namespace: openfda.safety_report
    commonFields:
      [safetyreportid, receivedate, serious, patientsex, reactions, drugs]
    rest:
      request:
        path: /drug/event.json
        rawQueryParam: search
        limitParam: limit
        cursorParam: skip
        filterParamMap: { count: count }
      response:
        rowsPath: results
        totalRowsPath: meta.results.total
        fieldMap:
          safetyreportid: safetyreportid
          receivedate: receivedate
          serious: serious
          patientsex: patient.patientsex
          reactions: patient.reaction
          drugs: patient.drug
    fields:
      - name: safetyreportid
        type: string
        description: FAERS safety report identifier.
      - name: serious
        type: string
        description: Seriousness flag when present.
  - id: drug_enforcement
    summary: Drug recall / enforcement reports.
    identity:
      stableIdFields: [recall_number]
      namespace: openfda.recall
    commonFields:
      [recall_number, status, classification, product_description, reason_for_recall, recalling_firm, report_date]
    rest:
      request:
        path: /drug/enforcement.json
        rawQueryParam: search
        limitParam: limit
        cursorParam: skip
      response:
        rowsPath: results
        totalRowsPath: meta.results.total
    fields:
      - name: recall_number
        type: string
        description: Recall number.
      - name: classification
        type: string
        description: Recall classification (Class I/II/III).
      - name: reason_for_recall
        type: string
        description: Stated reason for recall.
  - id: drug_label_by_name
    summary: Drug labeling by brand or generic name without writing OpenFDA Lucene syntax.
    identity:
      stableIdFields: [id]
      namespace: openfda.label
    commonFields:
      [id, effective_time, brand_name, generic_name, manufacturer_name, indications_and_usage, warnings]
    rest:
      request:
        path: /drug/label.json
        limitParam: limit
        cursorParam: skip
        queryParams:
          search: 'openfda.brand_name:"{filter:name}" OR openfda.generic_name:"{filter:name}"'
      response:
        rowsPath: results
        totalRowsPath: meta.results.total
        fieldMap:
          id: id
          effective_time: effective_time
          brand_name: openfda.brand_name
          generic_name: openfda.generic_name
          manufacturer_name: openfda.manufacturer_name
          indications_and_usage: indications_and_usage
          warnings: warnings
    fields:
      - name: name
        type: string
        description: Brand or generic drug name such as aspirin or metformin.
        synonyms: [drug, brand, generic, query]
      - name: brand_name
        type: array
        description: Brand name(s) from openfda harmonized fields.
      - name: generic_name
        type: array
        description: Generic name(s).
  - id: drug_event_by_name
    summary: FAERS adverse events by brand or generic drug name.
    identity:
      stableIdFields: [safetyreportid]
      namespace: openfda.safety_report
    commonFields:
      [safetyreportid, receivedate, serious, patientsex, reactions, drugs]
    rest:
      request:
        path: /drug/event.json
        limitParam: limit
        cursorParam: skip
        queryParams:
          search: 'patient.drug.openfda.brand_name:"{filter:name}" OR patient.drug.openfda.generic_name:"{filter:name}"'
      response:
        rowsPath: results
        totalRowsPath: meta.results.total
        fieldMap:
          safetyreportid: safetyreportid
          receivedate: receivedate
          serious: serious
          patientsex: patient.patientsex
          reactions: patient.reaction
          drugs: patient.drug
    fields:
      - name: name
        type: string
        description: Brand or generic drug name such as ibuprofen.
        synonyms: [drug, brand, generic, query]
      - name: safetyreportid
        type: string
        description: FAERS safety report identifier.
      - name: serious
        type: string
        description: Seriousness flag when present.
