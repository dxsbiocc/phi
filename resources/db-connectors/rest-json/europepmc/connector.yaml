phiDbConnectorVersion: 1
id: rest-json/europepmc
name: Europe PMC
protocolFamily: rest-json
curationTier: curated
baseUrl: https://www.ebi.ac.uk/europepmc/webservices/rest
networkPolicy:
  allowedHosts:
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: search
    summary: Search Europe PMC literature by free-text or fielded query.
    identity:
      stableIdFields: [id]
      namespace: europepmc.id
      primaryUrlTemplate: https://europepmc.org/article/{stable_id}
    commonFields:
      [
        id,
        source,
        pmid,
        pmcid,
        doi,
        title,
        authorString,
        journalTitle,
        pubYear,
        abstractText,
        isOpenAccess,
        citedByCount
      ]
    rest:
      request:
        path: /search
        rawQueryParam: query
        limitParam: pageSize
        cursorParam: cursorMark
        filterParamMap:
          {
            resultType: resultType,
            sort: sort,
            fromSearchDate: fromSearchDate,
            toSearchDate: toSearchDate
          }
        queryParams:
          format: json
          resultType: core
      response:
        rowsPath: resultList.result
        totalRowsPath: hitCount
        nextCursorPath: nextCursorMark
    fields:
      - name: pmid
        type: string
        description: PubMed ID when available.
        namespace: pubmed.pmid
      - name: pmcid
        type: string
        description: PubMed Central ID when available.
      - name: doi
        type: string
        description: Digital Object Identifier.
      - name: title
        type: string
        description: Article title.
      - name: abstractText
        type: string
        description: Abstract text when resultType includes core fields.
  - id: article
    summary: Fetch one Europe PMC article by source and id (for example MED/PMID).
    identity:
      stableIdFields: [id]
      namespace: europepmc.id
      primaryUrlTemplate: https://europepmc.org/article/{stable_id}
    commonFields:
      [
        id,
        source,
        pmid,
        pmcid,
        doi,
        title,
        authorString,
        journalTitle,
        pubYear,
        abstractText,
        isOpenAccess,
        citedByCount
      ]
    rest:
      request:
        path: /article/{filter:source}/{filter:articleId}
        queryParams:
          format: json
          resultType: core
      response:
        rowsPath: result
    fields:
      - name: source
        type: string
        description: Europe PMC source code such as MED, PMC, or PPR.
      - name: articleId
        type: string
        description: Article identifier within the source, often a PMID.
        synonyms: [id, pmid]
        namespace: pubmed.pmid
  - id: citations
    summary: Articles that cite a given Europe PMC record (forward citations).
    identity:
      stableIdFields: [id]
      namespace: europepmc.id
      primaryUrlTemplate: https://europepmc.org/article/{stable_id}
    commonFields: [id, source, title, authorString, journalAbbreviation, pubYear, citedByCount]
    rest:
      request:
        path: /{filter:source}/{filter:articleId}/citations
        limitParam: pageSize
        cursorParam: page
        queryParams:
          format: json
      response:
        rowsPath: citationList.citation
        totalRowsPath: hitCount
    fields:
      - name: source
        type: string
        description: Europe PMC source code such as MED.
        synonyms: [src]
      - name: articleId
        type: string
        description: Article identifier within the source, often a PMID.
        synonyms: [id, pmid]
        namespace: pubmed.pmid
      - name: title
        type: string
        description: Citing article title.
      - name: citedByCount
        type: number
        description: Citation count for the citing article when present.
  - id: references
    summary: References cited by a given Europe PMC record (backward citations).
    identity:
      stableIdFields: [id]
      namespace: europepmc.id
      primaryUrlTemplate: https://europepmc.org/article/{stable_id}
    commonFields: [id, source, title, authorString, journalAbbreviation, pubYear, citedByCount]
    rest:
      request:
        path: /{filter:source}/{filter:articleId}/references
        limitParam: pageSize
        cursorParam: page
        queryParams:
          format: json
      response:
        rowsPath: referenceList.reference
        totalRowsPath: hitCount
    fields:
      - name: source
        type: string
        description: Europe PMC source code such as MED.
      - name: articleId
        type: string
        description: Article identifier within the source, often a PMID.
        synonyms: [id, pmid]
        namespace: pubmed.pmid
xref:
  - from:
      domain: search
      field: pmid
      namespace: pubmed.pmid
    to:
      database: entrez/ncbi
      domain: pubmed
      field: uid
      namespace: pubmed.pmid
