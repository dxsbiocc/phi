phiDbConnectorVersion: 1
id: rest-json/alphafold
name: AlphaFold DB
protocolFamily: rest-json
curationTier: curated
baseUrl: https://alphafold.ebi.ac.uk/api
networkPolicy:
  allowedHosts:
    - alphafold.ebi.ac.uk
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: prediction
    summary: AlphaFold structure prediction metadata by UniProt accession.
    identity:
      stableIdFields: [entryId]
      namespace: alphafold.entry_id
      primaryUrlTemplate: https://alphafold.ebi.ac.uk/entry/{stable_id}
    commonFields:
      [
        entryId,
        gene,
        uniprotAccession,
        uniprotId,
        uniprotDescription,
        taxId,
        organismScientificName,
        modelCreatedDate,
        latestVersion,
        cifUrl,
        pdbUrl,
        bcifUrl,
        paeImageUrl,
        uniprotStart,
        uniprotEnd,
        fractionPlddtVeryHigh,
        fractionPlddtConfident,
        fractionPlddtLow,
        fractionPlddtVeryLow
      ]
    rest:
      request:
        path: /prediction/{filter:uniprotAccession}
      response:
        rowsPath: $
    fields:
      - name: uniprotAccession
        type: string
        description: UniProt accession used for AlphaFold lookup.
        synonyms: [accession, uniprot, uniprot_id]
        namespace: uniprot.accession
      - name: entryId
        type: string
        description: AlphaFold entry identifier.
        namespace: alphafold.entry_id
      - name: gene
        type: string
        description: Gene symbol when available.
        namespace: hgnc.symbol
      - name: cifUrl
        type: string
        description: mmCIF model download URL.
      - name: pdbUrl
        type: string
        description: PDB model download URL.
  - id: structure_summary
    summary: 3D-Beacons structure coverage for a UniProt accession (AlphaFold + experimental models).
    identity:
      stableIdFields: [model_identifier]
      namespace: pdbe.model_id
    commonFields:
      [
        model_identifier,
        model_category,
        provider,
        model_format,
        model_url,
        model_page_url,
        resolution,
        coverage,
        uniprot_start,
        uniprot_end,
        experimental_method
      ]
    rest:
      request:
        path: https://www.ebi.ac.uk/pdbe/pdbe-kb/3dbeacons/api/uniprot/summary/{filter:uniprotAccession}.json
      response:
        rowsPath: structures
        fieldMap:
          model_identifier: summary.model_identifier
          model_category: summary.model_category
          provider: summary.provider
          model_format: summary.model_format
          model_url: summary.model_url
          model_page_url: summary.model_page_url
          resolution: summary.resolution
          coverage: summary.coverage
          uniprot_start: summary.uniprot_start
          uniprot_end: summary.uniprot_end
          experimental_method: summary.experimental_method
    fields:
      - name: uniprotAccession
        type: string
        description: UniProt accession for structure coverage summary.
        synonyms: [accession, uniprot, uniprot_id, query]
        namespace: uniprot.accession
      - name: model_identifier
        type: string
        description: Provider model identifier (PDB id or AlphaFold entry fragment).
      - name: provider
        type: string
        description: Structure provider such as AlphaFold DB or PDBe.
      - name: model_category
        type: string
        description: EXPERIMENTALLY DETERMINED or TEMPLATE-BASED / ab initio category label.
xref:
  - from:
      domain: prediction
      field: uniprotAccession
      namespace: uniprot.accession
    to:
      database: rest-json/uniprot
      domain: protein
      field: accession
      namespace: uniprot.accession
  - from:
      domain: structure_summary
      field: uniprotAccession
      namespace: uniprot.accession
    to:
      database: rest-json/uniprot
      domain: protein
      field: accession
      namespace: uniprot.accession
