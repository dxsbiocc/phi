phiDbConnectorVersion: 1
id: rest-json/zinc
name: ZINC
protocolFamily: rest-json
curationTier: curated
baseUrl: https://zinc.docking.org
networkPolicy:
  allowedHosts:
    - zinc.docking.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 2
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 800
  maxDelayMs: 8000
domains:
  - id: substance
    summary: Look up a ZINC substance by ZINC ID.
    identity:
      stableIdFields: [zinc_id]
      namespace: zinc.id
      primaryUrlTemplate: https://zinc.docking.org/substances/{stable_id}/
    commonFields:
      [zinc_id, preferred_name, smiles, inchikey, mol_formula, mwt, logp, reactive, purchasability]
    rest:
      request:
        path: /substances/{filter:zinc_id}.json
      response:
        rowsPath: $
    fields:
      - name: zinc_id
        type: string
        description: ZINC identifier such as ZINC000000000053.
        synonyms: [id, zinc, query]
        namespace: zinc.id
      - name: smiles
        type: string
        description: Canonical SMILES when returned.
      - name: preferred_name
        type: string
        description: Preferred substance name.
  - id: substance_search
    summary: Search substances by preferred name, InChIKey, or molecular formula.
    identity:
      stableIdFields: [zinc_id]
      namespace: zinc.id
    commonFields:
      [zinc_id, preferred_name, smiles, inchikey, mol_formula, mwt]
    rest:
      request:
        path: /substances.json
        filterParamMap:
          {
            preferred_name: preferred_name,
            inchikey: inchikey,
            mol_formula: mol_formula
          }
        limitParam: count
      response:
        rowsPath: $
    fields:
      - name: preferred_name
        type: string
        description: Preferred name search such as aspirin.
        synonyms: [name, query]
      - name: inchikey
        type: string
        description: InChIKey exact search.
      - name: mol_formula
        type: string
        description: Molecular formula such as C9H8O4.
  - id: subset
    summary: Browse a ZINC substance subset such as fda or in-stock.
    identity:
      stableIdFields: [zinc_id]
      namespace: zinc.id
    commonFields: [zinc_id, preferred_name, smiles, purchasability]
    rest:
      request:
        path: /substances/subsets/{filter:subset}.json
        limitParam: count
      response:
        rowsPath: $
    fields:
      - name: subset
        type: string
        description: Subset name such as fda, in-stock, or metabolites.
        synonyms: [catalog, query]
