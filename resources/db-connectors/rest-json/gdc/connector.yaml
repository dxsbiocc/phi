phiDbConnectorVersion: 1
id: rest-json/gdc
name: NCI GDC
protocolFamily: rest-json
curationTier: curated
baseUrl: https://api.gdc.cancer.gov
networkPolicy:
  allowedHosts:
    - api.gdc.cancer.gov
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: projects
    summary: List GDC projects with optional pagination.
    identity:
      stableIdFields: [project_id]
      namespace: gdc.project_id
      primaryUrlTemplate: https://portal.gdc.cancer.gov/projects/{stable_id}
    commonFields:
      [
        id,
        project_id,
        name,
        disease_type,
        primary_site,
        dbgap_accession_number,
        releasable,
        released,
        state,
        summary
      ]
    rest:
      request:
        path: /projects
        limitParam: size
        cursorParam: from
        filterParamMap: { pretty: pretty, fields: fields, expand: expand, format: format }
        queryParams:
          format: JSON
      response:
        rowsPath: data.hits
        totalRowsPath: data.pagination.total
    fields:
      - name: project_id
        type: string
        description: GDC project identifier such as TCGA-BRCA.
        namespace: gdc.project_id
      - name: name
        type: string
        description: Project display name.
      - name: primary_site
        type: array
        description: Primary sites covered by the project.
      - name: disease_type
        type: array
        description: Disease types covered by the project.
  - id: project
    summary: Fetch one GDC project by project_id.
    identity:
      stableIdFields: [project_id]
      namespace: gdc.project_id
      primaryUrlTemplate: https://portal.gdc.cancer.gov/projects/{stable_id}
    commonFields:
      [id, project_id, name, disease_type, primary_site, dbgap_accession_number, summary]
    rest:
      request:
        path: /projects/{filter:project_id}
        filterParamMap: { fields: fields, expand: expand, pretty: pretty }
        queryParams:
          format: JSON
      response:
        rowsPath: data
    fields:
      - name: project_id
        type: string
        description: GDC project identifier.
        synonyms: [project, id]
        namespace: gdc.project_id
  - id: gene
    summary: Fetch one GDC gene by Ensembl gene ID.
    identity:
      stableIdFields: [gene_id]
      namespace: ensembl.gene_id
      primaryUrlTemplate: https://portal.gdc.cancer.gov/genes/{stable_id}
    commonFields:
      [
        gene_id,
        symbol,
        name,
        biotype,
        chromosome,
        start,
        end,
        strand,
        description,
        synonyms,
        canonical_transcript_id
      ]
    rest:
      request:
        path: /genes/{filter:gene_id}
        filterParamMap: { fields: fields, expand: expand, pretty: pretty }
        queryParams:
          format: JSON
      response:
        rowsPath: data
    fields:
      - name: gene_id
        type: string
        description: Ensembl gene identifier such as ENSG00000141510.
        synonyms: [ensembl, ensembl_gene_id, id]
        namespace: ensembl.gene_id
      - name: symbol
        type: string
        description: Gene symbol.
        namespace: hgnc.symbol
      - name: biotype
        type: string
        description: Gene biotype.
      - name: chromosome
        type: string
        description: Chromosome name.
  - id: case
    summary: Fetch one GDC case by case UUID or submitter ID path when supported by GDC.
    identity:
      stableIdFields: [id]
      namespace: gdc.case_id
      primaryUrlTemplate: https://portal.gdc.cancer.gov/cases/{stable_id}
    commonFields:
      [id, submitter_id, disease_type, primary_site, project, demographic, diagnoses, samples]
    rest:
      request:
        path: /cases/{filter:case_id}
        filterParamMap: { fields: fields, expand: expand, pretty: pretty }
        queryParams:
          format: JSON
      response:
        rowsPath: data
    fields:
      - name: case_id
        type: string
        description: GDC case UUID.
        synonyms: [id, case, uuid]
        namespace: gdc.case_id
  - id: files
    summary: List GDC files with optional field projection and pagination.
    identity:
      stableIdFields: [id]
      namespace: gdc.file_id
      primaryUrlTemplate: https://portal.gdc.cancer.gov/files/{stable_id}
    commonFields:
      [
        id,
        file_name,
        file_size,
        data_category,
        data_type,
        data_format,
        access,
        experimental_strategy,
        state,
        md5sum
      ]
    rest:
      request:
        path: /files
        limitParam: size
        cursorParam: from
        filterParamMap: { fields: fields, expand: expand, pretty: pretty, filters: filters }
        queryParams:
          format: JSON
      response:
        rowsPath: data.hits
        totalRowsPath: data.pagination.total
    fields:
      - name: filters
        type: string
        description: Optional GDC JSON filters string for advanced file queries.
      - name: id
        type: string
        description: GDC file UUID.
        namespace: gdc.file_id
      - name: file_name
        type: string
        description: File name.
      - name: data_category
        type: string
        description: GDC data category.
      - name: data_type
        type: string
        description: GDC data type.
      - name: experimental_strategy
        type: string
        description: Experimental strategy when available.
xref:
  - from:
      domain: gene
      field: symbol
      namespace: hgnc.symbol
      species: '9606'
    to:
      domain: gene
      field: gene_id
      namespace: ensembl.gene_id
      species: '9606'
  - from:
      domain: project
      field: project_id
      namespace: gdc.project_id
    to:
      database: rest-json/cbioportal
      domain: study
      field: studyId
      namespace: cbioportal.study_id
