phiDbConnectorVersion: 1
id: rest-json/gnomad
name: gnomAD
protocolFamily: rest-json
curationTier: curated
baseUrl: https://gnomad.broadinstitute.org
networkPolicy:
  allowedHosts:
    - gnomad.broadinstitute.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 1
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 800
  maxDelayMs: 8000
domains:
  - id: variant
    summary: Population allele frequencies for a variant (chrom-pos-ref-alt) in gnomAD v4.
    identity:
      stableIdFields: [variant_id]
      namespace: gnomad.variant_id
      primaryUrlTemplate: https://gnomad.broadinstitute.org/variant/{stable_id}?dataset=gnomad_r4
    commonFields:
      [
        variant_id,
        rsids,
        chrom,
        pos,
        ref,
        alt,
        exome_ac,
        exome_an,
        exome_af,
        genome_ac,
        genome_an,
        genome_af,
        populations
      ]
    rest:
      request:
        method: POST
        path: /api
        idempotent: true
        jsonBodyTemplates:
          query: >-
            { variant(variantId: "{filter:variantId}", dataset: gnomad_r4) {
              variant_id rsids chrom pos ref alt
              exome { ac an af populations { id ac an af } }
              genome { ac an af populations { id ac an af } }
            } }
      response:
        rowsPath: data.variant
        fieldMap:
          variant_id: variant_id
          rsids: rsids
          chrom: chrom
          pos: pos
          ref: ref
          alt: alt
          exome_ac: exome.ac
          exome_an: exome.an
          exome_af: exome.af
          genome_ac: genome.ac
          genome_an: genome.an
          genome_af: genome.af
          populations: exome.populations
    fields:
      - name: variantId
        type: string
        description: Variant ID as chrom-pos-ref-alt (GRCh38), e.g. 17-7676154-G-A.
        synonyms: [variant_id, id]
      - name: variant_id
        type: string
        description: Canonical gnomAD variant identifier.
      - name: exome_af
        type: number
        description: Exome allele frequency.
      - name: genome_af
        type: number
        description: Genome allele frequency.
      - name: populations
        type: array
        description: Per-ancestry allele counts/frequencies from the exome cohort.
  - id: gene_constraint
    summary: Gene-level constraint metrics (pLI, LOEUF/oe_lof, missense z) for a gene symbol.
    identity:
      stableIdFields: [gene_id]
      namespace: ensembl.gene
      primaryUrlTemplate: https://gnomad.broadinstitute.org/gene/{stable_id}?dataset=gnomad_r4
    commonFields:
      [
        gene_id,
        gene_symbol,
        chrom,
        start,
        stop,
        exp_lof,
        obs_lof,
        lof_z,
        pLI,
        oe_lof,
        oe_lof_upper,
        exp_mis,
        obs_mis,
        mis_z,
        oe_mis,
        oe_mis_upper,
        syn_z
      ]
    rest:
      request:
        method: POST
        path: /api
        idempotent: true
        jsonBodyTemplates:
          query: >-
            { gene(gene_symbol: "{filter:gene_symbol}", reference_genome: GRCh38) {
              gene_id gene_symbol chrom start stop
              gnomad_constraint {
                exp_lof obs_lof lof_z pLI oe_lof oe_lof_upper
                exp_mis obs_mis mis_z oe_mis oe_mis_upper
                syn_z
              }
            } }
      response:
        rowsPath: data.gene
        fieldMap:
          gene_id: gene_id
          gene_symbol: gene_symbol
          chrom: chrom
          start: start
          stop: stop
          exp_lof: gnomad_constraint.exp_lof
          obs_lof: gnomad_constraint.obs_lof
          lof_z: gnomad_constraint.lof_z
          pLI: gnomad_constraint.pLI
          oe_lof: gnomad_constraint.oe_lof
          oe_lof_upper: gnomad_constraint.oe_lof_upper
          exp_mis: gnomad_constraint.exp_mis
          obs_mis: gnomad_constraint.obs_mis
          mis_z: gnomad_constraint.mis_z
          oe_mis: gnomad_constraint.oe_mis
          oe_mis_upper: gnomad_constraint.oe_mis_upper
          syn_z: gnomad_constraint.syn_z
    fields:
      - name: gene_symbol
        type: string
        description: HGNC gene symbol.
        synonyms: [symbol, gene, query]
        namespace: hgnc.symbol
      - name: pLI
        type: number
        description: Probability of loss-of-function intolerance.
      - name: oe_lof_upper
        type: number
        description: Upper bound of observed/expected LoF ratio (LOEUF-related).
      - name: mis_z
        type: number
        description: Missense constraint z-score.
  - id: region
    summary: Variants in a genomic region (GRCh38) from gnomAD v4.
    identity:
      stableIdFields: [variant_id]
      namespace: gnomad.variant_id
    commonFields:
      [variant_id, rsids, consequence, exome_ac, exome_af, genome_ac, genome_af]
    rest:
      request:
        method: POST
        path: /api
        idempotent: true
        jsonBodyTemplates:
          query: >-
            { region(chrom: "{filter:chrom}", start: {filter:start}, stop: {filter:stop}, reference_genome: GRCh38) {
              variants(dataset: gnomad_r4) {
                variant_id rsids consequence
                exome { ac af }
                genome { ac af }
              }
            } }
      response:
        rowsPath: data.region.variants
        fieldMap:
          variant_id: variant_id
          rsids: rsids
          consequence: consequence
          exome_ac: exome.ac
          exome_af: exome.af
          genome_ac: genome.ac
          genome_af: genome.af
    fields:
      - name: chrom
        type: string
        description: Chromosome without chr prefix (e.g. 17).
        synonyms: [chromosome, contig]
      - name: start
        type: number
        description: Region start position (GRCh38, 1-based).
        synonyms: [pos_start, begin]
      - name: stop
        type: number
        description: Region stop position (GRCh38, 1-based).
        synonyms: [end, pos_end]
      - name: variant_id
        type: string
        description: gnomAD variant identifier.
      - name: consequence
        type: string
        description: Most severe consequence annotation when available.
