phiDbConnectorVersion: 1
id: rest-json/bindingdb
name: BindingDB
protocolFamily: rest-json
curationTier: curated
baseUrl: https://bindingdb.org/rest
networkPolicy:
  allowedHosts:
    - bindingdb.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 1
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 800
  maxDelayMs: 8000
domains:
  - id: ligands_by_uniprot
    summary: Ligands and affinity values for UniProt target(s), with optional nM cutoff.
    identity:
      stableIdFields: [monomerid]
      namespace: bindingdb.monomer
    commonFields:
      [monomerid, smile, affinity_type, affinity, pmid, doi]
    rest:
      request:
        path: /getLigandsByUniprots
        queryParams:
          response: application/json
        filterParamMap:
          uniprot: uniprot
          cutoff: cutoff
      response:
        rowsPath: getLigandsByUniprotsResponse.affinities
        fieldMap:
          monomerid: monomerid
          smile: smile
          affinity_type: affinity_type
          affinity: affinity
          pmid: pmid
          doi: doi
    fields:
      - name: uniprot
        type: string
        description: UniProt accession, or comma-separated accessions (e.g. P04637 or P04637,P38398).
        synonyms: [accession, uniprot_id, query]
        namespace: uniprot.accession
      - name: cutoff
        type: number
        description: Optional affinity cutoff in nM (e.g. 10000).
        synonyms: [ic50_cutoff, affinity_cutoff]
      - name: monomerid
        type: string
        description: BindingDB monomer identifier.
      - name: smile
        type: string
        description: Ligand SMILES.
      - name: affinity
        type: string
        description: Reported affinity value.
  - id: targets_by_compound
    summary: Protein targets for a compound via SMILES similarity search.
    commonFields: [uniprot, smile, affinity_type, affinity, score]
    rest:
      request:
        path: /getTargetByCompound
        queryParams:
          response: application/json
        filterParamMap:
          smiles: smiles
          cutoff: cutoff
      response:
        rowsPath: $
    fields:
      - name: smiles
        type: string
        description: Query compound SMILES (URL-safe characters preferred).
        synonyms: [smile, query]
      - name: cutoff
        type: number
        description: Tanimoto similarity cutoff (e.g. 0.85).
