phiDbConnectorVersion: 1
id: rest-json/pdbe
name: PDBe
protocolFamily: rest-json
curationTier: curated
baseUrl: https://www.ebi.ac.uk/pdbe/api
networkPolicy:
  allowedHosts:
    - www.ebi.ac.uk
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 5
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: entry_summary
    summary: PDB entry summary metadata by PDB ID through the PDBe API.
    identity:
      stableIdFields: [pdb_id]
      namespace: pdb.id
      primaryUrlTemplate: https://www.ebi.ac.uk/pdbe/entry/pdb/{stable_id}
    commonFields:
      [
        pdb_id,
        title,
        experimental_method,
        resolution,
        release_date,
        revision_date,
        entry_authors,
        assemblies
      ]
    rest:
      request:
        path: /pdb/entry/summary/{filter:pdb_id}
      response:
        rowsPath: $.*.*
        fieldMap:
          pdb_id: pdb_id
          title: title
          experimental_method: experimental_method
          resolution: resolution
          release_date: release_date
          revision_date: revision_date
          entry_authors: entry_authors
          assemblies: assemblies
    fields:
      - name: pdb_id
        type: string
        description: Four-character PDB identifier.
        synonyms: [pdb, pdbid, entry_id]
        namespace: pdb.id
      - name: title
        type: string
        description: PDB entry title.
      - name: experimental_method
        type: array
        description: Experimental determination methods.
      - name: resolution
        type: array
        description: Structure resolution values when available.
      - name: release_date
        type: date
        description: Initial release date.
      - name: revision_date
        type: date
        description: Latest revision date.
  - id: molecules
    summary: Polymer molecules (chains/entities) for a PDB entry.
    identity:
      stableIdFields: [pdb_id]
      namespace: pdb.id
      primaryUrlTemplate: https://www.ebi.ac.uk/pdbe/entry/pdb/{stable_id}
    commonFields:
      [
        pdb_id,
        entity_id,
        molecule_name,
        molecule_type,
        length,
        sequence,
        source,
        ca_p_only,
        in_complete,
        sample,
        weight
      ]
    rest:
      request:
        path: /pdb/entry/molecules/{filter:pdb_id}
      response:
        rowsPath: $.*.*
    fields:
      - name: pdb_id
        type: string
        description: Four-character PDB identifier.
        synonyms: [pdb, pdbid]
        namespace: pdb.id
      - name: entity_id
        type: number
        description: PDBe polymer entity identifier.
      - name: molecule_name
        type: array
        description: Molecule or entity names.
      - name: molecule_type
        type: string
        description: Molecule type such as polypeptide(L) or polyribonucleotide.
      - name: sequence
        type: string
        description: Polymer sequence when available.
  - id: ligand_monomers
    summary: Bound ligand monomers for a PDB entry.
    identity:
      stableIdFields: [pdb_id]
      namespace: pdb.id
      primaryUrlTemplate: https://www.ebi.ac.uk/pdbe/entry/pdb/{stable_id}
    commonFields:
      [pdb_id, chem_comp_id, entity_id, molecule_name, formula_weight, formula, inchi_key]
    rest:
      request:
        path: /pdb/entry/ligand_monomers/{filter:pdb_id}
      response:
        rowsPath: $.*.*
    fields:
      - name: pdb_id
        type: string
        description: Four-character PDB identifier.
        namespace: pdb.id
      - name: chem_comp_id
        type: string
        description: Chemical component / ligand residue code.
        synonyms: [ligand, het, ligand_id]
      - name: molecule_name
        type: string
        description: Ligand molecule name.
      - name: formula
        type: string
        description: Chemical formula.
      - name: inchi_key
        type: string
        description: InChIKey for the ligand when available.
  - id: uniprot_mapping
    summary: UniProt mappings for a PDB entry.
    identity:
      stableIdFields: [pdb_id]
      namespace: pdb.id
      primaryUrlTemplate: https://www.ebi.ac.uk/pdbe/entry/pdb/{stable_id}
    commonFields: [pdb_id, uniprot_id, name, identifier, mappings]
    rest:
      request:
        path: /mappings/uniprot/{filter:pdb_id}
      response:
        rowsPath: $.*.*
    fields:
      - name: pdb_id
        type: string
        description: Four-character PDB identifier.
        namespace: pdb.id
      - name: uniprot_id
        type: string
        description: Mapped UniProt accession when present in response rows.
        synonyms: [accession, uniprot]
        namespace: uniprot.accession
xref:
  - from:
      domain: uniprot_mapping
      field: uniprot_id
      namespace: uniprot.accession
    to:
      database: rest-json/uniprot
      domain: protein
      field: accession
      namespace: uniprot.accession
  - from:
      domain: entry_summary
      field: pdb_id
      namespace: pdb.id
    to:
      database: rest-json/uniprot
      domain: protein
      field: pdb_ids
      namespace: pdb.id
