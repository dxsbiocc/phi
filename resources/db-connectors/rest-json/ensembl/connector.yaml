phiDbConnectorVersion: 1
id: rest-json/ensembl
name: Ensembl REST
protocolFamily: rest-json
curationTier: curated
baseUrl: https://rest.ensembl.org
networkPolicy:
  allowedHosts:
    - rest.ensembl.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 10
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: gene
    summary: Human Ensembl gene lookup by external gene symbol; compatibility alias for lookup_symbol with species fixed to homo_sapiens.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields:
      [id, display_name, species, biotype, description, seq_region_name, start, end, strand]
    rest:
      request:
        path: /lookup/symbol/homo_sapiens/{filter:symbol}
        queryParams:
          expand: '1'
      response:
        rowsPath: $
    fields:
      - { name: symbol, type: string, description: External gene symbol, namespace: hgnc.symbol }
      - {
          name: id,
          type: string,
          description: Ensembl stable identifier,
          namespace: ensembl.gene_id
        }
      - { name: display_name, type: string, description: Ensembl display name }
      - { name: species, type: string, description: Ensembl species name }
      - { name: biotype, type: string, description: Gene biotype }
      - { name: description, type: string, description: Gene description }
      - { name: seq_region_name, type: string, description: Sequence region name }
      - { name: start, type: number, description: Genomic start coordinate }
      - { name: end, type: number, description: Genomic end coordinate }
      - { name: strand, type: number, description: Genomic strand }
  - id: lookup_id
    summary: Lookup an Ensembl stable identifier and return object metadata.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields:
      [
        id,
        object_type,
        species,
        biotype,
        display_name,
        description,
        seq_region_name,
        start,
        end,
        strand
      ]
    rest:
      request:
        path: /lookup/id/{filter:id}
        filterParamMap: { expand: expand, mane: mane }
      response: { rowsPath: $ }
  - id: lookup_id_batch
    summary: Batch lookup Ensembl stable identifiers with Ensembl REST POST /lookup/id.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields:
      [
        id,
        object_type,
        species,
        biotype,
        display_name,
        description,
        seq_region_name,
        start,
        end,
        strand
      ]
    rest:
      request:
        path: /lookup/id
        method: POST
        idempotent: true
        jsonBodyParamMap: { ids: ids }
        jsonBodyArrayFields: [ids]
        filterParamMap: { expand: expand, mane: mane }
      response: { rowsPath: $.* }
  - id: lookup_symbol
    summary: Lookup an Ensembl object by species and external symbol.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields:
      [id, display_name, species, biotype, description, seq_region_name, start, end, strand]
    rest:
      request:
        path: /lookup/symbol/{filter:species}/{filter:symbol}
        filterParamMap: { expand: expand }
      response: { rowsPath: $ }
  - id: lookup_symbol_batch
    summary: Batch lookup Ensembl objects by species and external symbols with Ensembl REST POST /lookup/symbol/:species.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields:
      [id, display_name, species, biotype, description, seq_region_name, start, end, strand]
    rest:
      request:
        path: /lookup/symbol/{filter:species}
        method: POST
        idempotent: true
        jsonBodyParamMap: { symbols: symbols }
        jsonBodyArrayFields: [symbols]
        filterParamMap: { expand: expand }
      response: { rowsPath: $.* }
  - id: xref
    summary: Human Ensembl objects linked to an external symbol; compatibility alias for xref_symbol with species fixed to homo_sapiens.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields: [id, display_id, type, dbname, description]
    rest:
      request:
        path: /xrefs/symbol/homo_sapiens/{filter:symbol}
        filterParamMap: { external_db: external_db, object_type: object_type }
      response: { rowsPath: $ }
    fields:
      - { name: symbol, type: string, description: External symbol, namespace: hgnc.symbol }
      - {
          name: id,
          type: string,
          description: Linked Ensembl stable identifier,
          namespace: ensembl.stable_id
        }
      - { name: display_id, type: string, description: External display identifier }
      - { name: type, type: string, description: Object type }
      - { name: dbname, type: string, description: External database name }
      - { name: description, type: string, description: External cross-reference description }
  - id: xref_symbol
    summary: Ensembl cross-references linked to an external symbol for a species.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields: [id, display_id, type, dbname, description]
    rest:
      request:
        path: /xrefs/symbol/{filter:species}/{filter:symbol}
        filterParamMap: { external_db: external_db, object_type: object_type }
      response: { rowsPath: $ }
  - id: xref_id
    summary: External database cross-references for an Ensembl stable identifier.
    commonFields: [primary_id, display_id, dbname, description, info_type, version]
    rest:
      request:
        path: /xrefs/id/{filter:id}
        filterParamMap: { external_db: external_db, all_levels: all_levels }
      response: { rowsPath: $ }
  - id: xref_name
    summary: Ensembl cross-reference lookup by external accession or display label.
    identity:
      stableIdFields: [id]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields: [id, display_id, type, dbname, description]
    rest:
      request:
        path: /xrefs/name/{filter:species}/{filter:name}
        filterParamMap: { external_db: external_db }
      response: { rowsPath: $ }
  - id: sequence_id
    summary: Sequence by Ensembl stable identifier.
    identity:
      stableIdFields: [id, query]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields: [id, query, desc, seq, molecule]
    rest:
      request:
        path: /sequence/id/{filter:id}
        filterParamMap:
          { type: type, mask: mask, expand_5prime: expand_5prime, expand_3prime: expand_3prime }
      response: { rowsPath: $ }
  - id: sequence_id_batch
    summary: Batch retrieve sequences by Ensembl stable identifiers with Ensembl REST POST /sequence/id.
    identity:
      stableIdFields: [id, query]
      namespace: ensembl.stable_id
      primaryUrlTemplate: https://www.ensembl.org/id/{stable_id}
    commonFields: [id, query, desc, seq, molecule]
    rest:
      request:
        path: /sequence/id
        method: POST
        idempotent: true
        jsonBodyParamMap: { ids: ids }
        jsonBodyArrayFields: [ids]
        filterParamMap:
          { type: type, mask: mask, expand_5prime: expand_5prime, expand_3prime: expand_3prime }
      response: { rowsPath: $ }
  - id: sequence_region
    summary: Genomic sequence for a species and genomic region.
    commonFields: [id, query, desc, seq, molecule]
    rest:
      request:
        path: /sequence/region/{filter:species}/{filter:region}
        filterParamMap:
          {
            coord_system_version: coord_system_version,
            mask: mask,
            expand_5prime: expand_5prime,
            expand_3prime: expand_3prime
          }
      response: { rowsPath: $ }
  - id: sequence_region_batch
    summary: Batch retrieve genomic sequences by species and region list with Ensembl REST POST /sequence/region/:species.
    commonFields: [id, query, desc, seq, molecule]
    rest:
      request:
        path: /sequence/region/{filter:species}
        method: POST
        idempotent: true
        jsonBodyParamMap: { regions: regions }
        jsonBodyArrayFields: [regions]
        filterParamMap:
          {
            coord_system: coord_system,
            coord_system_version: coord_system_version,
            mask: mask,
            expand_5prime: expand_5prime,
            expand_3prime: expand_3prime
          }
      response: { rowsPath: $ }
  - id: overlap_id
    summary: Features overlapping the genomic span of an Ensembl identifier.
    commonFields: [id, feature_type, biotype, external_name, seq_region_name, start, end, strand]
    rest:
      request:
        path: /overlap/id/{filter:id}
        filterParamMap: { feature: feature }
      response: { rowsPath: $ }
  - id: overlap_region
    summary: Features overlapping a genomic region for a species.
    commonFields: [id, feature_type, biotype, external_name, seq_region_name, start, end, strand]
    rest:
      request:
        path: /overlap/region/{filter:species}/{filter:region}
        filterParamMap: { feature: feature }
      response: { rowsPath: $ }
  - id: overlap_translation
    summary: Protein-domain and variant features related to a translation stable identifier.
    commonFields: [id, feature_type, description, interpro, start, end]
    rest:
      request:
        path: /overlap/translation/{filter:id}
        filterParamMap: { feature: feature }
      response: { rowsPath: $ }
  - id: homology_id
    summary: Comparative homology information by species and Ensembl stable gene identifier.
    commonFields: [id, type, target, source, homologies]
    rest:
      request:
        path: /homology/id/{filter:species}/{filter:id}
        filterParamMap: { target_species: target_species, type: type, sequence: sequence }
      response: { rowsPath: data }
  - id: homology_symbol
    summary: Comparative homology information by species and external gene symbol.
    commonFields: [id, type, target, source, homologies]
    rest:
      request:
        path: /homology/symbol/{filter:species}/{filter:symbol}
        filterParamMap: { target_species: target_species, type: type, sequence: sequence }
      response: { rowsPath: data }
  - id: genetree_member_symbol
    summary: Gene tree containing a gene identified by species and symbol.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree, aligned, cigar_line]
    rest:
      request:
        path: /genetree/member/symbol/{filter:species}/{filter:symbol}
        filterParamMap: { nh_format: nh_format, sequence: sequence }
      response: { rowsPath: $ }
  - id: genetree_id
    summary: Gene tree by gene tree stable identifier.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree, aligned, cigar_line]
    rest:
      request:
        path: /genetree/id/{filter:id}
        filterParamMap: { nh_format: nh_format, sequence: sequence }
      response: { rowsPath: $ }
  - id: genetree_member_id
    summary: Gene tree containing a gene, transcript, or translation stable identifier.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree, aligned, cigar_line]
    rest:
      request:
        path: /genetree/member/id/{filter:species}/{filter:id}
        filterParamMap: { nh_format: nh_format, sequence: sequence }
      response: { rowsPath: $ }
  - id: cafe_genetree_id
    summary: CAFE gene family tree by gene tree stable identifier.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree]
    rest:
      request:
        path: /cafe/genetree/id/{filter:id}
        filterParamMap: { nh_format: nh_format }
      response: { rowsPath: $ }
  - id: cafe_genetree_member_symbol
    summary: CAFE gene family tree containing a gene identified by species and symbol.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree]
    rest:
      request:
        path: /cafe/genetree/member/symbol/{filter:species}/{filter:symbol}
        filterParamMap: { nh_format: nh_format }
      response: { rowsPath: $ }
  - id: cafe_genetree_member_id
    summary: CAFE gene family tree containing a gene, transcript, or translation stable identifier.
    identity:
      stableIdFields: [id]
      namespace: ensembl.genetree_id
    commonFields: [id, tree]
    rest:
      request:
        path: /cafe/genetree/member/id/{filter:species}/{filter:id}
        filterParamMap: { nh_format: nh_format }
      response: { rowsPath: $ }
  - id: alignment_region
    summary: Genomic alignments for a species and region.
    commonFields: [alignments, tree, method_link_species_set]
    rest:
      request:
        path: /alignment/region/{filter:species}/{filter:region}
        filterParamMap: { method: method, species_set: species_set }
      response: { rowsPath: $ }
  - id: variation
    summary: Ensembl variation feature details by species and variant identifier.
    identity:
      stableIdFields: [name]
      namespace: ensembl.variation_id
    commonFields: [name, source, mappings, synonyms, evidence, most_severe_consequence]
    rest:
      request:
        path: /variation/{filter:species}/{filter:id}
        filterParamMap:
          {
            genotypes: genotypes,
            phenotypes: phenotypes,
            pops: pops,
            population_genotypes: population_genotypes
          }
      response: { rowsPath: $ }
  - id: variation_batch
    summary: Batch variation feature details by species and variant identifiers with Ensembl REST POST /variation/:species.
    identity:
      stableIdFields: [name]
      namespace: ensembl.variation_id
    commonFields: [name, source, mappings, synonyms, evidence, most_severe_consequence]
    rest:
      request:
        path: /variation/{filter:species}
        method: POST
        idempotent: true
        jsonBodyParamMap: { ids: ids }
        jsonBodyArrayFields: [ids]
        filterParamMap:
          {
            genotypes: genotypes,
            phenotypes: phenotypes,
            pops: pops,
            population_genotypes: population_genotypes
          }
      response: { rowsPath: $.* }
  - id: variation_pmcid
    summary: Variants associated with a PubMed Central reference.
    identity:
      stableIdFields: [name]
      namespace: ensembl.variation_id
    commonFields: [name, source, mappings, synonyms, evidence, most_severe_consequence]
    rest:
      request:
        path: /variation/{filter:species}/pmcid/{filter:pmcid}
      response: { rowsPath: $ }
  - id: variation_pmid
    summary: Variants associated with a PubMed reference.
    identity:
      stableIdFields: [name]
      namespace: ensembl.variation_id
    commonFields: [name, source, mappings, synonyms, evidence, most_severe_consequence]
    rest:
      request:
        path: /variation/{filter:species}/pmid/{filter:pmid}
      response: { rowsPath: $ }
  - id: variant_recoder
    summary: Translate a variant ID, HGVS notation, or SPDI notation to Ensembl/RefSeq/HGVS/SPDI forms.
    commonFields: [id, input, hgvsc, hgvsp, spdi, vcf_string, variation_id]
    rest:
      request:
        path: /variant_recoder/{filter:species}/{filter:id}
      response: { rowsPath: $.*.* }
  - id: variant_recoder_batch
    summary: Batch translate variant IDs, HGVS notations, or SPDI notations with Ensembl REST POST /variant_recoder.
    commonFields: [id, input, hgvsc, hgvsp, spdi, vcf_string, variation_id]
    rest:
      request:
        path: /variant_recoder/{filter:species}
        method: POST
        idempotent: true
        jsonBodyParamMap: { ids: ids }
        jsonBodyArrayFields: [ids]
      response: { rowsPath: $.*.* }
  - id: vep_hgvs
    summary: Variant Effect Predictor consequences for one HGVS notation.
    identity:
      stableIdFields: [id, input]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/hgvs/{filter:hgvs}
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: vep_hgvs_batch
    summary: Batch Variant Effect Predictor consequences for HGVS notations with Ensembl REST POST /vep/:species/hgvs.
    identity:
      stableIdFields: [id]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/hgvs
        method: POST
        idempotent: true
        jsonBodyParamMap: { hgvs_notations: hgvs_notations }
        jsonBodyArrayFields: [hgvs_notations]
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: vep_id
    summary: Variant Effect Predictor consequences for one variant identifier.
    identity:
      stableIdFields: [id, input]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/id/{filter:id}
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: vep_id_batch
    summary: Batch Variant Effect Predictor consequences for variant identifiers with Ensembl REST POST /vep/:species/id.
    identity:
      stableIdFields: [id]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/id
        method: POST
        idempotent: true
        jsonBodyParamMap: { ids: ids }
        jsonBodyArrayFields: [ids]
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: vep_region
    summary: Variant Effect Predictor consequences for a single region variant and allele.
    identity:
      stableIdFields: [id]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/region/{filter:region}/{filter:allele}
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: vep_region_batch
    summary: Batch Variant Effect Predictor consequences for region variants with Ensembl REST POST /vep/:species/region.
    identity:
      stableIdFields: [id]
      namespace: ensembl.variation_id
    commonFields: [input, id, most_severe_consequence, transcript_consequences, colocated_variants]
    rest:
      request:
        path: /vep/{filter:species}/region
        method: POST
        idempotent: true
        jsonBodyParamMap: { variants: variants }
        jsonBodyArrayFields: [variants]
        filterParamMap: { canonical: canonical, mane: mane, merged: merged, protein: protein }
      response: { rowsPath: $ }
  - id: phenotype_gene
    summary: Phenotype annotations for a gene.
    commonFields: [id, source, trait, description, attributes, ontology_accessions]
    rest:
      request:
        path: /phenotype/gene/{filter:species}/{filter:gene}
        filterParamMap: { include_associated: include_associated }
      response: { rowsPath: $ }
  - id: phenotype_accession
    summary: Phenotype annotations for genomic features by ontology accession.
    commonFields: [id, source, trait, description, attributes, ontology_accessions]
    rest:
      request:
        path: /phenotype/accession/{filter:species}/{filter:accession}
        filterParamMap: { include_associated: include_associated }
      response: { rowsPath: $ }
  - id: phenotype_region
    summary: Phenotype annotations overlapping a genomic region.
    commonFields: [id, source, trait, description, attributes, ontology_accessions]
    rest:
      request:
        path: /phenotype/region/{filter:species}/{filter:region}
        filterParamMap: { feature_type: feature_type }
      response: { rowsPath: $ }
  - id: phenotype_term
    summary: Phenotype annotations for genomic features by ontology term.
    commonFields: [id, source, trait, description, attributes, ontology_accessions]
    rest:
      request:
        path: /phenotype/term/{filter:species}/{filter:term}
        filterParamMap: { include_associated: include_associated }
      response: { rowsPath: $ }
  - id: regulation_binding_matrix
    summary: Ensembl regulation binding matrix by species and binding-matrix stable identifier.
    identity:
      stableIdFields: [binding_matrix_stable_id]
      namespace: ensembl.binding_matrix_id
    commonFields: [binding_matrix_stable_id, name, description, pwm, transcription_factor]
    rest:
      request:
        path: /species/{filter:species}/binding_matrix/{filter:binding_matrix_stable_id}
      response: { rowsPath: $ }
  - id: map_cdna
    summary: Map cDNA coordinates for a transcript to genomic coordinates.
    commonFields: [mappings]
    rest:
      request:
        path: /map/cdna/{filter:id}/{filter:region}
      response: { rowsPath: mappings }
  - id: map_cds
    summary: Map CDS coordinates for a transcript to genomic coordinates.
    commonFields: [mappings]
    rest:
      request:
        path: /map/cds/{filter:id}/{filter:region}
      response: { rowsPath: mappings }
  - id: map_translation
    summary: Map protein translation coordinates to genomic coordinates.
    commonFields: [mappings]
    rest:
      request:
        path: /map/translation/{filter:id}/{filter:region}
      response: { rowsPath: mappings }
  - id: map_assembly
    summary: Map coordinates between assembly versions for a species.
    commonFields: [mappings]
    rest:
      request:
        path: /map/{filter:species}/{filter:source_assembly}/{filter:region}/{filter:target_assembly}
      response: { rowsPath: mappings }
  - id: ontology_id
    summary: Ontology term by accession.
    identity:
      stableIdFields: [accession]
      namespace: ontology.term_accession
    commonFields: [accession, name, definition, namespace, subsets, synonyms]
    rest:
      request:
        path: /ontology/id/{filter:id}
      response: { rowsPath: $ }
  - id: ontology_name
    summary: Ontology term lookup by term name.
    identity:
      stableIdFields: [accession]
      namespace: ontology.term_accession
    commonFields: [accession, name, definition, namespace, subsets, synonyms]
    rest:
      request:
        path: /ontology/name/{filter:name}
      response: { rowsPath: $ }
  - id: ontology_ancestors
    summary: Ancestor ontology terms for an ontology accession.
    identity:
      stableIdFields: [accession]
      namespace: ontology.term_accession
    commonFields: [accession, name, definition, namespace]
    rest:
      request:
        path: /ontology/ancestors/{filter:id}
      response: { rowsPath: $ }
  - id: ontology_ancestors_chart
    summary: Ancestor ontology graph chart for an ontology accession.
    commonFields: [nodes, edges]
    rest:
      request:
        path: /ontology/ancestors/chart/{filter:id}
      response: { rowsPath: $ }
  - id: ontology_descendants
    summary: Descendant ontology terms for an ontology accession.
    identity:
      stableIdFields: [accession]
      namespace: ontology.term_accession
    commonFields: [accession, name, definition, namespace]
    rest:
      request:
        path: /ontology/descendants/{filter:id}
      response: { rowsPath: $ }
  - id: ontology_descendants_chart
    summary: Descendant ontology graph chart for an ontology accession.
    commonFields: [nodes, edges]
    rest:
      request:
        path: /ontology/descendants/chart/{filter:id}
      response: { rowsPath: $ }
  - id: taxonomy_id
    summary: Taxonomy node by taxon identifier or name.
    identity:
      stableIdFields: [id]
      namespace: ncbi.taxonomy_id
    commonFields: [id, scientific_name, common_name, rank, parent]
    rest:
      request:
        path: /taxonomy/id/{filter:id}
      response: { rowsPath: $ }
  - id: taxonomy_name
    summary: Taxonomy node lookup by scientific or common name.
    identity:
      stableIdFields: [id]
      namespace: ncbi.taxonomy_id
    commonFields: [id, scientific_name, common_name, rank, parent]
    rest:
      request:
        path: /taxonomy/name/{filter:name}
      response: { rowsPath: $ }
  - id: taxonomy_classification
    summary: Taxonomy lineage classification for a taxon identifier.
    identity:
      stableIdFields: [id]
      namespace: ncbi.taxonomy_id
    commonFields: [id, scientific_name, common_name, rank, parent]
    rest:
      request:
        path: /taxonomy/classification/{filter:id}
      response: { rowsPath: $ }
  - id: ld_id
    summary: Linkage disequilibrium for a variant identifier in a population.
    commonFields: [variation1, variation2, r2, d_prime, population_name]
    rest:
      request:
        path: /ld/{filter:species}/{filter:id}/{filter:population_name}
      response: { rowsPath: $ }
  - id: ld_pairwise
    summary: Pairwise linkage disequilibrium for two variants.
    commonFields: [variation1, variation2, r2, d_prime, population_name]
    rest:
      request:
