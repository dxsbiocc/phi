phiDbConnectorVersion: 1
id: rest-json/uniprot
name: UniProtKB REST
protocolFamily: rest-json
curationTier: curated
baseUrl: https://rest.uniprot.org
networkPolicy:
  allowedHosts:
    - rest.uniprot.org
  allowRedirects: true
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 3
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: protein
    summary: Primary/default UniProtKB protein lookup through the UniProt REST API, including accessions, names, organism, sequence, function comments, and common cross-references.
    identity:
      stableIdFields: [accession]
      namespace: uniprot.accession
      primaryUrlTemplate: https://www.uniprot.org/uniprotkb/{stable_id}/entry
    commonFields:
      - accession
      - entry_name
      - reviewed
      - protein_name
      - alternative_protein_names
      - protein_existence
      - gene_name
      - gene_synonyms
      - ordered_locus_names
      - orf_names
      - organism
      - tax_id
      - organism_lineage
      - sequence
      - date_created
      - date_modified
      - date_sequence_modified
      - entry_version
      - sequence_version
      - pubmed_ids
      - references
      - catalytic_activities
      - cofactors
      - pathways
      - interactions
      - isoforms
      - isoform_ids
      - ec_numbers
      - keywords
      - disease_comments
      - subcellular_locations
      - domains
      - regions
      - active_sites
      - binding_sites
      - modified_residues
      - variants
      - signal_peptides
      - transmembrane_regions
      - topological_domains
      - chains
      - peptides
      - propeptides
      - repeats
      - motifs
      - coiled_coils
      - zinc_fingers
      - disulfide_bonds
      - mutagenesis_sites
      - go_terms
      - pdb_ids
      - ensembl_gene_ids
      - refseq_ids
      - gene_ids
      - embl_ids
      - uniparc_ids
      - ccds_ids
      - alphafold_ids
      - interpro_ids
      - pfam_ids
      - prosite_ids
      - smart_ids
      - supfam_ids
      - string_ids
      - reactome_ids
      - kegg_ids
      - chembl_ids
      - drugbank_ids
      - proteome_ids
      - url
      - download_urls
      - download_files
    rest:
      request:
        path: /uniprotkb/search
        method: GET
        rawQueryParam: query
        limitParam: size
        cursorParam: cursor
        queryParams:
          format: json
          fields: accession,id,reviewed,protein_name,protein_existence,gene_names,organism_name,organism_id,lineage,sequence,date_created,date_modified,date_sequence_modified,version,cc_function,cc_disease,cc_subcellular_location,cc_catalytic_activity,cc_cofactor,cc_pathway,cc_interaction,cc_alternative_products,ec,keyword,lit_pubmed_id,ft_domain,ft_region,ft_act_site,ft_binding,ft_mod_res,ft_variant,ft_signal,ft_transmem,ft_topo_dom,ft_chain,ft_peptide,ft_propep,ft_repeat,ft_motif,ft_coiled,ft_zn_fing,ft_disulfid,ft_mutagen,go_id,xref_pdb,xref_ensembl,xref_refseq,xref_geneid,xref_embl,xref_uniparc,xref_ccds,xref_alphafolddb,xref_interpro,xref_pfam,xref_prosite,xref_smart,xref_supfam,xref_string,xref_reactome,xref_kegg,xref_chembl,xref_drugbank,xref_proteomes
    fields:
      - name: accession
        type: string
        description: Primary UniProtKB accession.
        synonyms:
          - uniprot
          - uniprot_accession
          - primary_accession
        namespace: uniprot.accession
      - name: entry_name
        type: string
        description: UniProtKB entry name, also called mnemonic.
        synonyms:
          - mnemonic
          - id
        namespace: uniprot.entry
      - name: reviewed
        type: boolean
        description: Whether the entry is reviewed Swiss-Prot rather than unreviewed TrEMBL.
        synonyms:
          - swissprot
          - swiss-prot
          - trembl
      - name: protein_name
        type: string
        description: Recommended protein full name when available.
        synonyms:
          - protein
          - product
          - recommended_name
      - name: alternative_protein_names
        type: array
        description: Alternative protein full names and short names reported by UniProt.
        synonyms:
          - alternative_names
          - aliases
      - name: protein_existence
        type: string
        description: UniProt protein existence evidence level.
        synonyms:
          - evidence_level
      - name: gene_name
        type: string
        description: Primary gene symbol associated with the protein entry.
        synonyms:
          - gene
          - gene_symbol
          - hgnc_symbol
        namespace: hgnc.symbol
      - name: gene_synonyms
        type: array
        description: Gene symbol synonyms associated with the protein entry.
        synonyms:
          - gene_aliases
          - aliases
        namespace: hgnc.symbol
      - name: ordered_locus_names
        type: array
        description: Ordered locus names associated with the protein entry.
      - name: orf_names
        type: array
        description: ORF names associated with the protein entry.
      - name: organism
        type: string
        description: Scientific organism name.
        synonyms:
          - species
      - name: tax_id
        type: number
        description: NCBI taxonomy identifier for the organism.
        synonyms:
          - organism_id
          - taxon
          - taxid
        namespace: ncbi.taxonomy
      - name: organism_lineage
        type: array
        description: Taxonomic lineage strings reported by UniProt for the organism.
        synonyms:
          - lineage
      - name: sequence
        type: string
        description: Amino acid sequence for the protein entry.
        synonyms:
          - fasta
          - amino_acid_sequence
      - name: fasta
        type: string
        description: UniProtKB FASTA text fetched directly for explicit single-accession requests; use this for small direct text retrieval, not bulk downloads.
        synonyms:
          - entry_fasta
          - protein_fasta
      - name: flat_file
        type: string
        description: UniProtKB flat-file text fetched directly for explicit single-accession requests; wrapper tools are only needed for specialized or bulk downloads.
        synonyms:
          - txt
          - uniprot_txt
      - name: date_created
        type: string
        description: UniProtKB first public release date for the entry.
        synonyms:
          - created_at
          - first_public_date
      - name: date_modified
        type: string
        description: UniProtKB last annotation update date for the entry.
        synonyms:
          - updated_at
          - last_annotation_update
      - name: date_sequence_modified
        type: string
        description: UniProtKB last sequence update date for the entry.
        synonyms:
          - sequence_updated_at
          - last_sequence_update
      - name: entry_version
        type: number
        description: UniProtKB entry annotation version.
        synonyms:
          - version
      - name: sequence_version
        type: number
        description: UniProtKB sequence version.
      - name: pubmed_ids
        type: array
        description: PubMed identifiers cited by the UniProtKB entry references.
        synonyms:
          - pmids
          - literature_pubmed_ids
        namespace: ncbi.pubmed
      - name: references
        type: array
        description: Compact UniProtKB literature references with title, citation type, journal/date/page metadata, PubMed ID, and DOI when available.
        synonyms:
          - literature
          - publications
      - name: sequence_length
        type: number
        description: Protein sequence length in amino acids.
      - name: molecular_weight
        type: number
        description: Protein molecular weight reported by UniProt.
      - name: annotation_score
        type: number
        description: UniProt annotation score.
      - name: secondary_accessions
        type: array
        description: Secondary UniProtKB accessions.
      - name: function
        type: array
        description: UniProt function comment text entries.
      - name: disease_comments
        type: array
        description: UniProt disease comment text entries.
        synonyms:
          - disease
          - pathology
      - name: subcellular_locations
        type: array
        description: Subcellular location names reported by UniProt.
        synonyms:
          - cellular_location
          - localization
      - name: catalytic_activities
        type: array
        description: UniProt catalytic activity comments with reaction, EC number, reaction cross-references, and note text when available.
        synonyms:
          - catalytic_activity
          - enzyme_reaction
      - name: cofactors
        type: array
        description: UniProt cofactor comments with cofactor names, database cross-references such as ChEBI, and note text when available.
        synonyms:
          - cofactor
          - metals
      - name: pathways
        type: array
        description: UniProt pathway comment text entries.
        synonyms:
          - pathway_comments
      - name: interactions
        type: array
        description: UniProt interaction comments with interactant accessions, gene names, and experiment counts when available.
        synonyms:
          - protein_interactions
          - interactors
      - name: isoforms
        type: array
        description: UniProt alternative-products isoform metadata with isoform identifiers, names, sequence status, sequence identifiers, notes, and derived FASTA URLs when available.
        synonyms:
          - alternative_products
          - splice_isoforms
      - name: isoform_ids
        type: array
        description: Flattened UniProt isoform identifiers from alternative-products comments.
        synonyms:
          - isoforms
          - alternative_product_ids
        namespace: uniprot.accession
      - name: ec_numbers
        type: array
        description: Enzyme Commission numbers from recommended and alternative protein names.
        synonyms:
          - ec
          - enzyme_commission
        namespace: ec.number
      - name: keywords
        type: array
        description: UniProt keyword labels associated with the entry.
      - name: domains
        type: array
        description: UniProt domain feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_domain
          - protein_domain
      - name: regions
        type: array
        description: UniProt region feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_region
      - name: active_sites
        type: array
        description: UniProt active-site feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_act_site
          - catalytic_site
      - name: binding_sites
        type: array
        description: UniProt binding-site feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_binding
      - name: modified_residues
        type: array
        description: UniProt modified-residue feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_mod_res
          - post_translational_modification
      - name: variants
        type: array
        description: UniProt natural-variant feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_variant
          - natural_variant
      - name: signal_peptides
        type: array
        description: UniProt signal-peptide feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_signal
      - name: transmembrane_regions
        type: array
        description: UniProt transmembrane feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_transmem
          - transmembrane
      - name: topological_domains
        type: array
        description: UniProt topological-domain feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_topo_dom
          - topology
      - name: chains
        type: array
        description: UniProt chain feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_chain
      - name: peptides
        type: array
        description: UniProt peptide feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_peptide
      - name: propeptides
        type: array
        description: UniProt propeptide feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_propep
      - name: repeats
        type: array
        description: UniProt repeat feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_repeat
      - name: motifs
        type: array
        description: UniProt motif feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_motif
      - name: coiled_coils
        type: array
        description: UniProt coiled-coil feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_coiled
      - name: zinc_fingers
        type: array
        description: UniProt zinc-finger feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_zn_fing
      - name: disulfide_bonds
        type: array
        description: UniProt disulfide-bond feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_disulfid
      - name: mutagenesis_sites
        type: array
        description: UniProt mutagenesis feature annotations with type, description, feature_id, start, and end when available.
        synonyms:
          - ft_mutagen
      - name: go_terms
        type: array
        description: Gene Ontology cross-reference identifiers.
        namespace: go.id
      - name: pdb_ids
        type: array
        description: PDB cross-reference identifiers.
        namespace: pdb.id
      - name: ensembl_gene_ids
        type: array
        description: Ensembl cross-reference identifiers.
        namespace: ensembl.id
      - name: refseq_ids
        type: array
        description: RefSeq cross-reference identifiers.
        namespace: refseq.accession
      - name: gene_ids
        type: array
        description: NCBI GeneID cross-reference identifiers.
        namespace: ncbi.gene
      - name: embl_ids
        type: array
        description: EMBL/ENA nucleotide cross-reference identifiers.
        namespace: embl.id
      - name: uniparc_ids
        type: array
        description: UniParc cross-reference identifiers.
        namespace: uniparc.id
      - name: ccds_ids
        type: array
        description: CCDS cross-reference identifiers.
        namespace: ccds.id
      - name: alphafold_ids
        type: array
        description: AlphaFoldDB cross-reference identifiers.
        namespace: alphafold.id
      - name: interpro_ids
        type: array
        description: InterPro cross-reference identifiers.
        namespace: interpro.id
      - name: pfam_ids
        type: array
        description: Pfam cross-reference identifiers.
        namespace: pfam.id
      - name: prosite_ids
        type: array
        description: PROSITE cross-reference identifiers.
        namespace: prosite.id
      - name: smart_ids
        type: array
        description: SMART domain cross-reference identifiers.
        namespace: smart.id
      - name: supfam_ids
        type: array
        description: SUPERFAMILY/SUPFAM cross-reference identifiers.
        namespace: supfam.id
      - name: string_ids
        type: array
        description: STRING protein interaction network cross-reference identifiers.
        namespace: string.id
      - name: reactome_ids
        type: array
        description: Reactome pathway cross-reference identifiers.
        namespace: reactome.id
      - name: kegg_ids
        type: array
        description: KEGG cross-reference identifiers.
        namespace: kegg.id
      - name: chembl_ids
        type: array
        description: ChEMBL target cross-reference identifiers.
        namespace: chembl.id
      - name: drugbank_ids
        type: array
        description: DrugBank cross-reference identifiers.
        namespace: drugbank.id
      - name: proteome_ids
        type: array
        description: UniProt proteome cross-reference identifiers.
        namespace: uniprot.proteome
      - name: url
        type: string
        description: Canonical UniProtKB entry page for the primary accession.
        synonyms:
          - entry_url
          - uniprot_url
      - name: download_urls
        type: object
        description: Direct derived UniProtKB entry, JSON, FASTA, and flat-file URLs for the primary accession.
        synonyms:
          - fasta_url
          - json_url
          - txt_url
      - name: download_files
        type: array
        description: Candidate UniProtKB JSON, FASTA, and flat-file record resources using the shared download-file schema; use wrappers for any later download execution.
        synonyms:
          - download_manifest
          - fasta
          - protein_fasta
  - id: uniref
    summary: UniRef clustered protein sequence records through the UniProt REST API, including cluster identity, representative member, sequence, members, organisms, and GO terms.
    identity:
      stableIdFields: [id]
      namespace: uniprot.uniref_id
      primaryUrlTemplate: https://www.uniprot.org/uniref/{stable_id}
    commonFields:
      - id
      - name
      - entry_type
      - updated
      - common_taxon
      - tax_id
      - member_count
      - organism_count
      - representative_member_id
      - representative_protein_name
      - representative_accessions
      - uniref90_id
      - uniref100_id
      - uniparc_id
      - sequence
      - sequence_length
      - members
      - organisms
      - go_terms
      - url
    rest:
      request:
        path: /uniref/search
        method: GET
        rawQueryParam: query
        limitParam: size
        cursorParam: cursor
        queryParams:
          format: json
    fields:
      - name: id
        type: string
        description: UniRef cluster identifier, for example UniRef50_P38398.
        namespace: uniref.id
      - name: name
        type: string
        description: UniRef cluster name.
      - name: entry_type
        type: string
        description: UniRef cluster level such as UniRef50, UniRef90, or UniRef100.
      - name: updated
        type: string
        description: UniRef record update date.
      - name: common_taxon
        type: string
        description: Common taxon label for the cluster.
      - name: tax_id
        type: number
        description: Common taxon identifier for the cluster.
        namespace: ncbi.taxonomy
      - name: member_count
        type: number
        description: Number of cluster members.
      - name: organism_count
        type: number
        description: Number of organisms represented in the cluster.
      - name: representative_member_id
        type: string
        description: Representative UniRef member identifier.
      - name: representative_protein_name
        type: string
        description: Representative member protein name.
      - name: representative_accessions
        type: array
        description: Representative member UniProt accessions.
        namespace: uniprot.accession
      - name: uniref90_id
        type: string
        description: Linked UniRef90 cluster identifier when available.
        namespace: uniref.id
      - name: uniref100_id
        type: string
        description: Linked UniRef100 cluster identifier when available.
        namespace: uniref.id
      - name: uniparc_id
        type: string
        description: Representative member UniParc identifier.
        namespace: uniparc.id
      - name: sequence
        type: string
        description: Representative sequence.
      - name: sequence_length
        type: number
        description: Representative sequence length.
      - name: members
        type: array
        description: Sample UniRef member identifiers returned by the API.
      - name: organisms
        type: array
        description: Organism summaries represented in the cluster.
      - name: go_terms
        type: array
        description: GO term summaries associated with the cluster.
      - name: url
        type: string
        description: Canonical UniRef record page.
  - id: uniparc
    summary: UniParc non-redundant protein sequence archive records through the UniProt REST API, including UniParc ID, source accessions, sequence, taxon summaries, and sequence features.
    identity:
      stableIdFields: [uniparc_id]
      namespace: uniprot.uniparc_id
      primaryUrlTemplate: https://www.uniprot.org/uniparc/{stable_id}
    commonFields:
      - uniparc_id
      - cross_reference_count
      - uniprotkb_accessions
      - common_taxons
      - sequence
      - sequence_length
      - molecular_weight
      - crc64
      - md5
      - sequence_features
      - oldest_cross_ref_created
      - most_recent_cross_ref_updated
      - url
    rest:
      request:
        path: /uniparc/search
        method: GET
        rawQueryParam: query
        limitParam: size
        cursorParam: cursor
        queryParams:
          format: json
    fields:
      - name: uniparc_id
        type: string
        description: UniParc sequence identifier.
        namespace: uniparc.id
      - name: cross_reference_count
        type: number
        description: Number of UniParc cross-references.
      - name: uniprotkb_accessions
        type: array
        description: UniProtKB accessions associated with this UniParc sequence.
        namespace: uniprot.accession
      - name: common_taxons
        type: array
        description: Common taxon summaries for cross-referenced entries.
      - name: sequence
        type: string
        description: UniParc sequence text.
      - name: sequence_length
        type: number
        description: UniParc sequence length.
      - name: molecular_weight
        type: number
        description: Sequence molecular weight.
      - name: crc64
        type: string
        description: Sequence CRC64 checksum.
      - name: md5
        type: string
        description: Sequence MD5 checksum.
      - name: sequence_features
        type: array
        description: Sequence feature summaries from InterPro/member databases.
      - name: oldest_cross_ref_created
        type: string
        description: Oldest cross-reference creation date.
      - name: most_recent_cross_ref_updated
        type: string
        description: Most recent cross-reference update date.
      - name: url
        type: string
        description: Canonical UniParc record page.
  - id: proteome
    summary: UniProt Proteomes records through the UniProt REST API, including proteome ID, organism, assembly, component counts, protein counts, completeness, and citations.
    identity:
      stableIdFields: [id]
      namespace: uniprot.proteome_id
      primaryUrlTemplate: https://www.uniprot.org/proteomes/{stable_id}
    commonFields:
      - id
      - organism
      - common_name
      - tax_id
      - modified
      - proteome_type
      - superkingdom
      - gene_count
      - protein_count
      - reviewed_protein_count
      - unreviewed_protein_count
      - isoform_protein_count
      - genome_assembly
      - genome_annotation
      - component_count
      - components
      - pubmed_ids
      - url
    rest:
      request:
        path: /proteomes/search
        method: GET
        rawQueryParam: query
        limitParam: size
        cursorParam: cursor
        queryParams:
          format: json
    fields:
      - name: id
        type: string
        description: UniProt proteome identifier, for example UP000005640.
        namespace: uniprot.proteome
      - name: organism
        type: string
        description: Scientific organism name.
      - name: common_name
        type: string
        description: Common organism name.
      - name: tax_id
        type: number
        description: NCBI taxonomy identifier.
        namespace: ncbi.taxonomy
      - name: modified
        type: string
        description: Proteome record modification date.
      - name: proteome_type
        type: string
        description: Proteome type such as Reference proteome.
      - name: superkingdom
        type: string
        description: Superkingdom classification.
      - name: gene_count
        type: number
        description: Gene count reported for the proteome.
      - name: protein_count
        type: number
        description: Protein count reported for the proteome.
      - name: reviewed_protein_count
        type: number
        description: Reviewed protein count.
      - name: unreviewed_protein_count
        type: number
        description: Unreviewed protein count.
      - name: isoform_protein_count
        type: number
        description: Isoform protein count.
      - name: genome_assembly
        type: object
        description: Genome assembly summary.
      - name: genome_annotation
        type: object
        description: Genome annotation summary.
      - name: component_count
        type: number
        description: Number of proteome components returned by UniProt.
      - name: components
        type: array
        description: Component summaries, capped to the first 50 components.
      - name: pubmed_ids
        type: array
        description: PubMed identifiers from proteome citations.
        namespace: ncbi.pubmed
      - name: url
        type: string
        description: Canonical UniProt proteome record page.
  - id: id_mapping
    summary: UniProt ID Mapping REST workflow for converting UniProt accessions to external database identifiers such as Ensembl, PDB, RefSeq, GeneID, EMBL, or UniParc through the official asynchronous mapping job API.
    commonFields:
      - from
      - to
      - from_db
      - to_db
      - job_id
      - target
      - failed
      - failure
    rest:
      request:
        path: /idmapping/run
        method: POST
    fields:
      - name: from
        type: string
        description: Source identifier submitted to the mapping job.
        synonyms:
          - source_id
          - uniprot_accession
          - accession
        namespace: uniprot.accession
      - name: to
        type: string
        description: Target identifier returned by UniProt ID Mapping.
        synonyms:
          - target_id
          - mapped_id
      - name: from_db
        type: string
        description: UniProt ID Mapping source database code, for example UniProtKB_AC-ID.
        synonyms:
          - source_database
          - from_database
      - name: to_db
        type: string
        description: UniProt ID Mapping target database code, for example Ensembl, PDB, RefSeq_Nucleotide, RefSeq_Protein, GeneID, EMBL, or UniParc.
        synonyms:
          - target_database
          - to_database
      - name: ids
        type: array
        description: Source identifiers to submit to the mapping job; accepted as an array or comma/space separated string filter.
        synonyms:
          - accessions
          - source_ids
          - uniprot_ids
      - name: job_id
        type: string
        description: UniProt asynchronous ID mapping job identifier used for status and results retrieval.
      - name: target
        type: object
        description: Raw target object when the UniProt ID mapping result returns structured target metadata rather than a plain identifier.
      - name: failed
        type: boolean
        description: Whether this row represents an input identifier that UniProt reported as failed or unmapped.
        synonyms:
          - unmapped
          - failed_id
      - name: failure
        type: object
        description: Raw UniProt failedIds object when the ID mapping API returns structured failure metadata.
xref:
  - from:
      domain: protein
      field: gene_name
