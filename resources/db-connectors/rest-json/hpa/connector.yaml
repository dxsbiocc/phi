phiDbConnectorVersion: 1
id: rest-json/hpa
name: Human Protein Atlas
protocolFamily: rest-json
curationTier: curated
baseUrl: https://www.proteinatlas.org
networkPolicy:
  allowedHosts:
    - www.proteinatlas.org
  allowRedirects: false
auth:
  type: none
rateLimit:
  withoutAuth:
    requestsPerSecond: 3
retryPolicy:
  maxAttempts: 3
  baseDelayMs: 500
  maxDelayMs: 5000
domains:
  - id: gene
    summary: Human Protein Atlas gene JSON entry by Ensembl gene ID or gene symbol path.
    identity:
      stableIdFields: [Ensembl]
      namespace: ensembl.gene_id
      primaryUrlTemplate: https://www.proteinatlas.org/{stable_id}
    commonFields:
      [
        Gene,
        Gene synonym,
        Ensembl,
        Gene description,
        Uniprot,
        Chromosome,
        Position,
        Protein class,
        Biological process,
        Molecular function,
        Disease involvement,
        RNA tissue specificity,
        RNA tissue specific nTPM,
        Tissue expression summary,
        Subcellular location
      ]
    rest:
      request:
        path: /{filter:id}.json
      response:
        rowsPath: $
    fields:
      - name: id
        type: string
        description: Ensembl gene ID or HPA gene path identifier such as ENSG00000141510 or TP53.
        synonyms: [ensembl, gene, gene_symbol, symbol]
        namespace: ensembl.gene_id
      - name: Gene
        type: string
        description: Gene symbol.
        namespace: hgnc.symbol
      - name: Ensembl
        type: string
        description: Ensembl gene identifier.
        namespace: ensembl.gene_id
      - name: Uniprot
        type: array
        description: UniProt accessions linked by HPA.
        namespace: uniprot.accession
      - name: RNA tissue specificity
        type: string
        description: RNA tissue specificity category.
      - name: Subcellular location
        type: array
        description: Annotated subcellular locations.
  - id: search
    summary: Search Human Protein Atlas genes and download selected annotation columns as JSON.
    identity:
      stableIdFields: [Ensembl]
      namespace: ensembl.gene_id
      primaryUrlTemplate: https://www.proteinatlas.org/{stable_id}
    commonFields:
      [
        Gene,
        'Gene synonym',
        Ensembl,
        Uniprot,
        'RNA tissue specific nTPM',
        'Tissue expression summary'
      ]
    rest:
      request:
        path: /api/search_download.php
        filterParamMap: { search: search, format: format, columns: columns, compress: compress }
        queryParams:
          format: json
          columns: g,gs,eg,u,rf,rts
      response:
        rowsPath: $
    fields:
      - name: search
        type: string
        description: Free-text gene or annotation search term.
        synonyms: [query, gene, gene_symbol]
      - name: columns
        type: string
        description: Optional HPA column codes overriding the default curated set.
      - name: Gene
        type: string
        description: Gene symbol.
        namespace: hgnc.symbol
      - name: Ensembl
        type: string
        description: Ensembl gene identifier.
        namespace: ensembl.gene_id
      - name: Uniprot
        type: string
        description: UniProt accession when returned by search columns.
        namespace: uniprot.accession
  - id: search_pathology
    summary: Search HPA genes with cancer pathology columns (prognostic and cancer specificity).
    identity:
      stableIdFields: [Ensembl]
      namespace: ensembl.gene_id
      primaryUrlTemplate: https://www.proteinatlas.org/{stable_id}
    commonFields:
      [Gene, Ensembl, Uniprot, 'Cancer prognostic summary', 'RNA cancer specificity']
    rest:
      request:
        path: /api/search_download.php
        filterParamMap: { search: search, columns: columns }
        queryParams:
          format: json
          columns: g,eg,u,pc,rcs
      response:
        rowsPath: $
    fields:
      - name: search
        type: string
        description: Free-text gene or cancer annotation search term.
        synonyms: [query, gene, gene_symbol]
      - name: columns
        type: string
        description: Optional HPA column codes overriding the pathology defaults.
      - name: Gene
        type: string
        description: Gene symbol.
        namespace: hgnc.symbol
      - name: Ensembl
        type: string
        description: Ensembl gene identifier.
        namespace: ensembl.gene_id
xref:
  - from:
      domain: gene
      field: Gene
      namespace: hgnc.symbol
      species: '9606'
    to:
      domain: gene
      field: Ensembl
      namespace: ensembl.gene_id
      species: '9606'
  - from:
      domain: gene
      field: Uniprot
      namespace: uniprot.accession
    to:
      database: rest-json/uniprot
      domain: protein
      field: accession
      namespace: uniprot.accession
