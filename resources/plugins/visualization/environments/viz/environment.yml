name: viz
description: 组学绘图模板使用的 R 4.4 与 Python 3.12（Python 仅含标准库）。
channels:
  - conda-forge
  - bioconda
dependencies:
  # Interpreters. Only these two are pinned; the lock files pin everything else.
  # python: the three standard-library scripts. r-base: Rscript, and grid, stats,
  # grDevices, graphics, and tools.
  - python=3.12
  - r-base=4.4

  # Alphabetical. Counts are R files out of 159. A package with no count is an
  # Import or Depends of a source package and is not loaded by a template itself.
  # bioconda is only for bioconductor-complexheatmap; everything else is conda-forge.
  # r-ggplot2 stays unpinned so the ggideogram patch in common.R can target 4.x.
  - bioconductor-complexheatmap # ComplexHeatmap, 11
  - r-ade4 # ggcor
  - r-aplot # 2
  - r-circlize # 12
  - r-cli # 1 (ggideogram patch); also ggmagnify
  - r-deldir # ggforce voronoi; templates do not load it
  - r-digest # ggcor, linkET
  - r-dplyr # ggideogram, ggcor, linkET, ggsankey
  - r-forcats # ggsankey
  - r-geomtextpath # 3
  - r-ggbeeswarm # 2
  - r-ggextra # 1, import name ggExtra
  - r-ggforce # 9; also gground
  - r-ggh4x # 2
  - r-gghalves # 3
  - r-ggnewscale # 6
  - r-ggplot2 # 146
  - r-ggprism # 115
  - r-ggpubr # 9
  - r-ggraph # 18; also ggcor
  - r-ggrepel # 14
  - r-ggridges # 1
  - r-ggsignif # 3
  - r-ggtern # 1
  - r-ggvenn # 1
  - r-glue # linkET, ggsvg
  - r-graphlayouts # 1
  - r-gridextra # ggmagnify
  - r-gtable # 3; also linkET
  - r-hexbin # 1
  - r-igraph # ggcor
  - r-jsonlite # 6
  - r-magrittr # ggideogram, linkET, ggsankey
  - r-patchwork # 14
  - r-polyclip # gridGeometry
  - r-purrr # ggcor, linkET, ggsankey
  - r-quantreg # 1
  - r-rcolorbrewer # ggcor
  - r-readr # 154
  - r-rlang # gground, ggideogram, linkET, ggsvg, ggmagnify
  - r-rsvg # ggsvg
  - r-scales # 6; also ggcor, linkET, ggsvg
  - r-sf # 1
  - r-stringr # ggsankey, ggsvg
  - r-survival # 1
  - r-survminer # 1
  - r-tibble # ggcor, linkET
  - r-tidygraph # 18; also ggcor
  - r-tidyr # ggsankey
  - r-vctrs # gground
  - r-vegan # ggcor
  - r-yaml # 1, layouts/validate_layouts.R
sourcePackages:
  # Order: an entry depends only on conda packages or on an earlier entry.
  # None of the seven template packages depend on each other. gridGeometry is
  # installed before ggmagnify, which Imports it. No conda build exists for it.
