# Standalone wrapper chaining two STAR modules from nf-core/modules —
# genome index generation, then alignment. RNA-seq is STAR's dominant use
# case (splice-aware aligner), but the tool and these modules aren't
# RNA-seq-exclusive; see ../fastqc/wrapper.yaml's doc
# comment for why this is namespaced `nf-core/modules/*`, not
# `nf-core/rnaseq/*`.
#
# Why this exists alongside the full `nf-core/rnaseq/rnaseq` wrapper: the
# product docs (phi-wrapper-product-prd.md Non-Goals) explicitly rule out
# "arbitrary wrapper composition" — Phi has no mechanism for one wrapper to
# declare/invoke another, and building one is out of scope (Phase 3+
# Future Extensions). Unlike the single-module wrappers in this namespace
# (fastqc, trimgalore, multiqc), this one chains two real modules
# (STAR_GENOMEGENERATE + STAR_ALIGN) itself, since alignment needs an
# index and there's no separate "build a STAR index" wrapper to depend on
# — see workflows/star_align.nf's own doc comment. Both modules are
# vendored unmodified.
phiWrapperVersion: 1
id: nf-core/modules/star-align
shortId: star-align
name: STAR alignment (nf-core module)
# manifest.ts requires strict SemVer — STAR's own version string is
# "2.7.11b" (a trailing patch letter, not valid SemVer), so this drops the
# letter. The real upstream version was confirmed in a real run's output:
# "STAR version: 2.7.11b".
version: 2.7.11
summary: Build a STAR genome index and align FASTQ reads to it.

runtime:
  minVersion: 1.0.0
  maxVersion: 1.x

source:
  # See fastqc/wrapper.yaml's source comment — same
  # shared-library provenance. Vendored at the commits nf-core/rnaseq
  # 3.26.0's modules.json pinned:
  # star/genomegenerate 481efe07277c76e23738b4be0724ba7d99653d7e,
  # star/align cebe21bbd158c15c8fab172e37cfe97a239f4b77.
  repository: https://github.com/nf-core/modules
  ref: master

verification:
  status: unverified
  registry: none

registryStatus: active
# Genome indexing is genuinely scheduler-class work for anything beyond a
# toy reference — see resources.defaults below.
resourceClass: hpc

engine:
  type: nextflow
  entrypoint: main.nf
  profiles:
    - id: local
      executor: local
      containerRuntime: docker
      nextflowProfile: docker
    - id: slurm-controller
      executor: remote
      scheduler: slurm
      controller: sbatch
      containerRuntime: singularity
      nextflowProfile: singularity

inputs:
  - id: reads
    type: fastq_reads
    layout: paired_end
    required: true
    samplesheet:
      columns:
        - sample
        - fastq_1
        - fastq_2
  - id: fasta
    type: reference_fasta
    required: true
  - id: gtf
    type: reference_gtf
    required: true

parameters:
  schema:
    type: object
    properties: {}

outputs:
  - id: star_index
    label: STAR genome index
    type: directory
    path: star_index/star
  - id: alignments
    label: Aligned BAMs + STAR logs (per sample)
    type: directory
    path: star_align
    primary: true

resources:
  # Sized as a reasonable default for a real (not toy) reference genome —
  # STAR_GENOMEGENERATE's memory need scales with genome size, so a large
  # genome (e.g. human) needs meaningfully more than this; a small/test
  # reference needs much less. Verified against a real, larger reference:
  # nf-core/rnaseq's own conf/base.config sizes this same step's
  # `process_high` label at 12 CPU / 72 GB / 16h.
  defaults:
    cpus: 8
    memory: 32 GB
    time: 8h

permissions:
  filesystem:
    read:
      - input_paths
    write:
      - run_workdir
      - declared_outdir
  network:
    default: disabled
  remote:
    allowed: false

license:
  wrapper: MIT
  tools:
    - name: STAR
      license: MIT
    - name: samtools
      license: MIT

citations:
  - id: nf-core
    doi: 10.1038/s41587-020-0439-x

dataPolicy:
  acceptedSensitivity:
    - public
    - internal
  externalTransfer:
    default: false
