# Agent-facing wrapper adapter for the vendored star_genomeparams_upgrade
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# star/genomegenerate is composed directly (not a wrapper, per section 6) so
# callers supply a genome FASTA/GTF instead of a pre-built STAR index.
id: local/modules/star-genomeparams-upgrade
name: STAR genomeParameters upgrade
summary: Rewrite a legacy STAR index's genomeParameters.txt (versionGenome 20201) to the current-version format so newer STAR can load it.

params:
  fasta:
    kind: input
    type: fasta
    required: true
    description: Genome FASTA to build the STAR index from.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF for the STAR index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the (possibly upgraded) STAR index.

outputs:
  index:
    type: directory
    path: '${outdir}/star_genomeparams_upgrade'
    primary: true
