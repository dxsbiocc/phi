# Agent-facing wrapper adapter for the vendored bwa/aln module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the index with the vendored bwa index module first.
id: nf-core/modules/bwa-aln
name: "BWA aln"
summary: "Find suffix-array coordinates of reads with bwa aln (builds the index first)."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Reads FASTQ (.fastq.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  sai:
    type: directory
    path: '${outdir}/bwa_aln'
    primary: true
