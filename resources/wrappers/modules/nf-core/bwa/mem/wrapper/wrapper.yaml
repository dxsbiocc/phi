# Agent-facing wrapper adapter for the vendored bwa/mem module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: uses a pre-built `index` as-is, or builds one with the vendored
# bwa index module first.
id: nf-core/modules/bwa-mem
name: "BWA-MEM align"
summary: "Align reads with BWA-MEM, against a pre-built index or one built from a reference FASTA."

params:
  reads1:
    kind: input
    type: file
    required: true
    description: "Forward reads FASTQ (.fastq.gz)."
  reads2:
    kind: input
    type: file
    required: true
    description: "Reverse reads FASTQ (.fastq.gz)."
  index:
    kind: input
    type: directory
    required: false
    description: "Pre-built BWA index directory (holding one set of *.amb/*.ann/*.bwt/*.pac/*.sa files). Preferred for large genomes; when set, no index is built."
  fasta:
    kind: input
    type: file
    required: false
    description: "Reference FASTA file. Required only when `index` is not given (the index is then built from it)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bwa_mem'
    primary: true
