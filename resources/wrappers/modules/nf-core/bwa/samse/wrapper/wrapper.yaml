# Agent-facing wrapper adapter for the vendored bwa/samse module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the index and runs bwa aln with the vendored index and aln modules first.
id: nf-core/modules/bwa-samse
name: "BWA samse"
summary: "Generate single-end alignments from bwa aln output with bwa samse (index → aln → samse)."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Reads FASTQ (.fastq.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bwa_samse'
    primary: true
