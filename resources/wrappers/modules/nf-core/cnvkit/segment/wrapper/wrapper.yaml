# Agent-facing wrapper adapter for the vendored cnvkit/segment module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/cnvkit-segment
name: "CNVkit segment"
summary: "Segment copy-number ratios with CNVkit segment."

params:
  cnr:
    kind: input
    type: file
    required: true
    description: "Copy-number ratios (.cnr)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  segments:
    type: directory
    path: '${outdir}/cnvkit_segment'
    primary: true
