# Agent-facing wrapper adapter for the vendored cnvkit/antitarget module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/cnvkit-antitarget
name: "CNVkit antitarget"
summary: "Derive antitarget bins from targets with CNVkit antitarget."

params:
  targets:
    kind: input
    type: file
    required: true
    description: "Targets BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/cnvkit_antitarget'
    primary: true
