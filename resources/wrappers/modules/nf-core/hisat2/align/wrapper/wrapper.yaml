# Agent-facing wrapper adapter for the vendored hisat2/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composes hisat2/extractsplicesites + hisat2/align, plus hisat2/build when
# no pre-built `index` is given. The default params.json builds one because
# there's no pre-built index in test-datasets to point it at; real genomes
# should pass `index`.
id: nf-core/modules/hisat2-align
name: hisat2 align
summary: Align paired-end RNA-seq reads to a reference genome with HISAT2.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 2.
  index:
    kind: input
    type: directory
    required: false
    description: Pre-built HISAT2 index directory (holding one set of *.ht2 files). Preferred for large genomes; when set, `fasta` is not needed and no index is built.
  fasta:
    kind: input
    type: fasta
    required: false
    description: Reference genome FASTA to build a splice-aware HISAT2 index from. Required only when `index` is not given; slow and memory-hungry for mammalian genomes.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF — splice sites for alignment, and for the index when one is built.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the alignment BAM and summary log.

outputs:
  bam:
    type: directory
    path: '${outdir}/hisat2_align'
    primary: true
