# Agent-facing wrapper adapter for the vendored hisat2/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composes hisat2/extractsplicesites + hisat2/build + hisat2/align
# internally — see ../wrapper/main.nf's own comment for why: nf-core's own
# module tests build the index the same way as a setup step, since there's
# no pre-built index in test-datasets to just point this wrapper's default
# params.json at.
id: nf-core/modules/hisat2-align
name: hisat2 align
summary: Align paired-end RNA-seq reads to a reference genome with HISAT2.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 2.
  fasta:
    kind: input
    type: fasta
    required: true
    description: Reference genome FASTA to build the HISAT2 index from and align against.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF used to build a splice-aware index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the alignment BAM and summary log.

outputs:
  bam:
    type: directory
    path: '${outdir}/hisat2_align'
    primary: true
