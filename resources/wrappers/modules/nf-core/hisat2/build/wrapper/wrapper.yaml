# Agent-facing wrapper adapter for the vendored hisat2/build module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composes hisat2/extractsplicesites + hisat2/build internally so the
# resulting index is splice-aware by default — see ../wrapper/main.nf's own
# comment for why.
id: nf-core/modules/hisat2-build
name: hisat2 build
summary: Build a splice-aware HISAT2 index for a reference genome.

params:
  fasta:
    kind: input
    type: fasta
    required: true
    description: Reference genome FASTA to index.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF used to build a splice-aware index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the HISAT2 index.

outputs:
  index:
    type: directory
    path: '${outdir}/hisat2_build'
    primary: true
