# Agent-facing wrapper adapter for the vendored bismark/deduplicate module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bismark-deduplicate
name: "Bismark deduplicate"
summary: "Remove duplicate bisulfite alignments with deduplicate_bismark."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Bismark-aligned paired-end BAM."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bismark_deduplicate'
    primary: true
