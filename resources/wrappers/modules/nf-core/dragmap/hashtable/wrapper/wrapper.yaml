# Agent-facing wrapper adapter for the vendored dragmap/hashtable module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/dragmap-hashtable
name: "DRAGMAP hashtable"
summary: "Build a DRAGMAP hash table from a reference FASTA."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  hashmap:
    type: directory
    path: '${outdir}/dragmap_hashtable'
    primary: true
