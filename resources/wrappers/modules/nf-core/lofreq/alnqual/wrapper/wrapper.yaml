# Agent-facing wrapper adapter for the vendored lofreq/alnqual module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/lofreq-alnqual
name: "LoFreq alnqual"
summary: "Insert alignment qualities into a BAM with LoFreq."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/lofreq_alnqual'
    primary: true
