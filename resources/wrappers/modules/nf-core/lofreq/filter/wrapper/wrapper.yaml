# Agent-facing wrapper adapter for the vendored lofreq/filter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/lofreq-filter
name: "LoFreq filter"
summary: "Filter LoFreq variant calls."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/lofreq_filter'
    primary: true
