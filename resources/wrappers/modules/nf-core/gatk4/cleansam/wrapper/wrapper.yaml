# Agent-facing wrapper adapter for the vendored gatk4/cleansam module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-cleansam
name: "GATK4 CleanSam"
summary: "Clean a BAM (soft-clip past reference end, MAPQ 0 for unmapped reads) with GATK4 CleanSam."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_cleansam'
    primary: true
