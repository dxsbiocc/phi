# Agent-facing wrapper adapter for the vendored gatk4/variantstotable module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-variantstotable
name: "GATK4 VariantsToTable"
summary: "Extract selected VCF fields into a TSV table with GATK4 VariantsToTable."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file."
  idx:
    kind: input
    type: file
    required: true
    description: "Index (.idx) for the VCF."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  table:
    type: directory
    path: '${outdir}/gatk4_variantstotable'
    primary: true
