# Agent-facing wrapper adapter for the vendored gatk4/svcluster module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-svcluster
name: "GATK4 SVCluster"
summary: "Cluster structural-variant VCFs with GATK4 SVCluster."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped structural-variant VCF."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the SV VCF."
  ploidy:
    kind: input
    type: file
    required: true
    description: "Per-sample ploidy table (TSV)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  clustered_vcf:
    type: directory
    path: '${outdir}/gatk4_svcluster'
    primary: true
