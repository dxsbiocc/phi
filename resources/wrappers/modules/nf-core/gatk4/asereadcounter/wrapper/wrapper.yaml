# Agent-facing wrapper adapter for the vendored gatk4/asereadcounter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-asereadcounter
name: "GATK4 ASEReadCounter"
summary: "Count allele-specific reads at heterozygous sites with GATK4 ASEReadCounter."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF of heterozygous sites."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  intervals:
    kind: input
    type: file
    required: true
    description: "Interval list restricting the counted sites."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  csv:
    type: directory
    path: '${outdir}/gatk4_asereadcounter'
    primary: true
