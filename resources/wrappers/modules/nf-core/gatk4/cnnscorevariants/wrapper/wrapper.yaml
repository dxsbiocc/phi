# Agent-facing wrapper adapter for the vendored gatk4/cnnscorevariants module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-cnnscorevariants
name: "GATK4 CNNScoreVariants"
summary: "Score variants with a convolutional neural network using GATK4 CNNScoreVariants."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF to score."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gatk4_cnnscorevariants'
    primary: true
