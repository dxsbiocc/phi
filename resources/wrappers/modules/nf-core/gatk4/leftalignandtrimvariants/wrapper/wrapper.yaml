# Agent-facing wrapper adapter for the vendored gatk4/leftalignandtrimvariants module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-leftalignandtrimvariants
name: "GATK4 LeftAlignAndTrimVariants"
summary: "Left-align and trim indels in a VCF with GATK4 LeftAlignAndTrimVariants."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  intervals:
    kind: input
    type: file
    required: true
    description: "BED of intervals to restrict to."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gatk4_leftalignandtrimvariants'
    primary: true
