# Agent-facing wrapper adapter for the vendored gatk4/germlinecnvcaller module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: chains vendored collectreadcounts, determinegermlinecontigploidy and bedtointervallist first.
id: nf-core/modules/gatk4-germlinecnvcaller
name: "GATK4 GermlineCNVCaller"
summary: "Call germline copy-number variants in cohort mode (CollectReadCounts → DetermineGermlineContigPloidy → GermlineCNVCaller)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  bam2:
    kind: input
    type: file
    required: true
    description: "Second coordinate-sorted BAM file."
  bai2:
    kind: input
    type: file
    required: true
    description: "Second BAM index (.bai)."
  intervals:
    kind: input
    type: file
    required: true
    description: "BED of intervals to count reads over."
  ploidy_priors:
    kind: input
    type: file
    required: true
    description: "Contig ploidy priors table (TSV)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  cohortcalls:
    type: directory
    path: '${outdir}/gatk4_germlinecnvcaller'
    primary: true
