# Agent-facing wrapper adapter for the vendored gatk4/getpileupsummaries module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-getpileupsummaries
name: "GATK4 GetPileupSummaries"
summary: "Summarize allele counts at common germline sites for contamination estimation with GATK4 GetPileupSummaries."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  intervals:
    kind: input
    type: file
    required: true
    description: "Interval list to restrict to."
  variants:
    kind: input
    type: file
    required: true
    description: "Common germline variants VCF (e.g. gnomAD)."
  variants_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the variants VCF."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  table:
    type: directory
    path: '${outdir}/gatk4_getpileupsummaries'
    primary: true
