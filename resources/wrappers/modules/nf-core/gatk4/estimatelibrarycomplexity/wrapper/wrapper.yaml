# Agent-facing wrapper adapter for the vendored gatk4/estimatelibrarycomplexity module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-estimatelibrarycomplexity
name: "GATK4 EstimateLibraryComplexity"
summary: "Estimate library complexity from duplicate reads in a BAM with GATK4 EstimateLibraryComplexity."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file to analyze."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  metrics:
    type: directory
    path: '${outdir}/gatk4_estimatelibrarycomplexity'
    primary: true
