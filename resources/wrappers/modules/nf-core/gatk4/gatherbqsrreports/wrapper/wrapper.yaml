# Agent-facing wrapper adapter for the vendored gatk4/gatherbqsrreports module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-gatherbqsrreports
name: "GATK4 GatherBQSRReports"
summary: "Gather BQSR recalibration tables into one report with GATK4 GatherBQSRReports."

params:
  table:
    kind: input
    type: file
    required: true
    description: "BQSR recalibration table."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  table:
    type: directory
    path: '${outdir}/gatk4_gatherbqsrreports'
    primary: true
