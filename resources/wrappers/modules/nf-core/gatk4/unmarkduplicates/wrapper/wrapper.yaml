# Agent-facing wrapper adapter for the vendored gatk4/unmarkduplicates module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-unmarkduplicates
name: "GATK4 UnmarkDuplicates"
summary: "Clear the duplicate flag on all reads in a BAM with GATK4 UnmarkDuplicates."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file with duplicate-marked reads."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_unmarkduplicates'
    primary: true
