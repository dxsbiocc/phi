# Agent-facing wrapper adapter for the vendored gatk4/splitcram module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-splitcram
name: "GATK4 SplitCram"
summary: "Split a CRAM into several smaller CRAM shards with GATK4 SplitCram."

params:
  cram:
    kind: input
    type: file
    required: true
    description: "Input CRAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  split_crams:
    type: directory
    path: '${outdir}/gatk4_splitcram'
    primary: true
