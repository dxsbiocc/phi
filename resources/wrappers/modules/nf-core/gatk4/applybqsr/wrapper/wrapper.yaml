# Agent-facing wrapper adapter for the vendored gatk4/applybqsr module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Pairs with nf-core/modules/gatk4-baserecalibrator, whose table output
# feeds this tool's `table` input.
id: nf-core/modules/gatk4-applybqsr
name: GATK4 ApplyBQSR
summary: Apply a base quality score recalibration (BQSR) table to a BAM with GATK4 ApplyBQSR.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Coordinate-sorted BAM file.
  bai:
    kind: input
    type: file
    required: true
    description: BAM index (.bai) for the input BAM.
  table:
    kind: input
    type: file
    required: true
    description: BQSR recalibration table (from GATK4 BaseRecalibrator).
  fasta:
    kind: input
    type: file
    required: true
    description: Reference FASTA file.
  fai:
    kind: input
    type: file
    required: true
    description: FASTA index (.fai) for the reference.
  dict:
    kind: input
    type: file
    required: true
    description: Sequence dictionary (.dict) for the reference.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the recalibrated BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_applybqsr'
    primary: true
