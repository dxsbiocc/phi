# Agent-facing wrapper adapter for the vendored gatk4/splitncigarreads module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-splitncigarreads
name: "GATK4 SplitNCigarReads"
summary: "Split RNA-seq reads at N (splice) cigar operators with GATK4 SplitNCigarReads."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_splitncigarreads'
    primary: true
