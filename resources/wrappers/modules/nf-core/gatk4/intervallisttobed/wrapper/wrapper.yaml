# Agent-facing wrapper adapter for the vendored gatk4/intervallisttobed module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-intervallisttobed
name: "GATK4 IntervalListToBed"
summary: "Convert a GATK/Picard interval list to BED with GATK4 IntervalListToBed."

params:
  intervals:
    kind: input
    type: file
    required: true
    description: "Interval list file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/gatk4_intervallisttobed'
    primary: true
