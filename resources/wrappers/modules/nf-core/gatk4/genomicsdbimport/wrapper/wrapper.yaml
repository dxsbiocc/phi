# Agent-facing wrapper adapter for the vendored gatk4/genomicsdbimport module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-genomicsdbimport
name: "GATK4 GenomicsDBImport"
summary: "Import gVCFs into a GenomicsDB workspace with GATK4 GenomicsDBImport."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped gVCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the gVCF."
  intervals:
    kind: input
    type: file
    required: true
    description: "Interval list for the import."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  genomicsdb:
    type: directory
    path: '${outdir}/gatk4_genomicsdbimport'
    primary: true
