# Agent-facing wrapper adapter for the vendored gatk4/composestrtablefile module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-composestrtablefile
name: "GATK4 ComposeSTRTableFile"
summary: "Build the STR table file used by DRAGstr calibration with GATK4 ComposeSTRTableFile."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  str_table:
    type: directory
    path: '${outdir}/gatk4_composestrtablefile'
    primary: true
