# Agent-facing wrapper adapter for the vendored gatk4/addorreplacereadgroups module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-addorreplacereadgroups
name: "GATK4 AddOrReplaceReadGroups"
summary: "Add or replace the read-group header on a BAM with GATK4 AddOrReplaceReadGroups."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file to update."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_addorreplacereadgroups'
    primary: true
