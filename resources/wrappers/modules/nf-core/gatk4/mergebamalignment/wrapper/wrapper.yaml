# Agent-facing wrapper adapter for the vendored gatk4/mergebamalignment module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-mergebamalignment
name: "GATK4 MergeBamAlignment"
summary: "Merge aligned reads with the original unmapped BAM using GATK4 MergeBamAlignment."

params:
  aligned:
    kind: input
    type: file
    required: true
    description: "Aligned BAM file."
  unmapped:
    kind: input
    type: file
    required: true
    description: "Original unmapped BAM file."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_mergebamalignment'
    primary: true
