# Agent-facing wrapper adapter for the vendored gatk4/postprocessgermlinecnvcalls module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: full cohort CNV chain (read counts, contig ploidy, cohort caller) feeds the post-processing step.
id: nf-core/modules/gatk4-postprocessgermlinecnvcalls
name: "GATK4 PostprocessGermlineCNVCalls"
summary: "Post-process cohort CNV calls into genotyped VCFs (… → GermlineCNVCaller → PostprocessGermlineCNVCalls)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  bam2:
    kind: input
    type: file
    required: true
    description: "Second coordinate-sorted BAM file."
  bai2:
    kind: input
    type: file
    required: true
    description: "Second BAM index (.bai)."
  intervals:
    kind: input
    type: file
    required: true
    description: "BED of intervals to count reads over."
  ploidy_priors:
    kind: input
    type: file
    required: true
    description: "Contig ploidy priors table (TSV)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  intervals:
    type: directory
    path: '${outdir}/gatk4_postprocessgermlinecnvcalls'
    primary: true
