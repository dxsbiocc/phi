# Agent-facing wrapper adapter for the vendored gatk4/modelsegments module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: chains vendored sibling modules through DenoiseReadCounts before segmenting.
id: nf-core/modules/gatk4-modelsegments
name: "GATK4 ModelSegments"
summary: "Segment denoised copy ratios (… → DenoiseReadCounts → ModelSegments)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  segmented:
    type: directory
    path: '${outdir}/gatk4_modelsegments'
    primary: true
