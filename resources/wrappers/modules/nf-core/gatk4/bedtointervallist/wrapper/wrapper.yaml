# Agent-facing wrapper adapter for the vendored gatk4/bedtointervallist module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-bedtointervallist
name: "GATK4 BedToIntervalList"
summary: "Convert a BED file to a GATK/Picard interval list with GATK4 BedToIntervalList."

params:
  bed:
    kind: input
    type: file
    required: true
    description: "BED file to convert."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  interval_list:
    type: directory
    path: '${outdir}/gatk4_bedtointervallist'
    primary: true
