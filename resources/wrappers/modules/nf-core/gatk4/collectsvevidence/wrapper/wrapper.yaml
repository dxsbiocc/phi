# Agent-facing wrapper adapter for the vendored gatk4/collectsvevidence module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-collectsvevidence
name: "GATK4 CollectSVEvidence"
summary: "Collect split-read and paired-end evidence for structural-variant calling with GATK4 CollectSVEvidence."

params:
  cram:
    kind: input
    type: file
    required: true
    description: "Input CRAM file."
  crai:
    kind: input
    type: file
    required: true
    description: "CRAM index (.crai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  paired_end_evidence:
    type: directory
    path: '${outdir}/gatk4_collectsvevidence'
    primary: true
