# Agent-facing wrapper adapter for the vendored gatk4/revertsam module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-revertsam
name: "GATK4 RevertSam"
summary: "Revert a BAM to an unaligned state (strip alignment info) with GATK4 RevertSam."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file to revert."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk4_revertsam'
    primary: true
