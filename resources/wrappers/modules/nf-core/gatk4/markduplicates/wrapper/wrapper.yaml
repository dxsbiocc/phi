# Agent-facing wrapper adapter for the vendored gatk4/markduplicates module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-markduplicates
name: GATK4 MarkDuplicates
summary: Mark (or remove) PCR/optical duplicate reads in a BAM with GATK4 MarkDuplicates.

params:
  bam:
    kind: input
    type: bam
    required: true
    description: Coordinate-sorted BAM file.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the duplicate-marked BAM, its index, and duplication metrics.

outputs:
  results:
    type: directory
    path: '${outdir}/gatk4_markduplicates'
    primary: true
