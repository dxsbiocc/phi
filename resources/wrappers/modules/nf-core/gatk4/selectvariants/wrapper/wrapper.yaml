# Agent-facing wrapper adapter for the vendored gatk4/selectvariants
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-selectvariants
name: GATK4 SelectVariants
summary: Select a subset of variants from a VCF (e.g. by region) with GATK4 SelectVariants.

params:
  vcf:
    kind: input
    type: file
    required: true
    description: Input VCF file.
  vcf_index:
    kind: input
    type: file
    required: true
    description: Index (.idx or .tbi) for the input VCF.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the selected variants.

outputs:
  vcf:
    type: directory
    path: '${outdir}/gatk4_selectvariants'
    primary: true
