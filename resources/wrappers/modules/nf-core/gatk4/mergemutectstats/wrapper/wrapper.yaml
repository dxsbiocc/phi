# Agent-facing wrapper adapter for the vendored gatk4/mergemutectstats module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-mergemutectstats
name: "GATK4 MergeMutectStats"
summary: "Merge Mutect2 .stats files into one with GATK4 MergeMutectStats."

params:
  stats:
    kind: input
    type: file
    required: true
    description: "Mutect2 stats file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  stats:
    type: directory
    path: '${outdir}/gatk4_mergemutectstats'
    primary: true
