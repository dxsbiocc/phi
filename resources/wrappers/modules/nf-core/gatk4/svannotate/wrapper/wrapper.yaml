# Agent-facing wrapper adapter for the vendored gatk4/svannotate module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-svannotate
name: "GATK4 SVAnnotate"
summary: "Annotate structural-variant VCFs with functional consequences using GATK4 SVAnnotate."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped structural-variant VCF."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the SV VCF."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gatk4_svannotate'
    primary: true
