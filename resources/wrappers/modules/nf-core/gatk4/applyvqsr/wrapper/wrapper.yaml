# Agent-facing wrapper adapter for the vendored gatk4/applyvqsr module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk4-applyvqsr
name: "GATK4 ApplyVQSR"
summary: "Apply a VQSR recalibration model to a VCF with GATK4 ApplyVQSR."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  recal:
    kind: input
    type: file
    required: true
    description: "Recalibration file (from VariantRecalibrator)."
  recal_idx:
    kind: input
    type: file
    required: true
    description: "Index (.idx) for the recalibration file."
  tranches:
    kind: input
    type: file
    required: true
    description: "Tranches file (from VariantRecalibrator)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gatk4_applyvqsr'
    primary: true
