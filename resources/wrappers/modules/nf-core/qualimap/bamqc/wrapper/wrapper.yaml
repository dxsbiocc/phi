# Agent-facing wrapper adapter for the vendored qualimap/bamqc module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/qualimap-bamqc
name: Qualimap bamqc
summary: Run Qualimap bamqc QC on a BAM alignment.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM file to run QC on.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the Qualimap report.

outputs:
  results:
    type: directory
    path: '${outdir}/qualimap_bamqc'
    primary: true
