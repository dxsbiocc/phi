# Agent-facing wrapper adapter for the vendored pigz/compress module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/pigz-compress
name: pigz compress
summary: Compress a file to gzip format with pigz (parallel gzip).

params:
  input:
    kind: input
    type: file
    required: true
    description: File to compress.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the compressed archive.

outputs:
  archive:
    type: directory
    path: '${outdir}/pigz_compress'
    primary: true
