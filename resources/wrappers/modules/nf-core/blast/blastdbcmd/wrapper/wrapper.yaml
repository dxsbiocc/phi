# Agent-facing wrapper adapter for the vendored blast/blastdbcmd module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds a protein BLAST database with the vendored makeblastdb module first.
id: nf-core/modules/blast-blastdbcmd
name: "blastdbcmd"
summary: "Extract sequences from a BLAST database by identifier (makeblastdb → blastdbcmd)."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Protein FASTA file."
  entry:
    kind: option
    type: string
    required: false
    description: "Sequence identifier to extract."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  fasta:
    type: directory
    path: '${outdir}/blast_blastdbcmd'
    primary: true
