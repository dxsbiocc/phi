# Agent-facing wrapper adapter for the vendored pindel/pindel module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/pindel-pindel
name: "Pindel"
summary: "Call indels and structural variants with Pindel."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  bed:
    kind: input
    type: file
    required: true
    description: "Regions BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  del:
    type: directory
    path: '${outdir}/pindel_pindel'
    primary: true
