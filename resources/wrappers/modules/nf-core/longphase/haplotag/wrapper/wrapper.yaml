# Agent-facing wrapper adapter for the vendored longphase/haplotag module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/longphase-haplotag
name: "LongPhase haplotag"
summary: "Tag long reads with their phased haplotype using LongPhase."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  vcf:
    kind: input
    type: file
    required: true
    description: "Phased genotype VCF (bgzipped)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/longphase_haplotag'
    primary: true
