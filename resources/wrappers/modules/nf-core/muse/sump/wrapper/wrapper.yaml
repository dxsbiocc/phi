# Agent-facing wrapper adapter for the vendored muse/sump module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/muse-sump
name: "MuSE sump"
summary: "Turn MuSE call output into a filtered VCF with MuSE sump."

params:
  call_txt:
    kind: input
    type: file
    required: true
    description: "MuSE call output (.txt)."
  dbsnp:
    kind: input
    type: file
    required: true
    description: "dbSNP VCF (bgzipped)."
  dbsnp_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for dbSNP."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/muse_sump'
    primary: true
