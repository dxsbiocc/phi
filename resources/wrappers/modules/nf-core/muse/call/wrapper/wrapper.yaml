# Agent-facing wrapper adapter for the vendored muse/call module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/muse-call
name: "MuSE call"
summary: "Call somatic SNVs from a tumour/normal pair with MuSE call."

params:
  tumor:
    kind: input
    type: file
    required: true
    description: "Tumour BAM."
  tumor_bai:
    kind: input
    type: file
    required: true
    description: "Tumour BAM index (.bai)."
  normal:
    kind: input
    type: file
    required: true
    description: "Normal BAM."
  normal_bai:
    kind: input
    type: file
    required: true
    description: "Normal BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  txt:
    type: directory
    path: '${outdir}/muse_call'
    primary: true
