# Agent-facing wrapper adapter for the vendored plink2/vcf module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/plink2-vcf
name: "plink2 vcf"
summary: "Convert a VCF to PLINK2 pgen/psam/pvar binary format."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Input VCF (optionally gzipped)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  pgen:
    type: directory
    path: '${outdir}/plink2_vcf'
    primary: true
