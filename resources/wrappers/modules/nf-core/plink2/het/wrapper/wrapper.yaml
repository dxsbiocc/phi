# Agent-facing wrapper adapter for the vendored plink2/het module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/plink2-het
name: "plink2 het"
summary: "Compute observed/expected autosomal heterozygosity per sample."

params:
  pgen:
    kind: input
    type: file
    required: true
    description: "PLINK2 genotype file (.pgen)."
  pvar:
    kind: input
    type: file
    required: true
    description: "PLINK2 variant file (.pvar)."
  psam:
    kind: input
    type: file
    required: true
    description: "PLINK2 sample file (.psam)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  het:
    type: directory
    path: '${outdir}/plink2_het'
    primary: true
