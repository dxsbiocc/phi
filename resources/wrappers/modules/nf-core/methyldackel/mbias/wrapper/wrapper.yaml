# Agent-facing wrapper adapter for the vendored methyldackel/mbias module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/methyldackel-mbias
name: "MethylDackel mbias"
summary: "Compute methylation-bias plots from a bisulfite BAM with MethylDackel mbias."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Bismark-aligned BAM."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  txt:
    type: directory
    path: '${outdir}/methyldackel_mbias'
    primary: true
