# Agent-facing wrapper adapter for the vendored methyldackel/extract module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/methyldackel-extract
name: "MethylDackel extract"
summary: "Extract per-base methylation calls from a bisulfite BAM with MethylDackel extract."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Bismark-aligned BAM."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bedgraph:
    type: directory
    path: '${outdir}/methyldackel_extract'
    primary: true
