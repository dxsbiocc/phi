# Agent-facing wrapper adapter for the vendored salmon/quant module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Uses a pre-built `index` as-is, or composes salmon/index to build one from
# `transcript_fasta` first. The default params.json builds one because there's
# no pre-built index in test-datasets to point it at.
id: nf-core/modules/salmon-quant
name: salmon quant
summary: Quantify transcript/gene expression from paired-end reads with salmon, against a pre-built or freshly built index.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 2.
  index:
    kind: input
    type: directory
    required: false
    description: Pre-built salmon index directory. When set, `transcript_fasta` is not needed and no index is built.
  transcript_fasta:
    kind: input
    type: fasta
    required: false
    description: Transcript sequences to build a salmon index from. Required only when `index` is not given.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF used for transcript-to-gene summarization.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the quantification results.

outputs:
  results:
    type: directory
    path: "${outdir}/salmon_quant"
    primary: true
