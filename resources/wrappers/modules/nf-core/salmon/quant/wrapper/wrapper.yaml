# Agent-facing wrapper adapter for the vendored salmon/quant module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composes salmon/index + salmon/quant internally — see ../wrapper/main.nf's
# own comment for why: no pre-built index in test-datasets to just point
# this wrapper's default params.json at.
id: nf-core/modules/salmon-quant
name: salmon quant
summary: Quantify transcript/gene expression from paired-end reads with salmon.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 2.
  transcript_fasta:
    kind: input
    type: fasta
    required: true
    description: Transcript sequences to build the salmon index from and quantify against.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF used for transcript-to-gene summarization.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the quantification results.

outputs:
  results:
    type: directory
    path: "${outdir}/salmon_quant"
    primary: true
