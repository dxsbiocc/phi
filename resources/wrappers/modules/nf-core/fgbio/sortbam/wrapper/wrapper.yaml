# Agent-facing wrapper adapter for the vendored fgbio/sortbam module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/fgbio-sortbam
name: "fgbio SortBam"
summary: "Sort a BAM into a specific order with fgbio SortBam."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/fgbio_sortbam'
    primary: true
