# Agent-facing wrapper adapter for the vendored fgbio/groupreadsbyumi module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/fgbio-groupreadsbyumi
name: "fgbio GroupReadsByUmi"
summary: "Group reads by UMI (and mapping position) with fgbio GroupReadsByUmi."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "UMI-tagged BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/fgbio_groupreadsbyumi'
    primary: true
