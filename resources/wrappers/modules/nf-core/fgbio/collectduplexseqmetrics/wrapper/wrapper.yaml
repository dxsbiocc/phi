# Agent-facing wrapper adapter for the vendored fgbio/collectduplexseqmetrics module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/fgbio-collectduplexseqmetrics
name: "fgbio CollectDuplexSeqMetrics"
summary: "Collect duplex-sequencing QC metrics from UMI-grouped reads with fgbio CollectDuplexSeqMetrics."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Duplex-UMI-grouped BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  duplex_qc:
    type: directory
    path: '${outdir}/fgbio_collectduplexseqmetrics'
    primary: true
