# Agent-facing wrapper adapter for the vendored fgbio/callduplexconsensusreads module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/fgbio-callduplexconsensusreads
name: "fgbio CallDuplexConsensusReads"
summary: "Call duplex consensus reads from UMI-grouped duplex reads with fgbio CallDuplexConsensusReads."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Duplex-UMI-grouped BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/fgbio_callduplexconsensusreads'
    primary: true
