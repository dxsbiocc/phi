# Agent-facing wrapper adapter for the vendored svtk/countsvtypes module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/svtk-countsvtypes
name: "svtk count_svtypes"
summary: "Count SV types in a VCF with svtk count-svtypes."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  counts:
    type: directory
    path: '${outdir}/svtk_countsvtypes'
    primary: true
