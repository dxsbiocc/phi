# Agent-facing wrapper adapter for the vendored starfusion/build module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/starfusion-build
name: "STAR-Fusion build"
summary: "Build a CTAT genome library for STAR-Fusion (uses the minigenome test fixture)."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Minigenome FASTA fixture."
  gtf:
    kind: input
    type: file
    required: true
    description: "Minigenome GTF fixture."
  fusion_lib:
    kind: input
    type: file
    required: true
    description: "CTAT human fusion library (mini, .dat.gz)."
  pfam:
    kind: input
    type: file
    required: true
    description: "Pfam-A HMM database (.hmm.gz)."
  dfam_hmm:
    kind: input
    type: file
    required: true
    description: "Dfam HMM profile."
  dfam_h3f:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3f)."
  dfam_h3i:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3i)."
  dfam_h3m:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3m)."
  dfam_h3p:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3p)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  reference:
    type: directory
    path: '${outdir}/starfusion_build'
    primary: true
