# Agent-facing wrapper adapter for the vendored starfusion/detect module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the STAR-Fusion CTAT genome library (with the minigenome test fixture) using the vendored starfusion build module first.
id: nf-core/modules/starfusion-detect
name: "STAR-Fusion detect"
summary: "Detect gene fusions from RNA-seq reads with STAR-Fusion (builds the CTAT library first)."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Minigenome FASTA fixture."
  gtf:
    kind: input
    type: file
    required: true
    description: "Minigenome GTF fixture."
  fusion_lib:
    kind: input
    type: file
    required: true
    description: "CTAT human fusion library (mini, .dat.gz)."
  pfam:
    kind: input
    type: file
    required: true
    description: "Pfam-A HMM database (.hmm.gz)."
  dfam_hmm:
    kind: input
    type: file
    required: true
    description: "Dfam HMM profile."
  dfam_h3f:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3f)."
  dfam_h3i:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3i)."
  dfam_h3m:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3m)."
  dfam_h3p:
    kind: input
    type: file
    required: true
    description: "Dfam HMM index (.h3p)."
  reads1:
    kind: input
    type: file
    required: true
    description: "Forward RNA-seq reads FASTQ (.fastq.gz)."
  reads2:
    kind: input
    type: file
    required: true
    description: "Reverse RNA-seq reads FASTQ (.fastq.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  fusions:
    type: directory
    path: '${outdir}/starfusion_detect'
    primary: true
