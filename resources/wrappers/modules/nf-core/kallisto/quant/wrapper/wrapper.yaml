# Agent-facing wrapper adapter for the vendored kallisto/quant module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composes kallisto/index + kallisto/quant internally — see
# ../wrapper/main.nf's own comment for why: no pre-built index in
# test-datasets to just point this wrapper's default params.json at.
id: nf-core/modules/kallisto-quant
name: kallisto quant
summary: Quantify transcript abundances from paired-end reads with kallisto.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 2.
  fasta:
    kind: input
    type: fasta
    required: true
    description: Transcript sequences to build the kallisto index from and quantify against.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the quantification results.

outputs:
  results:
    type: directory
    path: "${outdir}/kallisto_quant"
    primary: true
