# Agent-facing wrapper adapter for the vendored kallisto/index module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/kallisto-index
name: kallisto index
summary: Build a kallisto index from a transcriptome FASTA.

params:
  fasta:
    kind: input
    type: fasta
    required: true
    description: Transcript sequences to index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the kallisto index.

outputs:
  index:
    type: directory
    path: "${outdir}/kallisto_index"
    primary: true
