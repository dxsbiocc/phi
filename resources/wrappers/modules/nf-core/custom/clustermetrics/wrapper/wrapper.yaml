# Agent-facing wrapper adapter for the vendored custom/clustermetrics module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/custom-clustermetrics
name: "Custom clustermetrics"
summary: "Compute cluster quality metrics for a feature matrix and cluster assignment."

params:
  features:
    kind: input
    type: file
    required: true
    description: "Feature matrix (TSV)."
  clusters:
    kind: input
    type: file
    required: true
    description: "Cluster assignments (CSV)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  metrics:
    type: directory
    path: '${outdir}/custom_clustermetrics'
    primary: true
