# Agent-facing wrapper adapter for the vendored custom/addmostseverepli module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/custom-addmostseverepli
name: "Custom addmostseverepli"
summary: "Annotate a VCF with the most severe pLI score per variant."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF annotated by VEP/genmod."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/custom_addmostseverepli'
    primary: true
