# Agent-facing wrapper adapter for the vendored custom/geneticmapconvert module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/custom-geneticmapconvert
name: "Custom geneticmapconvert"
summary: "Convert a genetic map to GLIMPSE, PLINK, STITCH and Minimac formats."

params:
  map_file:
    kind: input
    type: file
    required: true
    description: "Genetic map file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  glimpse_map:
    type: directory
    path: '${outdir}/custom_geneticmapconvert'
    primary: true
