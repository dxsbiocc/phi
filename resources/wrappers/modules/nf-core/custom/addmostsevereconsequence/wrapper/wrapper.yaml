# Agent-facing wrapper adapter for the vendored custom/addmostsevereconsequence module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/custom-addmostsevereconsequence
name: "Custom addmostsevereconsequence"
summary: "Annotate a VCF with the most severe VEP consequence per variant."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF annotated by VEP/genmod."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/custom_addmostsevereconsequence'
    primary: true
