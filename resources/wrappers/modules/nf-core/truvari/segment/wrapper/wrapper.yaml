# Agent-facing wrapper adapter for the vendored truvari/segment module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/truvari-segment
name: "Truvari segment"
summary: "Segment overlapping SVs with Truvari segment."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/truvari_segment'
    primary: true
