# Agent-facing wrapper adapter for the vendored seqkit/head module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/seqkit-head
name: "seqkit head"
summary: "Take the first N sequences from FASTQ files with seqkit head."

params:
  reads1:
    kind: input
    type: file
    required: true
    description: "Forward reads FASTQ (.fastq.gz)."
  reads2:
    kind: input
    type: file
    required: true
    description: "Reverse reads FASTQ (.fastq.gz)."
  seq_count:
    kind: option
    type: integer
    required: false
    description: "Number of sequences to keep."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  subset:
    type: directory
    path: '${outdir}/seqkit_head'
    primary: true
