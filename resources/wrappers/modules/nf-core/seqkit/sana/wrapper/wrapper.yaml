# Agent-facing wrapper adapter for the vendored seqkit/sana module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/seqkit-sana
name: "seqkit sana"
summary: "Repair broken FASTQ files with seqkit sana."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Possibly broken FASTQ file (.fastq.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  reads:
    type: directory
    path: '${outdir}/seqkit_sana'
    primary: true
