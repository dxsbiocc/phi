# Agent-facing wrapper adapter for the vendored seqkit/sliding module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/seqkit-sliding
name: "seqkit sliding"
summary: "Extract sliding windows from sequences with seqkit sliding."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  fastx:
    type: directory
    path: '${outdir}/seqkit_sliding'
    primary: true
