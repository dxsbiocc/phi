# Agent-facing wrapper adapter for the vendored samblaster module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samblaster
name: "samblaster"
summary: "Mark duplicates and extract split/discordant reads with samblaster."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/samblaster'
    primary: true
