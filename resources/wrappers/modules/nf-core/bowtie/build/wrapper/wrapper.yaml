# Agent-facing wrapper adapter for the vendored bowtie/build module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bowtie-build
name: "Bowtie build"
summary: "Build a Bowtie index from a reference FASTA."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  index:
    type: directory
    path: '${outdir}/bowtie_build'
    primary: true
