# Agent-facing wrapper adapter for the vendored bowtie/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the index with the vendored bowtie build module first.
id: nf-core/modules/bowtie-align
name: "Bowtie align"
summary: "Align reads to a reference with Bowtie (builds the index first)."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Reads FASTQ (.fastq.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bowtie_align'
    primary: true
