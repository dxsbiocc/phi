# Agent-facing wrapper adapter for the vendored bowtie/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: uses a pre-built `index` as-is, or builds one with the vendored
# bowtie build module first.
id: nf-core/modules/bowtie-align
name: "Bowtie align"
summary: "Align reads with Bowtie, against a pre-built index or one built from a reference FASTA."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Reads FASTQ (.fastq.gz)."
  index:
    kind: input
    type: directory
    required: false
    description: "Pre-built Bowtie index directory (holding one set of *.ebwt files). When set, no index is built."
  fasta:
    kind: input
    type: file
    required: false
    description: "Reference FASTA file. Required only when `index` is not given (the index is then built from it)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bowtie_align'
    primary: true
