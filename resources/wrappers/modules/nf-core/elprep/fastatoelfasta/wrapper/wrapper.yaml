# Agent-facing wrapper adapter for the vendored elprep/fastatoelfasta module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/elprep-fastatoelfasta
name: "elprep fasta-to-elfasta"
summary: "Convert a FASTA to elPrep's elfasta format."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  elfasta:
    type: directory
    path: '${outdir}/elprep_fastatoelfasta'
    primary: true
