# Agent-facing wrapper adapter for the vendored elprep/split module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/elprep-split
name: "elprep split"
summary: "Split a BAM by contig group with elprep split."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/elprep_split'
    primary: true
