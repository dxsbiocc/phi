# Agent-facing wrapper adapter for the vendored elprep/merge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: splits the BAM by contig group with the vendored elprep split module first.
id: nf-core/modules/elprep-merge
name: "elprep merge"
summary: "Merge contig-group BAMs back together (split -> merge)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/elprep_merge'
    primary: true
