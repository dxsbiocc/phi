# Agent-facing wrapper adapter for the vendored sniffles module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/sniffles
name: "Sniffles"
summary: "Call structural variants from long reads with Sniffles."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/sniffles'
    primary: true
