# Agent-facing wrapper adapter for the vendored plink/hwe module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/plink-hwe
name: "PLINK Hardy-Weinberg"
summary: "Test variants for Hardy-Weinberg equilibrium with PLINK hardy."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file (bgzipped)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  hwe:
    type: directory
    path: '${outdir}/plink_hwe'
    primary: true
