# Agent-facing wrapper adapter for the vendored plink/epistasis module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/plink-epistasis
name: "PLINK epistasis"
summary: "Test pairwise SNP-SNP epistasis with PLINK epistasis."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file (bgzipped)."
  phe:
    kind: input
    type: file
    required: true
    description: "Phenotype file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  epi:
    type: directory
    path: '${outdir}/plink_epistasis'
    primary: true
