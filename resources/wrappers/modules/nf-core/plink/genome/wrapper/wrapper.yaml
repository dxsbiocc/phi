# Agent-facing wrapper adapter for the vendored plink/genome module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/plink-genome
name: "PLINK genome (IBD/IBS)"
summary: "Estimate pairwise identity-by-descent with PLINK genome."

params:
  bed:
    kind: input
    type: file
    required: true
    description: "PLINK binary genotype file (.bed)."
  bim:
    kind: input
    type: file
    required: true
    description: "PLINK variant file (.bim)."
  fam:
    kind: input
    type: file
    required: true
    description: "PLINK sample file (.fam)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  genome:
    type: directory
    path: '${outdir}/plink_genome'
    primary: true
