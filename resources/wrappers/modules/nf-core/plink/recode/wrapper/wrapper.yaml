# Agent-facing wrapper adapter for the vendored plink/recode module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: converts the VCF to PLINK binary format with the vendored plink vcf module first.
id: nf-core/modules/plink-recode
name: "PLINK recode"
summary: "Convert PLINK binary genotypes to other formats (e.g. PED/MAP) with PLINK recode (converts the VCF first)."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file (bgzipped)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  ped:
    type: directory
    path: '${outdir}/plink_recode'
    primary: true
