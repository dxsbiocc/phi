# Agent-facing wrapper adapter for the vendored trimgalore module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/trimgalore
name: Trim Galore!
summary: Trim adapters and low-quality bases from FASTQ reads with Trim Galore!.

params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: FASTQ files to trim (glob matching paired- or single-end reads).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for trimmed reads and Trim Galore!'s FastQC/report output.

outputs:
  reads:
    type: directory
    path: '${outdir}/trimgalore'
    primary: true
