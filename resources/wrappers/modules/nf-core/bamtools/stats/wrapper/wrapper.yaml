# Agent-facing wrapper adapter for the vendored bamtools/stats module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bamtools-stats
name: "bamtools stats"
summary: "Summarise a BAM with bamtools stats."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  stats:
    type: directory
    path: '${outdir}/bamtools_stats'
    primary: true
