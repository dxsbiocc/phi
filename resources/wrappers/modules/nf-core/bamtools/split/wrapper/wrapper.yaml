# Agent-facing wrapper adapter for the vendored bamtools/split module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bamtools-split
name: "bamtools split"
summary: "Split a BAM by reference with bamtools split."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bamtools_split'
    primary: true
