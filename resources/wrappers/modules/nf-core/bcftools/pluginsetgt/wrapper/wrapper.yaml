# Agent-facing wrapper adapter for the vendored bcftools/pluginsetgt module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-pluginsetgt
name: "bcftools pluginsetgt"
summary: "Set genotypes with the bcftools +setGT plugin."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  target_gt:
    kind: option
    type: string
    required: false
    description: "Genotypes to replace (e.g. a = all)."
  new_gt:
    kind: option
    type: string
    required: false
    description: "Replacement genotype (e.g. p = phased)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_pluginsetgt'
    primary: true
