# Agent-facing wrapper adapter for the vendored bcftools/query module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-query
name: "bcftools query"
summary: "Extract fields from a VCF with bcftools query."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  output:
    type: directory
    path: '${outdir}/bcftools_query'
    primary: true
