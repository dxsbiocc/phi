# Agent-facing wrapper adapter for the vendored bcftools/merge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-merge
name: bcftools merge
summary: Merge two VCF files (different samples, same region) into a multi-sample VCF with bcftools merge.

params:
  vcf1:
    kind: input
    type: file
    required: true
    description: First bgzipped VCF file.
  vcf2:
    kind: input
    type: file
    required: true
    description: Second bgzipped VCF file.
  vcf1_tbi:
    kind: input
    type: file
    required: true
    description: Index (.tbi) for the first VCF.
  vcf2_tbi:
    kind: input
    type: file
    required: true
    description: Index (.tbi) for the second VCF.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the merged VCF.

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_merge'
    primary: true
