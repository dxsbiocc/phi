# Agent-facing wrapper adapter for the vendored bcftools/filter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-filter
name: "bcftools filter"
summary: "Filter VCF records with bcftools filter."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file (plain or bgzipped)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_filter'
    primary: true
