# Agent-facing wrapper adapter for the vendored bcftools/csq module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-csq
name: "bcftools csq"
summary: "Predict haplotype-aware variant consequences with bcftools csq."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  gff3:
    kind: input
    type: file
    required: true
    description: "Gene annotation in GFF3 format."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_csq'
    primary: true
