# Agent-facing wrapper adapter for the vendored bcftools/plugintag2tag module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-plugintag2tag
name: "bcftools plugintag2tag"
summary: "Convert between FORMAT tags (e.g. PL to GP) with the bcftools +tag2tag plugin."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_plugintag2tag'
    primary: true
