# Agent-facing wrapper adapter for the vendored bcftools/pluginscatter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-pluginscatter
name: "bcftools pluginscatter"
summary: "Scatter a VCF into chunks with the bcftools +scatter plugin."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the VCF."
  sites_per_chunk:
    kind: option
    type: integer
    required: false
    default: 100
    description: "Number of sites per output chunk."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  scatter:
    type: directory
    path: '${outdir}/bcftools_pluginscatter'
    primary: true
