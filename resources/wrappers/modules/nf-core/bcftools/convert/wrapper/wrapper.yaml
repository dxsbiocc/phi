# Agent-facing wrapper adapter for the vendored bcftools/convert module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bcftools-convert
name: "bcftools convert"
summary: "Convert between VCF/BCF and gVCF or genotype formats with bcftools convert."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped gVCF file."
  tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the gVCF."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/bcftools_convert'
    primary: true
