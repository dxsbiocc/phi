# Agent-facing wrapper adapter for the vendored picard/renamesampleinvcf module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/picard-renamesampleinvcf
name: "picard RenameSampleInVcf"
summary: "Rename the sample in a VCF with Picard RenameSampleInVcf."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file whose sample should be renamed."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/picard_renamesampleinvcf'
    primary: true
