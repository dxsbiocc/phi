# Agent-facing wrapper adapter for the vendored picard/meanqualitybycycle module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/picard-meanqualitybycycle
name: "picard MeanQualityByCycle"
summary: "Chart mean base quality by read cycle for a BAM with Picard MeanQualityByCycle."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file to analyze."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  metrics:
    type: directory
    path: '${outdir}/picard_meanqualitybycycle'
    primary: true
