# Agent-facing wrapper adapter for the vendored picard/cleansam module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/picard-cleansam
name: picard CleanSam
summary: Soft-clip reads beyond the end of a reference and set MAPQ 0 for unmapped reads with Picard CleanSam.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM file to clean.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the cleaned BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/picard_cleansam'
    primary: true
