# Agent-facing wrapper adapter for the vendored picard/mergesamfiles
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Only two input BAM files are exposed — the vendored module accepts any
# number, but this thin adapter doesn't surface a variable-length list.
id: nf-core/modules/picard-mergesamfiles
name: picard MergeSamFiles
summary: Merge two BAM/SAM files into one with Picard.

params:
  bam1:
    kind: input
    type: file
    required: true
    description: First BAM/SAM file to merge.
  bam2:
    kind: input
    type: file
    required: true
    description: Second BAM/SAM file to merge.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the merged BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/picard_mergesamfiles'
    primary: true
