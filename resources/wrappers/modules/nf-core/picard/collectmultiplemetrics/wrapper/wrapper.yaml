# Agent-facing wrapper adapter for the vendored picard/collectmultiplemetrics module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/picard-collectmultiplemetrics
name: "picard CollectMultipleMetrics"
summary: "Collect a suite of alignment QC metrics for a BAM with Picard CollectMultipleMetrics."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  metrics:
    type: directory
    path: '${outdir}/picard_collectmultiplemetrics'
    primary: true
