# Agent-facing wrapper adapter for the vendored diamond/makedb module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/diamond-makedb
name: diamond makedb
summary: Build a DIAMOND protein database from a FASTA file.

params:
  fasta:
    kind: input
    type: file
    required: true
    description: Protein FASTA file (plain or gzipped) to build the DIAMOND database from.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the DIAMOND database.

outputs:
  db:
    type: directory
    path: '${outdir}/diamond_makedb'
    primary: true
