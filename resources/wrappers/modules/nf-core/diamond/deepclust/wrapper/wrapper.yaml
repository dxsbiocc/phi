# Agent-facing wrapper adapter for the vendored diamond/deepclust module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/diamond-deepclust
name: "DIAMOND deepclust"
summary: "Cluster protein sequences with DIAMOND deepclust."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Protein FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  clusters:
    type: directory
    path: '${outdir}/diamond_deepclust'
    primary: true
