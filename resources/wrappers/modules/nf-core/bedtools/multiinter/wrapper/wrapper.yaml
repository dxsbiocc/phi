# Agent-facing wrapper adapter for the vendored bedtools/multiinter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-multiinter
name: "bedtools multiinter"
summary: "Identify common intervals across multiple interval files with bedtools multiinter."

params:
  bed:
    kind: input
    type: file
    required: true
    description: "BED file of intervals."
  bed2:
    kind: input
    type: file
    required: true
    description: "Second BED file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/bedtools_multiinter'
    primary: true
