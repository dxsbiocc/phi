# Agent-facing wrapper adapter for the vendored bedtools/bamtobed module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-bamtobed
name: "bedtools bamtobed"
summary: "Convert BAM alignments to BED with bedtools bamtobed."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Input BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/bedtools_bamtobed'
    primary: true
