# Agent-facing wrapper adapter for the vendored bedtools/flank module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-flank
name: "bedtools flank"
summary: "Create flanking intervals around BED features with bedtools flank."

params:
  bed:
    kind: input
    type: file
    required: true
    description: "BED file of intervals."
  sizes:
    kind: input
    type: file
    required: true
    description: "Chromosome sizes file (2-column: name, length)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/bedtools_flank'
    primary: true
