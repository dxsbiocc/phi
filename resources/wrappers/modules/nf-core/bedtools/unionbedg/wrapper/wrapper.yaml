# Agent-facing wrapper adapter for the vendored bedtools/unionbedg module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-unionbedg
name: "bedtools unionbedg"
summary: "Combine bedGraph/BED files into a single union coverage table with bedtools unionbedg."

params:
  bedgraph:
    kind: input
    type: file
    required: true
    description: "bedGraph file."
  bed:
    kind: input
    type: file
    required: true
    description: "BED file of intervals."
  sizes:
    kind: input
    type: file
    required: true
    description: "Chromosome sizes file (2-column: name, length)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bedgraph:
    type: directory
    path: '${outdir}/bedtools_unionbedg'
    primary: true
