# Agent-facing wrapper adapter for the vendored bedtools/nuc module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-nuc
name: "bedtools nuc"
summary: "Profile nucleotide content of intervals with bedtools nuc."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  bed:
    kind: input
    type: file
    required: true
    description: "BED file of intervals."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/bedtools_nuc'
    primary: true
