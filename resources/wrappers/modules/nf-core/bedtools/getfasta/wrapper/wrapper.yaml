# Agent-facing wrapper adapter for the vendored bedtools/getfasta module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-getfasta
name: "bedtools getfasta"
summary: "Extract FASTA sequences for BED intervals with bedtools getfasta."

params:
  bed:
    kind: input
    type: file
    required: true
    description: "BED file of intervals."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  fasta:
    type: directory
    path: '${outdir}/bedtools_getfasta'
    primary: true
