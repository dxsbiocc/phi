# Agent-facing wrapper adapter for the vendored bedtools/merge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bedtools-merge
name: bedtools merge
summary: Merge overlapping/adjacent intervals in a sorted BED file with bedtools merge.

params:
  bed:
    kind: input
    type: file
    required: true
    description: Sorted BED file whose intervals should be merged.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the merged intervals.

outputs:
  bed:
    type: directory
    path: '${outdir}/bedtools_merge'
    primary: true
