# Agent-facing wrapper adapter for the vendored ucsc/gtftogenepred
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/ucsc-gtftogenepred
name: UCSC gtfToGenePred
summary: Convert a GTF annotation to UCSC genePred format with UCSC gtfToGenePred.

params:
  gtf:
    kind: input
    type: file
    required: true
    description: GTF annotation file to convert.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the genePred file.

outputs:
  genepred:
    type: directory
    path: '${outdir}/ucsc_gtftogenepred'
    primary: true
