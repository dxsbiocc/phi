# Agent-facing wrapper adapter for the vendored rtgtools/format module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/rtgtools-format
name: "RTG Tools format"
summary: "Convert a FASTA to an RTG SDF with rtg format."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  sdf:
    type: directory
    path: '${outdir}/rtgtools_format'
    primary: true
