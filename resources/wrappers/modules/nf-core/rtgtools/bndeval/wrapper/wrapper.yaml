# Agent-facing wrapper adapter for the vendored rtgtools/bndeval module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: decomposes the truth SVs with the vendored rtgtools svdecompose module first.
id: nf-core/modules/rtgtools-bndeval
name: "RTG Tools bndeval"
summary: "Evaluate SV breakend calls against a decomposed truth set (svdecompose → bndeval)."

params:
  sv:
    kind: input
    type: file
    required: true
    description: "Query SV VCF (bgzipped)."
  sv_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the query SV VCF."
  regions_bed:
    kind: input
    type: file
    required: true
    description: "Evaluation regions BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  summary:
    type: directory
    path: '${outdir}/rtgtools_bndeval'
    primary: true
