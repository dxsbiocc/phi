# Agent-facing wrapper adapter for the vendored rtgtools/cnveval module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/rtgtools-cnveval
name: "RTG Tools cnveval"
summary: "Evaluate CNV calls against a truth set with rtg cnveval."

params:
  sv:
    kind: input
    type: file
    required: true
    description: "Query SV VCF (bgzipped)."
  sv_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the query SV VCF."
  sv2:
    kind: input
    type: file
    required: true
    description: "Truth SV VCF (bgzipped)."
  sv2_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the truth SV VCF."
  regions_bed:
    kind: input
    type: file
    required: true
    description: "Evaluation regions BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  summary:
    type: directory
    path: '${outdir}/rtgtools_cnveval'
    primary: true
