# Agent-facing wrapper adapter for the vendored survivor/bedpetovcf module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/survivor-bedpetovcf
name: "SURVIVOR bedpetovcf"
summary: "Convert BEDPE to VCF with SURVIVOR bedpetovcf."

params:
  bedpe:
    kind: input
    type: file
    required: true
    description: "BEDPE file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/survivor_bedpetovcf'
    primary: true
