# Agent-facing wrapper adapter for the vendored survivor/filter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/survivor-filter
name: "SURVIVOR filter"
summary: "Filter SV VCF records by size, allele frequency and read support with SURVIVOR filter."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/survivor_filter'
    primary: true
