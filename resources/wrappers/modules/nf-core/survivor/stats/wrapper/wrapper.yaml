# Agent-facing wrapper adapter for the vendored survivor/stats module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/survivor-stats
name: "SURVIVOR stats"
summary: "Summarise an SV VCF with SURVIVOR stats."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  stats:
    type: directory
    path: '${outdir}/survivor_stats'
    primary: true
