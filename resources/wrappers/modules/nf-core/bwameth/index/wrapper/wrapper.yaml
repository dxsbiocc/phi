# Agent-facing wrapper adapter for the vendored bwameth/index module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bwameth-index
name: "bwa-meth index"
summary: "Build a bwa-meth (bisulfite) index from a reference FASTA."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  index:
    type: directory
    path: '${outdir}/bwameth_index'
    primary: true
