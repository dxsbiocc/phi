# Agent-facing wrapper adapter for the vendored bwameth/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the index with the vendored bwameth index module first.
id: nf-core/modules/bwameth-align
name: "bwa-meth align"
summary: "Align bisulfite reads with bwa-meth (builds the index first)."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Bisulfite reads FASTQ (.fastq.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bwameth_align'
    primary: true
