# Agent-facing wrapper adapter for the vendored gridss/gridss module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the BWA index with the vendored bwa index module first.
id: nf-core/modules/gridss-gridss
name: "GRIDSS"
summary: "Call structural variants end to end with GRIDSS (builds the BWA index first)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gridss_gridss'
    primary: true
