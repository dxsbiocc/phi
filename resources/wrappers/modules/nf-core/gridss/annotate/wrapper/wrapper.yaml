# Agent-facing wrapper adapter for the vendored gridss/annotate module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gridss-annotate
name: "GRIDSS annotate"
summary: "Annotate a VCF of SVs with GRIDSS annotateInsertedSequence."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/gridss_annotate'
    primary: true
