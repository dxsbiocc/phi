# Agent-facing wrapper adapter for the vendored gridss/extractoverlappingfragments module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gridss-extractoverlappingfragments
name: "GRIDSS extractOverlappingFragments"
summary: "Extract reads overlapping target regions with GRIDSS extractOverlappingFragments."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  bed:
    kind: input
    type: file
    required: true
    description: "Target regions BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gridss_extractoverlappingfragments'
    primary: true
