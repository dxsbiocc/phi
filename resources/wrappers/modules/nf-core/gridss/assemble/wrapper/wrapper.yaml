# Agent-facing wrapper adapter for the vendored gridss/assemble module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the BWA index and preprocesses the BAM with the vendored bwa index and gridss preprocess modules first.
id: nf-core/modules/gridss-assemble
name: "GRIDSS assemble"
summary: "Assemble reads for GRIDSS calling (index → preprocess → assemble)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  config:
    kind: input
    type: file
    required: true
    description: "GRIDSS properties file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  assemble_dir:
    type: directory
    path: '${outdir}/gridss_assemble'
    primary: true
