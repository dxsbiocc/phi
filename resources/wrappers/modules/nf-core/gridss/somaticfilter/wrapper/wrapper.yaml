# Agent-facing wrapper adapter for the vendored gridss/somaticfilter module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gridss-somaticfilter
name: "GRIDSS somatic filter"
summary: "Filter somatic GRIDSS calls with the somatic filter."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "GRIDSS somatic VCF."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  high_conf_sv:
    type: directory
    path: '${outdir}/gridss_somaticfilter'
    primary: true
