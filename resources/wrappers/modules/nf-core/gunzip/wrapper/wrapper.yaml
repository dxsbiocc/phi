# Agent-facing wrapper adapter for the vendored gunzip module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gunzip
name: gunzip
summary: Decompress a single gzip-compressed file.

params:
  archive:
    kind: input
    type: file
    required: true
    description: Gzip-compressed file to decompress.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the decompressed file.

outputs:
  decompressed:
    type: directory
    path: "${outdir}/gunzip"
    primary: true
