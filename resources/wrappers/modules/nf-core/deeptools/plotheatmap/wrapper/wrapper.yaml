# Agent-facing wrapper adapter for the vendored deeptools/plotheatmap
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/deeptools-plotheatmap
name: deeptools plotHeatmap
summary: Plot a heatmap from a deepTools computeMatrix output.

params:
  matrix:
    kind: input
    type: file
    required: true
    description: Matrix file (.mat.gz) produced by deeptools computeMatrix.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the heatmap.

outputs:
  pdf:
    type: directory
    path: '${outdir}/deeptools_plotheatmap'
    primary: true
