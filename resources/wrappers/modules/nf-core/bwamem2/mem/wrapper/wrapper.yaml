# Agent-facing wrapper adapter for the vendored bwamem2/mem module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: uses a pre-built `index` as-is, or builds one with the vendored
# bwamem2 index module first.
id: nf-core/modules/bwamem2-mem
name: "BWA-MEM2 align"
summary: "Align reads with BWA-MEM2, against a pre-built index or one built from a reference FASTA."

params:
  reads1:
    kind: input
    type: file
    required: true
    description: "Forward reads FASTQ (.fastq.gz)."
  reads2:
    kind: input
    type: file
    required: true
    description: "Reverse reads FASTQ (.fastq.gz)."
  index:
    kind: input
    type: directory
    required: false
    description: "Pre-built BWA-MEM2 index directory (holding one set of *.0123/*.amb/*.ann/*.bwt.2bit.64/*.pac files). Preferred for large genomes; when set, no index is built."
  fasta:
    kind: input
    type: file
    required: false
    description: "Reference FASTA file. Required only when `index` is not given (the index is then built from it)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bwamem2_mem'
    primary: true
