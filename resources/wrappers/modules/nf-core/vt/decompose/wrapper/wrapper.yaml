# Agent-facing wrapper adapter for the vendored vt/decompose module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/vt-decompose
name: "vt decompose"
summary: "Decompose multiallelic variants with vt decompose."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/vt_decompose'
    primary: true
