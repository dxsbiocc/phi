# Agent-facing wrapper adapter for the vendored bamclipper module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bamclipper
name: "bamclipper"
summary: "Soft-clip primer sequences from reads using amplicon coordinates with bamclipper."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  bedpe:
    kind: input
    type: file
    required: true
    description: "Primer pairs BEDPE."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bamclipper'
    primary: true
