# Agent-facing wrapper adapter for the vendored sylph/sketchsamples module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/sylph-sketchsamples
name: "Sylph sketch (reads)"
summary: "Sketch sequencing reads into a Sylph sample sketch (.sylsp) with sylph sketch."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Reads FASTQ (.fastq.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  sylsp:
    type: directory
    path: '${outdir}/sylph_sketchsamples'
    primary: true
