# Agent-facing wrapper adapter for the vendored preseq/ccurve module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/preseq-ccurve
name: preseq c_curve
summary: Estimate the complexity curve (unique molecules vs. reads sequenced) for a BAM with preseq c_curve.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM file of aligned reads.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the complexity curve.

outputs:
  c_curve:
    type: directory
    path: '${outdir}/preseq_ccurve'
    primary: true
