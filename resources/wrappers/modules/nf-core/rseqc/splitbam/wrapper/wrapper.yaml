# Agent-facing wrapper adapter for the vendored rseqc/splitbam module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/rseqc-splitbam
name: RSeQC split_bam.py
summary: Split a BAM file into reads in/outside a BED region set (plus junk reads) with RSeQC split_bam.py.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Coordinate-sorted BAM file.
  bai:
    kind: input
    type: file
    required: true
    description: BAM index (.bai) for the input BAM.
  bed:
    kind: input
    type: file
    required: true
    description: BED12 file defining the target regions.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the split BAM files.

outputs:
  in_bam:
    type: directory
    path: '${outdir}/rseqc_splitbam'
    primary: true
