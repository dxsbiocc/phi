# Agent-facing wrapper adapter for the vendored anndata/getsize module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/anndata-getsize
name: AnnData get size
summary: Report the number of cells or genes in an AnnData object.

params:
  anndata:
    kind: input
    type: file
    required: true
    description: AnnData object (.h5ad).
  size_type:
    kind: option
    type: string
    required: false
    enum: [cells, genes]
    description: Whether to count cells (obs) or genes (var).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the size count text file.

outputs:
  size:
    type: directory
    path: '${outdir}/anndata_getsize'
    primary: true
