# Agent-facing wrapper adapter for the vendored gatk/realignertargetcreator module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/gatk-realignertargetcreator
name: "GATK3 RealignerTargetCreator"
summary: "Identify regions needing indel realignment with GATK3 RealignerTargetCreator."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  intervals:
    type: directory
    path: '${outdir}/gatk_realignertargetcreator'
    primary: true
