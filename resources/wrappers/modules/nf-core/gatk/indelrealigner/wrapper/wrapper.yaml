# Agent-facing wrapper adapter for the vendored gatk/indelrealigner module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: computes realignment targets with the vendored gatk realignertargetcreator module first.
id: nf-core/modules/gatk-indelrealigner
name: "GATK3 IndelRealigner"
summary: "Realign reads around indels with GATK3 IndelRealigner (RealignerTargetCreator -> IndelRealigner)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  dict:
    kind: input
    type: file
    required: true
    description: "Sequence dictionary (.dict)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/gatk_indelrealigner'
    primary: true
