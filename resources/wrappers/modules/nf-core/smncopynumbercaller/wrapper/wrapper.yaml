# Agent-facing wrapper adapter for the vendored smncopynumbercaller module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/smncopynumbercaller
name: "SMNCopyNumberCaller"
summary: "Estimate SMN1/SMN2 copy number from a BAM with SMNCopyNumberCaller."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  smncopynumber:
    type: directory
    path: '${outdir}/smncopynumbercaller'
    primary: true
