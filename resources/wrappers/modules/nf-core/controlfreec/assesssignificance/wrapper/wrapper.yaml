# Agent-facing wrapper adapter for the vendored controlfreec/assesssignificance module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: unpacks the chromosomes archive with the vendored untar module and runs the vendored controlfreec freec module first.
id: nf-core/modules/controlfreec-assesssignificance
name: "Control-FREEC assess significance"
summary: "Assess CNV significance with Control-FREEC (untar → freec → assess_significance)."

params:
  normal:
    kind: input
    type: file
    required: true
    description: "Normal mpileup (.gz)."
  tumor:
    kind: input
    type: file
    required: true
    description: "Tumour mpileup (.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  known_snps:
    kind: input
    type: file
    required: true
    description: "Known SNPs VCF (bgzipped)."
  known_snps_tbi:
    kind: input
    type: file
    required: true
    description: "Index (.tbi) for the known SNPs."
  chromosomes:
    kind: input
    type: file
    required: true
    description: "Per-chromosome FASTA directory archive (.tar.gz)."
  target_bed:
    kind: input
    type: file
    required: true
    description: "Target regions BED."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  p_value_txt:
    type: directory
    path: '${outdir}/controlfreec_assesssignificance'
    primary: true
