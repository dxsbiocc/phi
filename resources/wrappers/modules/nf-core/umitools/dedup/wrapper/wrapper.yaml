# Agent-facing wrapper adapter for the vendored umitools/dedup module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/umitools-dedup
name: UMI-tools dedup
summary: Deduplicate a UMI-tagged, coordinate-sorted BAM by UMI with umi_tools dedup.

params:
  bam:
    kind: input
    type: bam
    required: true
    description: Coordinate-sorted BAM with UMIs in the read name (e.g. from umitools/extract then alignment).
  bai:
    kind: input
    type: bai
    required: true
    description: Index for the input BAM.
  single_end:
    kind: option
    type: boolean
    required: false
    description: Whether the reads are single-end (affects --paired).
  get_output_stats:
    kind: option
    type: boolean
    required: false
    description: Also write per-UMI/per-position/edit-distance deduplication stats TSVs.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the deduplicated BAM and log.

outputs:
  bam:
    type: directory
    path: '${outdir}/umitools_dedup'
    primary: true
