# Agent-facing wrapper adapter for the vendored bbmap/pileup module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bbmap-pileup
name: "BBMap pileup"
summary: "Compute per-contig coverage statistics from a BAM with BBMap pileup."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Input BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  covstats:
    type: directory
    path: '${outdir}/bbmap_pileup'
    primary: true
