# Agent-facing wrapper adapter for the vendored nanomonsv/parse module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/nanomonsv-parse
name: "nanomonsv parse"
summary: "Extract candidate SV-supporting reads from a long-read BAM with nanomonsv parse."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  insertions:
    type: directory
    path: '${outdir}/nanomonsv_parse'
    primary: true
