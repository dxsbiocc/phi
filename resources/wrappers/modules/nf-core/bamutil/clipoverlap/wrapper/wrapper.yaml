# Agent-facing wrapper adapter for the vendored bamutil/clipoverlap module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bamutil-clipoverlap
name: "bamUtil clipOverlap"
summary: "Clip overlapping mate pairs in a BAM with bamUtil clipOverlap."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bamutil_clipoverlap'
    primary: true
