# Agent-facing wrapper adapter for the vendored bamutil/trimbam module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/bamutil-trimbam
name: "bamUtil trimBam"
summary: "Trim bases from the ends of reads in a BAM with bamUtil trimBam."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "BAM file."
  trim_left:
    kind: option
    type: integer
    required: false
    description: "Bases to trim from the left."
  trim_right:
    kind: option
    type: integer
    required: false
    description: "Bases to trim from the right."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/bamutil_trimbam'
    primary: true
