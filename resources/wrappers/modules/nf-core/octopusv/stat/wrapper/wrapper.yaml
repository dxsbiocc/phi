# Agent-facing wrapper adapter for the vendored octopusv/stat module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/octopusv-stat
name: "OctopusV stat"
summary: "Summarise SV counts and sizes from an SVCF with OctopusV stat."

params:
  svcf:
    kind: input
    type: file
    required: true
    description: "SVCF file (OctopusV's SV call format)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  txt:
    type: directory
    path: '${outdir}/octopusv_stat'
    primary: true
