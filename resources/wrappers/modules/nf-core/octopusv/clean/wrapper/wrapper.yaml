# Agent-facing wrapper adapter for the vendored octopusv/clean module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/octopusv-clean
name: "OctopusV clean"
summary: "Clean and standardise SV calls in a VCF with OctopusV clean."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "SV VCF (bgzipped)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf:
    type: directory
    path: '${outdir}/octopusv_clean'
    primary: true
