# Agent-facing wrapper adapter for the vendored octopusv/merge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/octopusv-merge
name: "OctopusV merge"
summary: "Merge SVCF files from multiple callers with OctopusV merge."

params:
  svcf1:
    kind: input
    type: file
    required: true
    description: "First SVCF file."
  svcf2:
    kind: input
    type: file
    required: true
    description: "Second SVCF file."
  strategy:
    kind: option
    type: string
    required: false
    default: "intersect"
    description: "Merge strategy (e.g. intersect, union)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  svcf:
    type: directory
    path: '${outdir}/octopusv_merge'
    primary: true
