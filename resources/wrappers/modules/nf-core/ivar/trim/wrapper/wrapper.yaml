# Agent-facing wrapper adapter for the vendored ivar/trim module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/ivar-trim
name: "iVar trim"
summary: "Trim primer sequences from aligned reads with iVar."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  bed:
    kind: input
    type: file
    required: true
    description: "Primer BED file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/ivar_trim'
    primary: true
