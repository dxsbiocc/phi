# Agent-facing wrapper adapter for the vendored varlociraptor/filterfdr module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: runs the vendored varlociraptor modules for the earlier steps first.
id: nf-core/modules/varlociraptor-filterfdr
name: "Varlociraptor filter-calls fdr"
summary: "Control the FDR of Varlociraptor calls (estimate → preprocess → call → filter-calls)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  candidates:
    kind: input
    type: file
    required: true
    description: "Candidate variants VCF."
  scenario:
    kind: input
    type: file
    required: true
    description: "Varlociraptor scenario (YAML)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bcf:
    type: directory
    path: '${outdir}/varlociraptor_filterfdr'
    primary: true
