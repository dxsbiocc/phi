# Agent-facing wrapper adapter for the vendored varlociraptor/estimatealignmentproperties module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/varlociraptor-estimatealignmentproperties
name: "Varlociraptor estimate-alignment-properties"
summary: "Estimate alignment properties of a BAM with Varlociraptor."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  fai:
    kind: input
    type: file
    required: true
    description: "FASTA index (.fai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  alignment_properties_json:
    type: directory
    path: '${outdir}/varlociraptor_estimatealignmentproperties'
    primary: true
