# Agent-facing wrapper adapter for the vendored cnvnator/cnvnator module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: runs the vendored cnvnator module for the rd, his, stat and partition steps first.
id: nf-core/modules/cnvnator-cnvnator
name: "CNVnator"
summary: "Call CNVs from read depth with CNVnator (rd → his → stat → partition → call)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  tab:
    type: directory
    path: '${outdir}/cnvnator_cnvnator'
    primary: true
