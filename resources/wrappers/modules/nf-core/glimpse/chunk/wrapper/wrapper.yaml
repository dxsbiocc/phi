# Agent-facing wrapper adapter for the vendored glimpse/chunk module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/glimpse-chunk
name: "GLIMPSE chunk"
summary: "Define imputation chunks for a chromosome with GLIMPSE chunk."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Bgzipped VCF (phased reference panel)."
  csi:
    kind: input
    type: file
    required: true
    description: "Index (.csi) for the VCF."
  region:
    kind: option
    type: string
    required: false
    default: "chr22"
    description: "Region to chunk (e.g. chr22)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  chunk_chr:
    type: directory
    path: '${outdir}/glimpse_chunk'
    primary: true
