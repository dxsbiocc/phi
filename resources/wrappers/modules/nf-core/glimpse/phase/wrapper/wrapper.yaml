# Agent-facing wrapper adapter for the vendored glimpse/phase module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/glimpse-phase
name: "GLIMPSE phase"
summary: "Phase and impute genotype likelihoods against a reference panel with GLIMPSE phase."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Genotype-likelihood VCF (bgzipped)."
  csi:
    kind: input
    type: file
    required: true
    description: "Index (.csi) for the VCF."
  ref:
    kind: input
    type: file
    required: true
    description: "Reference panel VCF (bgzipped)."
  ref_csi:
    kind: input
    type: file
    required: true
    description: "Index (.csi) for the reference panel."
  map:
    kind: input
    type: file
    required: true
    description: "Genetic map."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  phased_variants:
    type: directory
    path: '${outdir}/glimpse_phase'
    primary: true
