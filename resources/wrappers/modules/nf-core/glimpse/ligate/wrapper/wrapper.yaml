# Agent-facing wrapper adapter for the vendored glimpse/ligate module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: phases the input with the vendored glimpse phase module and indexes the result with bcftools index first.
id: nf-core/modules/glimpse-ligate
name: "GLIMPSE ligate"
summary: "Ligate phased chunks into one file (phase → bcftools index → GLIMPSE ligate)."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "Genotype-likelihood VCF (bgzipped)."
  csi:
    kind: input
    type: file
    required: true
    description: "Index (.csi) for the VCF."
  ref:
    kind: input
    type: file
    required: true
    description: "Reference panel VCF (bgzipped)."
  ref_csi:
    kind: input
    type: file
    required: true
    description: "Index (.csi) for the reference panel."
  map:
    kind: input
    type: file
    required: true
    description: "Genetic map."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  merged_variants:
    type: directory
    path: '${outdir}/glimpse_ligate'
    primary: true
