# Agent-facing wrapper adapter for the vendored mmseqs/tsv2exprofiledb module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: unpacks the MMseqs2 database archive with the vendored untar module first.
id: nf-core/modules/mmseqs-tsv2exprofiledb
name: "MMseqs2 tsv2exprofiledb"
summary: "Convert an MMseqs2 database into an expandable profile database with MMseqs2 tsv2exprofiledb."

params:
  db_archive:
    kind: input
    type: file
    required: true
    description: "MMseqs2 database archive (.tar.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  db_exprofile:
    type: directory
    path: '${outdir}/mmseqs_tsv2exprofiledb'
    primary: true
