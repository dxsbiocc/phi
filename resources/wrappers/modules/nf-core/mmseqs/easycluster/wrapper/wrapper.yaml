# Agent-facing wrapper adapter for the vendored mmseqs/easycluster module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/mmseqs-easycluster
name: "MMseqs2 easycluster"
summary: "Cluster protein sequences end-to-end with MMseqs2 easy-cluster."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Protein FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  cluster:
    type: directory
    path: '${outdir}/mmseqs_easycluster'
    primary: true
