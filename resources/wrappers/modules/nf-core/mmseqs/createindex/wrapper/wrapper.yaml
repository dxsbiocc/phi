# Agent-facing wrapper adapter for the vendored mmseqs/createindex module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: unpacks the MMseqs2 database archive with the vendored untar module first.
id: nf-core/modules/mmseqs-createindex
name: "MMseqs2 createindex"
summary: "Build a search index for an MMseqs2 database with MMseqs2 createindex."

params:
  db_archive:
    kind: input
    type: file
    required: true
    description: "MMseqs2 database archive (.tar.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  db_indexed:
    type: directory
    path: '${outdir}/mmseqs_createindex'
    primary: true
