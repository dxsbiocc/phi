# Agent-facing wrapper adapter for the vendored mmseqs/makepaddedseqdb module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds an MMseqs2 database with the vendored createdb module first.
id: nf-core/modules/mmseqs-makepaddedseqdb
name: "MMseqs2 makepaddedseqdb"
summary: "Create a padded sequence database (for GPU search) with MMseqs2 makepaddedseqdb."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  db_padded:
    type: directory
    path: '${outdir}/mmseqs_makepaddedseqdb'
    primary: true
