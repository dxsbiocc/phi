# Agent-facing wrapper adapter for the vendored varscan/somatic module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/varscan-somatic
name: "VarScan somatic"
summary: "Call somatic variants from tumour/normal mpileups with VarScan."

params:
  normal:
    kind: input
    type: file
    required: true
    description: "Normal mpileup (.gz)."
  tumour:
    kind: input
    type: file
    required: true
    description: "Tumour mpileup (.gz)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  vcf_snvs:
    type: directory
    path: '${outdir}/varscan_somatic'
    primary: true
