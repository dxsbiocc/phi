# Agent-facing wrapper adapter for the vendored biscuit/epiread module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the BISCUIT bisulfite index with the vendored biscuit index module first.
id: nf-core/modules/biscuit-epiread
name: "BISCUIT epiread"
summary: "Convert a methylation BAM to the epiread format with BISCUIT epiread (builds the index first)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Bisulfite-aligned BAM."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bed:
    type: directory
    path: '${outdir}/biscuit_epiread'
    primary: true
