# Agent-facing wrapper adapter for the vendored biscuit/align module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the BISCUIT bisulfite index with the vendored biscuit index module first.
id: nf-core/modules/biscuit-align
name: "BISCUIT align"
summary: "Align bisulfite reads with BISCUIT (builds the index first)."

params:
  reads:
    kind: input
    type: file
    required: true
    description: "Bisulfite reads FASTQ (.fastq.gz)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/biscuit_align'
    primary: true
