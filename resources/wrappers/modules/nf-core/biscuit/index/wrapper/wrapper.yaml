# Agent-facing wrapper adapter for the vendored biscuit/index module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/biscuit-index
name: "BISCUIT index"
summary: "Build a BISCUIT bisulfite alignment index from a reference FASTA."

params:
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  index:
    type: directory
    path: '${outdir}/biscuit_index'
    primary: true
