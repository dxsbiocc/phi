# Agent-facing wrapper adapter for the vendored biscuit/bsconv module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Composition: builds the BISCUIT bisulfite index with the vendored biscuit index module first.
id: nf-core/modules/biscuit-bsconv
name: "BISCUIT bsconv"
summary: "Compute bisulfite-conversion rates from a methylated BAM with BISCUIT bsconv (builds the index first)."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Bisulfite-aligned BAM."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  fasta:
    kind: input
    type: file
    required: true
    description: "Reference FASTA file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/biscuit_bsconv'
    primary: true
