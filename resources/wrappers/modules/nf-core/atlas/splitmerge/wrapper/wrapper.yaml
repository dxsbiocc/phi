# Agent-facing wrapper adapter for the vendored atlas/splitmerge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/atlas-splitmerge
name: "Atlas splitMerge"
summary: "Split, filter and merge overlapping paired reads with Atlas splitMerge."

params:
  bam:
    kind: input
    type: file
    required: true
    description: "Coordinate-sorted BAM file."
  bai:
    kind: input
    type: file
    required: true
    description: "BAM index (.bai)."
  readgroups:
    kind: input
    type: file
    required: true
    description: "Read-group settings file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  bam:
    type: directory
    path: '${outdir}/atlas_splitmerge'
    primary: true
