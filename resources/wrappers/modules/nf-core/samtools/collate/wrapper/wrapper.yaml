# Agent-facing wrapper adapter for the vendored samtools/collate module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-collate
name: samtools collate
summary: Shuffle and group a BAM file's reads by name with samtools collate.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM file to collate by read name.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the collated BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_collate'
    primary: true
