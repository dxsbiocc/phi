# Agent-facing wrapper adapter for the vendored samtools/mpileup module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-mpileup
name: samtools mpileup
summary: Generate a raw pileup summary for a BAM with samtools mpileup.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Coordinate-sorted BAM file.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the pileup.

outputs:
  mpileup:
    type: directory
    path: '${outdir}/samtools_mpileup'
    primary: true
