# Agent-facing wrapper adapter for the vendored samtools/splitheader
# module at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-splitheader
name: samtools splitheader
summary: Split a BAM's header into separate read-group/program/sequence text files.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM/SAM/CRAM file whose header should be split.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the split header text files.

outputs:
  readgroup:
    type: directory
    path: '${outdir}/samtools_splitheader'
    primary: true
