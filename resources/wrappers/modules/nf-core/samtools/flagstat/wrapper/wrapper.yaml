# Agent-facing wrapper adapter for the vendored samtools/flagstat module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-flagstat
name: samtools flagstat
summary: Count alignments in a BAM/CRAM/SAM file for each FLAG type.

params:
  bam:
    kind: input
    type: bam
    required: true
    description: BAM/CRAM/SAM file to summarize.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the flagstat report.

outputs:
  flagstat:
    type: directory
    path: '${outdir}/samtools_flagstat'
    primary: true
