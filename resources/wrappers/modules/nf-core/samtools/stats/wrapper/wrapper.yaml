# Agent-facing wrapper adapter for the vendored samtools/stats module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-stats
name: samtools stats
summary: Produce comprehensive alignment statistics from a SAM/BAM/CRAM file.

params:
  bam:
    kind: input
    type: bam
    required: true
    description: SAM/BAM/CRAM file to summarize.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the stats report.

outputs:
  stats:
    type: directory
    path: '${outdir}/samtools_stats'
    primary: true
