# Agent-facing wrapper adapter for the vendored samtools/calmd module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-calmd
name: samtools calmd
summary: Recalculate MD/NM tags for a BAM against a reference with samtools calmd.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Coordinate-sorted BAM file.
  fasta:
    kind: input
    type: file
    required: true
    description: Reference FASTA file.
  fai:
    kind: input
    type: file
    required: true
    description: FASTA index (.fai) for the reference.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the updated BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_calmd'
    primary: true
