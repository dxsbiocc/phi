# Agent-facing wrapper adapter for the vendored samtools/cat module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# Only two input BAM files are exposed — the vendored module accepts any
# number, but this thin adapter doesn't surface a variable-length list.
id: nf-core/modules/samtools-cat
name: samtools cat
summary: Concatenate two BAM/CRAM files (same reference, no re-sorting) with samtools cat.

params:
  bam1:
    kind: input
    type: file
    required: true
    description: First BAM file to concatenate.
  bam2:
    kind: input
    type: file
    required: true
    description: Second BAM file to concatenate.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the concatenated BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_cat'
    primary: true
