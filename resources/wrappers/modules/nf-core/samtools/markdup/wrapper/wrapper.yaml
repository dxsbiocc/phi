# Agent-facing wrapper adapter for the vendored samtools/markdup module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-markdup
name: samtools markdup
summary: Mark duplicate reads in a BAM file with samtools markdup.

params:
  bam:
    kind: input
    type: file
    required: true
    description: BAM file (name-collated or coordinate-sorted) to mark duplicates in.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the marked-duplicates BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_markdup'
    primary: true
