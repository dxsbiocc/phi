# Agent-facing wrapper adapter for the vendored samtools/index module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-index
name: samtools index
summary: Index a SAM/BAM/CRAM file.

params:
  input:
    kind: input
    type: bam
    required: true
    description: Coordinate-sorted SAM/BAM/CRAM file to index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the index file.

outputs:
  index:
    type: directory
    path: '${outdir}/samtools_index'
    primary: true
