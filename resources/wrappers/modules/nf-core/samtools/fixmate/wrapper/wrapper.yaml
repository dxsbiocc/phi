# Agent-facing wrapper adapter for the vendored samtools/fixmate module
# at ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-fixmate
name: samtools fixmate
summary: Fill in mate coordinate/insert-size fields on a name-sorted BAM with samtools fixmate.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Name-sorted (or name-collated) BAM file.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the fixed-mate BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_fixmate'
    primary: true
