# Agent-facing wrapper adapter for the vendored samtools/import module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-import
name: samtools import
summary: Import a FASTQ file into an unaligned BAM/SAM with samtools import.

params:
  reads:
    kind: input
    type: file
    required: true
    description: FASTQ file (plain or gzipped) to import.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the unaligned BAM.

outputs:
  bam:
    type: directory
    path: '${outdir}/samtools_import'
    primary: true
