# Agent-facing wrapper adapter for the vendored samtools/depth module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-depth
name: samtools depth
summary: Compute per-base read depth for a BAM file with samtools depth.

params:
  bam:
    kind: input
    type: file
    required: true
    description: Coordinate-sorted BAM file.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the depth table.

outputs:
  tsv:
    type: directory
    path: '${outdir}/samtools_depth'
    primary: true
