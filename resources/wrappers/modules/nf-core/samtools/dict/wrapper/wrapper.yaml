# Agent-facing wrapper adapter for the vendored samtools/dict module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/samtools-dict
name: samtools dict
summary: Build a .dict sequence dictionary for a FASTA reference with samtools dict.

params:
  fasta:
    kind: input
    type: file
    required: true
    description: Reference FASTA file.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the sequence dictionary.

outputs:
  dict:
    type: directory
    path: '${outdir}/samtools_dict'
    primary: true
