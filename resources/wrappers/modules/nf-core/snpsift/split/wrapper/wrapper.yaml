# Agent-facing wrapper adapter for the vendored snpsift/split module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/snpsift-split
name: "SnpSift split"
summary: "Split a VCF by chromosome/sample with SnpSift split."

params:
  vcf:
    kind: input
    type: file
    required: true
    description: "VCF file."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the results."

outputs:
  out_vcfs:
    type: directory
    path: '${outdir}/snpsift_split'
    primary: true
