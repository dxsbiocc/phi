# Agent-facing wrapper adapter for the vendored fq/lint module at ../main.nf.
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/modules/fq-lint
name: fq lint
summary: Validate FASTQ file(s) (paired or single-end) with fq lint.

params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: FASTQ files to validate (glob matching a paired- or single-end sample).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the lint report.

outputs:
  report:
    type: directory
    path: '${outdir}/fq_lint'
    primary: true
