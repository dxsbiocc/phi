# Standalone wrapper around one MultiQC module from nf-core/modules —
# report aggregation used across virtually every nf-core pipeline
# (RNA-seq, DNA-seq, ChIP-seq, ...), not RNA-seq specific. See
# ../fastqc/wrapper.yaml's doc comment for why this is
# namespaced `nf-core/modules/*`, not `nf-core/rnaseq/*`.
#
# Why this exists alongside the full `nf-core/rnaseq/rnaseq` wrapper: the
# product docs (phi-wrapper-product-prd.md Non-Goals) explicitly rule out
# "arbitrary wrapper composition" — Phi has no mechanism for one wrapper to
# declare/invoke another, and building one is out of scope (Phase 3+
# Future Extensions). Typical use: point `input` at the combined output of
# this namespace's other standalone wrappers (fastqc/trimgalore) to get
# one aggregate report across them. The module itself
# (modules/nf-core/multiqc/main.nf) is vendored unmodified;
# `workflows/multiqc.nf`/`nextflow.config` here are a small Phi-authored
# launcher. Root `main.nf` is a thin entrypoint that just includes and
# calls the workflow, matching nf-core's own main.nf/workflows split.
phiWrapperVersion: 1
id: nf-core/modules/multiqc
shortId: multiqc
name: MultiQC (nf-core module)
version: 1.33.0
summary: Aggregate QC/tool reports into one MultiQC HTML report — a generic reporting step, not RNA-seq specific.

runtime:
  minVersion: 1.0.0
  maxVersion: 1.x

source:
  # See fastqc/wrapper.yaml's source comment — same
  # shared-library provenance, vendored at the commit nf-core/rnaseq
  # 3.26.0's modules.json pinned: 2c73cc8fa92cf48de3da0b643fdf357a8a290b36.
  repository: https://github.com/nf-core/modules
  ref: master

verification:
  status: unverified
  registry: none

registryStatus: active
resourceClass: light

engine:
  type: nextflow
  entrypoint: main.nf
  profiles:
    - id: local
      executor: local
      containerRuntime: docker
      nextflowProfile: docker
    - id: slurm-controller
      executor: remote
      scheduler: slurm
      controller: sbatch
      containerRuntime: singularity
      nextflowProfile: singularity

inputs:
  # A glob (not a directory path) — e.g. "results/**/*.{html,zip,txt,log}"
  # — matching every report/log file to fold into the aggregate report.
  # Points at the *outputs* of other tool wrappers (this namespace's own
  # fastqc/trimgalore, or anything else MultiQC recognizes), not raw reads.
  - id: input
    type: glob
    required: true

parameters:
  schema:
    type: object
    properties: {}

outputs:
  - id: report
    label: MultiQC report
    type: html
    path: multiqc/multiqc_report.html
    primary: true
  - id: data
    label: MultiQC parsed data
    type: directory
    path: multiqc/multiqc_data

resources:
  defaults:
    cpus: 1
    memory: 4 GB
    time: 1h

permissions:
  filesystem:
    read:
      - input_paths
    write:
      - run_workdir
      - declared_outdir
  network:
    default: disabled
  remote:
    allowed: false

license:
  wrapper: MIT
  tools:
    - name: MultiQC
      license: GPL-3.0

citations:
  - id: nf-core
    doi: 10.1038/s41587-020-0439-x

dataPolicy:
  acceptedSensitivity:
    - public
    - internal
  externalTransfer:
    default: false
