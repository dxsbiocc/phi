# Standalone wrapper around one Trim Galore module from nf-core/modules —
# a shared, pipeline-agnostic module library, not something specific to
# RNA-seq. See ../fastqc/wrapper.yaml's doc comment for why
# this is namespaced `nf-core/modules/*` rather than `nf-core/rnaseq/*` —
# adapter/quality trimming is generic sequencing prep, used well beyond
# RNA-seq.
#
# Why this exists alongside the full `nf-core/rnaseq/rnaseq` wrapper: the
# product docs (phi-wrapper-product-prd.md Non-Goals) explicitly rule out
# "arbitrary wrapper composition" — Phi has no mechanism for one wrapper to
# declare/invoke another, and building one is out of scope (Phase 3+
# Future Extensions). The module itself
# (modules/nf-core/trimgalore/main.nf) is vendored unmodified;
# `workflows/trimgalore.nf`/`nextflow.config` here are a small
# Phi-authored launcher. Root `main.nf` is a thin entrypoint that just
# includes and calls the workflow, matching nf-core's own
# main.nf/workflows split.
phiWrapperVersion: 1
id: nf-core/modules/trimgalore
shortId: trimgalore
name: Trim Galore (nf-core module)
version: 2.1.0
summary: Adapter/quality-trim paired-end FASTQ reads with Trim Galore — a generic sequencing prep step, not RNA-seq specific.

runtime:
  minVersion: 1.0.0
  maxVersion: 1.x

source:
  # See fastqc/wrapper.yaml's source comment — same
  # shared-library provenance, vendored at the commit nf-core/rnaseq
  # 3.26.0's modules.json pinned: 0991b1032cccfcd9245ef59c6e56d6092ac0b3e7.
  repository: https://github.com/nf-core/modules
  ref: master

verification:
  status: unverified
  registry: none

registryStatus: active
resourceClass: light

engine:
  type: nextflow
  entrypoint: main.nf
  profiles:
    - id: local
      executor: local
      containerRuntime: docker
      nextflowProfile: docker
    - id: slurm-controller
      executor: remote
      scheduler: slurm
      controller: sbatch
      containerRuntime: singularity
      nextflowProfile: singularity

inputs:
  - id: reads
    type: fastq_reads
    layout: paired_end
    required: true
    samplesheet:
      columns:
        - sample
        - fastq_1
        - fastq_2

parameters:
  schema:
    type: object
    properties: {}

outputs:
  - id: trimmed_reads
    label: Trimmed FASTQ files
    type: directory
    path: trimgalore
    primary: true
  - id: reports
    label: Trimming reports (FastQC + Trim Galore logs)
    type: directory
    path: trimgalore/reports

resources:
  defaults:
    cpus: 4
    memory: 8 GB
    time: 2h

permissions:
  filesystem:
    read:
      - input_paths
    write:
      - run_workdir
      - declared_outdir
  network:
    default: disabled
  remote:
    allowed: false

license:
  wrapper: MIT
  tools:
    - name: Trim Galore
      license: GPL-3.0

citations:
  - id: nf-core
    doi: 10.1038/s41587-020-0439-x

dataPolicy:
  acceptedSensitivity:
    - public
    - internal
  externalTransfer:
    default: false
