# Agent-facing wrapper adapter for the vendored fastq_remove_rrna subworkflow at
# ../main.nf: remove ribosomal-RNA reads from RNA-seq FASTQ with SortMeRNA,
# RiboDetector or Bowtie2. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# The subworkflow builds its own SortMeRNA / Bowtie2 index from the rRNA FASTA
# (make_*_index = true here), so callers give plain FASTA. RiboDetector is a
# language model and needs no database. Handles ONE sample per run (id
# `sample_id`). Only a single rRNA FASTA is accepted; the subworkflow itself can
# take several databases, but Nextflow cannot glob remote files, so a multi-file
# parameter is left out.
id: nf-core/subworkflows/fastq-remove-rrna
name: rRNA removal
summary: Remove ribosomal RNA reads from RNA-seq FASTQ with SortMeRNA, RiboDetector or Bowtie2.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1 (the only reads file for single-end data).
  reads_2:
    kind: input
    type: fastq
    required: false
    description: FASTQ file for read 2. Omit for single-end reads.
  rrna_fasta:
    kind: input
    type: fasta
    required: false
    description: rRNA reference sequences (e.g. a SortMeRNA/SILVA database FASTA). Required for sortmerna and bowtie2; not used by ribodetector.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the rRNA-depleted reads and the tool's log.
  ribo_removal_tool:
    kind: option
    type: string
    required: false
    enum:
      - sortmerna
      - ribodetector
      - bowtie2
    description: Removal method. sortmerna and bowtie2 align against rrna_fasta; ribodetector is database-free. Defaults to sortmerna.
  sample_id:
    kind: option
    type: string
    required: false
    description: Sample name used in output file names. Defaults to sample.

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_remove_rrna'
    primary: true
