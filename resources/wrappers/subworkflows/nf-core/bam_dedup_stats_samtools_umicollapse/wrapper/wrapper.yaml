# Agent-facing wrapper adapter for the vendored bam_dedup_stats_samtools_umicollapse
# subworkflow at ../main.nf (UMICollapse dedup -> samtools index ->
# samtools stats/flagstat/idxstats). Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/subworkflows/bam-dedup-stats-samtools-umicollapse
name: BAM UMI dedup + stats (UMICollapse)
summary: Deduplicate a UMI-tagged BAM with UMICollapse, index the result, and compute samtools stats, flagstat and idxstats.

params:
  bam:
    kind: input
    type: bam
    required: true
    description: Coordinate-sorted BAM with UMIs in the read name.
  bai:
    kind: input
    type: bai
    required: true
    description: Index for the input BAM.
  single_end:
    kind: option
    type: boolean
    required: false
    description: Whether the reads are single-end.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the deduplicated BAM, its index, and the stats reports.

outputs:
  results:
    type: directory
    path: '${outdir}/bam_dedup_stats_samtools_umicollapse'
    primary: true
