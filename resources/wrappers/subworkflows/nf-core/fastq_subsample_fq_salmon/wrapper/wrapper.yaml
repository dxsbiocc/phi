# Agent-facing wrapper adapter for the vendored fastq_subsample_fq_salmon
# subworkflow at ../main.nf (build a Salmon index, subsample reads with fq,
# pseudo-align the subsample with Salmon — used to infer library
# strandedness cheaply). Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
id: nf-core/subworkflows/fastq-subsample-fq-salmon
name: FASTQ subsample + Salmon quant
summary: Build a Salmon index, subsample FASTQ reads, and pseudo-align the subsample with Salmon (a cheap way to infer library strandedness).

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: Read 1 FASTQ.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: Read 2 FASTQ.
  genome_fasta:
    kind: input
    type: fasta
    required: true
    description: Genome FASTA, used as a decoy sequence when building the Salmon index.
  transcript_fasta:
    kind: input
    type: fasta
    required: true
    description: Transcriptome FASTA to build the Salmon index from and quantify against.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF, passed through to Salmon quant.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the subsampled reads and Salmon quantification.

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_subsample_fq_salmon'
    primary: true
