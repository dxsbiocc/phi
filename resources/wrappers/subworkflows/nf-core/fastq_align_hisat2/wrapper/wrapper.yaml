# Agent-facing wrapper adapter for the vendored fastq_align_hisat2 subworkflow
# at ../main.nf (HISAT2_ALIGN -> BAM_SORT_STATS_SAMTOOLS: sorted BAM, index,
# stats, flagstat, idxstats). Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# The subworkflow *takes* a pre-built HISAT2 index and splice-sites file; this
# wrapper builds both from the given FASTA/GTF first (hisat2/extractsplicesites
# + hisat2/build, the same setup chain nf-core's own subworkflow test uses),
# so callers give plain genome files. Those modules are included directly, not
# through their own wrappers. The reference FASTA/FAI the samtools steps can
# take is passed empty (only CRAM needs it).
id: nf-core/subworkflows/fastq-align-hisat2
name: HISAT2 align + samtools stats
summary: Build a HISAT2 index, align RNA-seq reads, then sort/index the BAM and compute samtools stats.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: FASTQ file for read 1 (the only reads file for single-end data).
  reads_2:
    kind: input
    type: fastq
    required: false
    description: FASTQ file for read 2. Omit for single-end reads.
  fasta:
    kind: input
    type: fasta
    required: true
    description: Reference genome FASTA to build the HISAT2 index from and align against.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF used for the splice sites and the splice-aware index.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the sorted BAM, its index, the stats reports, and the HISAT2 summary log.

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_hisat2'
    primary: true
