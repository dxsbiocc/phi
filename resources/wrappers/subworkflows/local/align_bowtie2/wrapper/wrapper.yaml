# Agent-facing wrapper adapter for the vendored align_bowtie2 subworkflow at
# ../main.nf (Bowtie2 align -> coordinate-sort, index, samtools stats).
# Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
#
# bowtie2/build is composed directly (not a wrapper, per section 6) so
# callers supply a reference FASTA instead of a pre-built Bowtie2 index.
id: local/subworkflows/align-bowtie2
name: Align with Bowtie2
summary: Build a Bowtie2 index, align paired-end reads (splice-unaware, e.g. for prokaryotic RNA-seq), and coordinate-sort/index/stats the resulting BAM.

params:
  reads_1:
    kind: input
    type: fastq
    required: true
    description: Read 1 FASTQ.
  reads_2:
    kind: input
    type: fastq
    required: true
    description: Read 2 FASTQ.
  fasta:
    kind: input
    type: fasta
    required: true
    description: Reference FASTA to build the Bowtie2 index from (a genome or transcriptome, depending on use case).
  save_unaligned:
    kind: option
    type: boolean
    required: false
    description: Also save reads that failed to align.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the Bowtie2 alignment log and the sorted/indexed/stats BAM.

outputs:
  results:
    type: directory
    path: '${outdir}/align_bowtie2'
    primary: true
