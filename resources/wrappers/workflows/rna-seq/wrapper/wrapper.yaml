# Agent-facing wrapper adapter for the complete, unmodified nf-core/rnaseq
# v3.26.0 pipeline vendored under ../ (main.nf, nextflow_schema.json,
# conf/, modules/, subworkflows/, bin/ — the real pipeline as it ships,
# not a hand-rewritten subset). See wrapper/main.nf's doc comment for how
# it stays runnable one directory deeper, and
# docs/design/phi-wrapper-agent-composition-design.md for why a *complete
# pipeline* gets this third `workflows/` tier instead of being decomposed
# into modules/subworkflows: nf-core/rnaseq's real entrypoint
# (workflows/rnaseq/main.nf, 880 lines) depends on pipeline-template
# scaffolding (nf-schema param validation, samplesheet schema) that only
# makes sense attached to the whole pipeline, not to an individual
# module/subworkflow wrapper.
#
# Params below are a deliberate SUBSET of nextflow_schema.json's full
# surface — the ones an agent most plausibly needs to set. Every other
# pipeline param (there are 100+) keeps its pipeline default; nothing about
# this wrapper prevents a future revision from exposing more.
#
# `aligner` and `with_umi` are exposed precisely because they're real,
# already-implemented choices in the unmodified pipeline itself (aligner:
# star_salmon/star_rsem/hisat2/bowtie2_salmon; with_umi: UMI-tools dedup vs
# the pipeline's default Picard MarkDuplicates-only QC pass) — this
# wrapper does not reimplement or approximate either branch.
id: nf-core/workflows/rnaseq
name: nf-core/rnaseq
summary: Full RNA-seq quantification pipeline (QC, trim, align, quantify, MultiQC report) — nf-core/rnaseq v3.26.0, unmodified.

params:
  input:
    kind: input
    type: csv
    required: true
    description: Samplesheet CSV (sample, fastq_1, fastq_2, strandedness columns) describing the FASTQ inputs.
  fasta:
    kind: input
    type: fasta
    required: true
    description: Reference genome FASTA.
  gtf:
    kind: input
    type: gtf
    required: true
    description: Gene annotation GTF matching the reference genome.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for QC reports, alignments, quantification, and the MultiQC report.
  aligner:
    kind: option
    type: string
    required: false
    enum:
      - star_salmon
      - star_rsem
      - hisat2
      - bowtie2_salmon
    description: Alignment/quantification strategy. Defaults to the pipeline's own default, star_salmon.
  with_umi:
    kind: option
    type: boolean
    required: false
    description: Enable UMI-tools deduplication (requires UMI-barcoded reads). When false (default), the pipeline still runs Picard MarkDuplicates for QC metrics but does not remove duplicates.

outputs:
  results:
    type: directory
    path: '${outdir}'
    primary: true
  multiqc_report:
    # Actual subpath varies by `aligner` (e.g. multiqc/star_salmon/ vs
    # multiqc/hisat2/) — this is the default (star_salmon) location.
    type: file
    path: '${outdir}/multiqc/star_salmon/multiqc_report.html'
