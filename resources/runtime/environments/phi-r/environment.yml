name: phi-r
description: 官方 R Notebook 内核与通用统计绘图共用的轻量 R 4.4 基础环境。
channels:
  - conda-forge
dependencies:
  # R interpreter and default R notebook kernel.
  - r-base=4.4
  - r-irkernel

  # General tidy data manipulation and ggplot2 composition.
  - r-tidyverse
  - r-patchwork
  - r-ggrepel
  - r-scales
  - r-rcolorbrewer
  - r-jsonlite
  - r-yaml
