name: phi-r
description: Shared R 4.4 base for R notebooks (IRkernel) and scanpy's R interop.
channels:
  - conda-forge
  - bioconda
dependencies:
  # Interpreter and the R notebook kernel (step 5.3).
  - r-base=4.4
  - r-irkernel

  # General data work.
  - r-tidyverse

  # scanpy R interop (resources/skills/scanpy/references/r_interop.md).
  # zellkonverter is deliberately absent: its basilisk backend creates Python
  # environments at run time, which cannot happen inside a read-only prefix.
  - bioconductor-singlecellexperiment
  - r-seurat

# GenomeInfoDbData (needed by SingleCellExperiment through GenomicRanges and GenomeInfoDb)
# is a Bioconductor data package. Its bioconda build ships no data: a post-link script
# downloads the tarball at install time and, in a Phi build, fails, leaving GenomeInfoDb
# unloadable. It is installed here from the Bioconductor GitHub mirror instead, pinned.
sourcePackages:
  - language: r
    name: GenomeInfoDbData
    source: github
    repo: Bioconductor/GenomeInfoDbData
    ref: b5339e03cc0c9c188e773a7ec2b80a146601595a
    sha256: 1eccebf119d4de560b4f601eddb863436889630fdee3d0185f89e32ca4e14125
