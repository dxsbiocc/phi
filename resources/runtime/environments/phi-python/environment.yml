name: phi-python
description: 官方通用 Python 技能、办公文档组件与默认 Notebook 内核共用的轻量 Python 3.12 基础环境。
channels:
  - conda-forge
dependencies:
  # Interpreter, YAML config parser, and default notebook kernel.
  - python=3.12
  - ipykernel
  - pyyaml

  # Shared command-line tooling retained for Unix runtime compatibility (no win-64 build).
  - conda: coreutils
    platforms: [darwin-arm64, darwin-x64, linux-x64]

  # Keep Windows x64 on OpenBLAS so scikit-learn (llvm-openmp) never collides with Intel MKL OpenMP.
  - conda: nomkl
    platforms: [win32-x64]

  # Bundled Office plugin (pptx / xlsx / docx / pdf / markitdown).
  - defusedxml
  - git
  - lxml
  - nodejs
  - pillow
  - python-pptx
  - pptxgenjs
  - openpyxl
  - python-calamine
  - xlsxwriter
  - python-docx
  - pdfplumber
  - poppler
  - pypdf
  - reportlab
  - markitdown
  - openai
  - python-dotenv
  - requests
  - tesseract

  # General scientific Python, statistics, and plotting core.
  - numpy
  - scipy
  - pandas
  - matplotlib-base
  - seaborn
  - scikit-learn
  - networkx
