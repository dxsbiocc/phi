name: phi-python
description: Shared Python 3.12 base for the official Python skills and the notebook kernel.
channels:
  - conda-forge
  - bioconda
dependencies:
  # Interpreter and the default notebook kernel (step 5.3).
  - python=3.12
  - ipykernel

  # pptx. poppler, defusedxml, lxml, and git are shared with pdf and xlsx.
  - defusedxml
  - git
  - lxml
  - nodejs
  - pillow
  - poppler
  - pptxgenjs

  # xlsx. defusedxml, lxml, and git are listed under pptx.
  - coreutils
  - openpyxl
  - python-calamine

  # pdf. poppler is listed under pptx.
  - pdfplumber
  - pypdf
  - reportlab

  # markitdown
  - markitdown
  - openai
  - python-dotenv
  - requests
  - tesseract

  # matplotlib. numpy, scipy, and pandas are also used by scikit-learn, scanpy, and scvelo.
  - matplotlib
  - numpy
  - pandas
  - scipy

  # scikit-learn
  - scikit-learn

  # scanpy. harmonypy and bbknn are bioconda-only.
  - bbknn
  - harmonypy
  - leidenalg
  - python-igraph
  - scanpy

  # scvelo
  - scvelo

  # rdkit
  - rdkit

  # anndata (also a scanpy dependency)
  - anndata

  # seaborn (also a scanpy dependency)
  - seaborn

  # networkx (also a scanpy dependency)
  - networkx

  # shap
  - shap

  # pysam (bioconda only)
  - pysam

  # scikit-survival (import name: sksurv)
  - scikit-survival
