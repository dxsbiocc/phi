name: Content conformance

on:
  push:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'electron-builder.yml'
      - '.github/workflows/content.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'electron-builder.yml'
      - '.github/workflows/content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Phi

jobs:
  core:
    name: Independent core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout Phi
        uses: actions/checkout@v4
        with:
          path: Phi
          persist-credentials: false
      - name: Set isolated test paths
        # No content checkout exists in this job. An accidental source dependency fails.
        run: printf 'PHI_PACKAGES_ROOT=%s/absent-phi-packages\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun Phi bundles; the managed-Bun fixtures check this exact version.
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Core lint and resource boundary
        run: bun run lint
      - name: Production typecheck
        run: bun run typecheck
      - name: Install ripgrep
        # Remote search tests use the runner's rg as the server's system and managed ripgrep.
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep; else sudo apt-get update && sudo apt-get install -y ripgrep; fi
          rg --version
      - name: Independent core regressions
        # TAP stays on stdout; a spec copy keeps one list of failures for the next step.
        run: node --import ./scripts/test-loader.mjs --test --test-concurrency=4 --test-timeout=300000 --test-force-exit --test-reporter=tap --test-reporter-destination=stdout --test-reporter=spec --test-reporter-destination="$RUNNER_TEMP/core-tests.txt" tests/*.test.ts
      - name: Failing tests
        if: failure()
        # Names, locations and messages; stack frames are dropped to keep this short.
        run: sed -n '/failing tests:/,$p' "$RUNNER_TEMP/core-tests.txt" | grep -vE '^\s+at ' | head -n 400 || true

  packages:
    name: Pinned package content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Update this reviewed revision with intentional catalog changes; never track main implicitly.
      PHI_PACKAGES_REVISION: 30dacb2928bb0772332cbf341bf90044f2cfa849
    steps:
      - name: Checkout Phi
        uses: actions/checkout@v4
        with:
          path: Phi
          persist-credentials: false
      - name: Set selected package paths
        run: printf 'PHI_PACKAGES_ROOT=%s/phi-packages\nTMPDIR=%s\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout pinned public content
        uses: actions/checkout@v4
        with:
          repository: dxsbiocc/phi-packages
          ref: ${{ env.PHI_PACKAGES_REVISION }}
          path: phi-packages
          persist-credentials: false
      - name: Verify selected content revision
        run: test "$(git -C "$PHI_PACKAGES_ROOT" rev-parse HEAD)" = "$PHI_PACKAGES_REVISION"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun Phi bundles; the managed-Bun fixtures check this exact version.
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require Python for visualization CLI checks
        run: python3 --version
      - name: Validate public package content
        run: bun run check:package-content
      - name: Package content regressions
        run: bun run test:packages
      - name: Wrapper static conformance
        run: bun run smoke:wrappers -- --offline
