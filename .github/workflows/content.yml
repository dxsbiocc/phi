name: Content conformance

on:
  push:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'electron-builder.yml'
      - '.github/workflows/content.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'electron-builder.yml'
      - '.github/workflows/content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Phi

jobs:
  core:
    name: Independent core (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Phi
        uses: actions/checkout@v4
        with:
          path: Phi
          persist-credentials: false
      - name: Set isolated test paths
        # No content checkout exists in this job. An accidental source dependency fails.
        run: printf 'PHI_PACKAGES_ROOT=%s/absent-phi-packages\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The Node line Electron bundles, so the suites run on what the main process runs.
          node-version: '24'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun Phi bundles; the managed-Bun fixtures check this exact version.
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Electron binary
        # Without it, every process importing electron downloads the binary and prints to stdout.
        run: node node_modules/electron/install.js
      - name: Build remote helper
        # The prepared-host fixtures read the bundled helper's manifest.
        run: bun run helper:fetch-go && bun run build:helper
      # Neither depends on which suites a shard runs, so one shard per OS checks them.
      - name: Core lint and resource boundary
        if: matrix.shard == 1
        run: bun run lint
      - name: Production typecheck
        if: matrix.shard == 1
        run: bun run typecheck
      - name: Install test host tools
        # Remote search tests use the runner's rg as the server's system and managed ripgrep.
        # Login-shell tests launch through zsh and csh, which macOS already ships.
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep; else sudo apt-get update && sudo apt-get install -y ripgrep zsh csh; fi
          rg --version
      - name: Independent core regressions
        # The gate skips suites this host cannot run and retries failures serially.
        run: bun run test:gate --shard=${{ matrix.shard }}/4

  packages:
    name: Pinned package content
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Update this reviewed revision with intentional catalog changes; never track main implicitly.
      PHI_PACKAGES_REVISION: d25d1c0f7a3f0cc18898d0380f93155bd3497c98
    steps:
      - name: Checkout Phi
        uses: actions/checkout@v4
        with:
          path: Phi
          persist-credentials: false
      - name: Set selected package paths
        run: printf 'PHI_PACKAGES_ROOT=%s/phi-packages\nTMPDIR=%s\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout pinned public content
        uses: actions/checkout@v4
        with:
          repository: dxsbiocc/phi-packages
          ref: ${{ env.PHI_PACKAGES_REVISION }}
          path: phi-packages
          persist-credentials: false
      - name: Verify selected content revision
        run: test "$(git -C "$PHI_PACKAGES_ROOT" rev-parse HEAD)" = "$PHI_PACKAGES_REVISION"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun Phi bundles; the managed-Bun fixtures check this exact version.
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Require Python for visualization CLI checks
        run: python3 --version
      - name: Validate public package content
        run: bun run check:package-content
      - name: Package content regressions
        run: bun run test:packages
      - name: Wrapper static conformance
        run: bun run smoke:wrappers -- --offline
