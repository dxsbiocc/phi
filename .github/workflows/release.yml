name: Release

# Builds macOS (Apple Silicon), Linux x64, and Windows x64 packages and attaches
# them to a **draft** GitHub release, so a person reviews and publishes it by hand.
#
# macOS signing is optional. With the CSC_LINK / CSC_KEY_PASSWORD secrets the
# app is signed with that certificate, and with APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID it is also notarized. Without them it is ad-hoc signed: it opens on
# Apple Silicon, but Gatekeeper asks the user to allow it once (see README).

on:
  push:
    tags:
      - 'v*'
  # Packages (without drafting a release) when the packaging setup itself changes.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.yml'
      - 'build/**'
      - 'scripts/build/**'
      - 'scripts/build-kernel.ts'
      - 'scripts/build-helper.mjs'
      - 'scripts/check-release-kernel.ts'
      - 'scripts/smoke-packaged-worker.mjs'
      - 'scripts/smoke-installed-desktop.ts'
      - 'scripts/runtime/fetch-*.mjs'
      - 'scripts/runtime/go-manifest.json'
      - 'resources/runtime/manifest.json'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.15.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            builder: --mac dmg zip --arm64
            kernel_target: all
            artifact: Phi-macos-arm64
          - name: Linux x64
            os: ubuntu-22.04
            builder: --linux AppImage deb --x64
            kernel_target: linux-x64
            artifact: Phi-linux-x64
          - name: Windows x64
            os: windows-2022
            builder: --win nsis --x64
            kernel_target: win32-x64
            artifact: Phi-windows-x64
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.15.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build kernel
        run: bun scripts/build-kernel.ts --target ${{ matrix.kernel_target }}
      - name: Prepare Windows runtime assets
        if: runner.os == 'Windows'
        run: bun run runtime:fetch:win
      - name: Build app
        env:
          # The renderer bundle needs more than Node's default ~2 GB heap on the
          # 7 GB macOS runners.
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build
      - name: Choose macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with the configured Developer ID certificate."
            if [ -n "$APPLE_ID" ]; then
              echo "SIGNING_ARGS=-c.mac.notarize=true" >> "$GITHUB_ENV"
            fi
          else
            echo "No certificate configured: ad-hoc signing (Gatekeeper will ask users to allow the app)."
            echo "SIGNING_ARGS=-c.mac.identity=- -c.mac.hardenedRuntime=false" >> "$GITHUB_ENV"
            # electron-builder skips signing on PR builds; ad-hoc signing uses no secrets,
            # so PRs still get (and verify) the same bundle signature a release gets.
            echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
          fi
      - name: Cache verified builder downloads
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/phi-builder-cache
          key: release-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Prepare native packaging inputs
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$PWD/node_modules/electron/dist"
          version=$(tr -d '\r\n' < "$dist/version")
          test "${version#v}" = "$(node -p "require('electron/package.json').version")"
          if [ "$RUNNER_OS" = macOS ]; then
            test -x "$dist/Electron.app/Contents/MacOS/Electron"
          else
            test -x "$dist/electron"
          fi
          seven_zip=$(bash scripts/build/fetch-builder-7zip.sh "$RUNNER_TEMP/phi-builder-7zip")
          printf 'PHI_RELEASE_ELECTRON_DIST=%s\nELECTRON_BUILDER_7ZIP_PATH=%s\n' "$dist" "$seven_zip" >> "$GITHUB_ENV"
      - name: Package
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/phi-builder-cache
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        # An unset secret arrives as an empty string, which electron-builder reads as a
        # certificate path; unset those so it sees them as absent. SIGNING_ARGS is
        # unquoted on purpose: it holds separate builder flags.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ "$RUNNER_OS" = macOS ] && [ -n "${!name}" ] || unset "$name"
          done
          runtime_args=()
          if [ -n "${PHI_RELEASE_ELECTRON_DIST:-}" ]; then
            runtime_args=("-c.electronDist=$PHI_RELEASE_ELECTRON_DIST")
          fi
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          for attempt in 1 2 3; do
            if npx electron-builder ${{ matrix.builder }} --publish never "${runtime_args[@]}" $SIGNING_ARGS 2>&1 | tee "$log"; then
              exit 0
            else
              codes=("${PIPESTATUS[@]}")
            fi
            if (( codes[0] == 0 )); then exit "${codes[1]}"; fi
            if (( attempt == 3 )) || ! grep -Eq 'Response code (408|429|500|502|503|504)|ECONNRESET|ETIMEDOUT|EAI_AGAIN|UND_ERR_CONNECT_TIMEOUT' "$log"; then
              exit "${codes[0]}"
            fi
            echo "Transient packaging download failure, retrying after attempt $attempt/3."
            sleep "$((10 * attempt))"
          done
      - name: Smoke-test the packaged worker without system bun
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            resources=dist/mac-arm64/Phi.app/Contents/Resources
          else
            resources=dist/linux-unpacked/resources
          fi
          node scripts/smoke-packaged-worker.mjs --resources "$resources"
          test -x "$(find "$resources/kernel" -path '*linux-x64/phi-kernel' -print -quit)"
          bun scripts/check-release-kernel.ts --resources "$resources"
      - name: Install and smoke-test Windows NSIS package
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Resolve-Path -LiteralPath "dist/phi-$version-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Phi 验收 $([guid]::NewGuid().ToString('N'))"
          try {
            # NSIS parses /D from the raw command line. It must be last and unquoted.
            $process = Start-Process -FilePath $installer -ArgumentList "/S /currentuser /D=$installDir" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
            $app = Join-Path $installDir 'phi.exe'
            if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
              throw "NSIS did not install Phi to $installDir"
            }
            $resources = Join-Path $installDir 'resources'
            node scripts/smoke-packaged-worker.mjs --resources $resources
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            bun scripts/check-release-kernel.ts --resources $resources
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./scripts/test-loader.mjs scripts/smoke-installed-desktop.ts --app $app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if (Test-Path -LiteralPath $installDir) {
              Remove-Item -LiteralPath $installDir -Recurse -Force
            }
          }
      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 3 -name 'Phi.app' -type d | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          for binary in "$app"/Contents/Resources/runtime/bun/*/bun "$app"/Contents/Resources/runtime/micromamba/*/micromamba; do
            codesign --verify --verbose=2 "$binary"
          done
      - name: List artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.exe dist/latest*.yml)
          (( ${#files[@]} > 0 )) || { echo "No package artifacts in dist/" >&2; exit 1; }
          for file in "${files[@]}"; do
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Hand-written notes in docs/release-notes/<tag>.md win; generated notes
        # list only merged pull requests.
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then source=(--notes-file "$notes"); else source=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "Phi $GITHUB_REF_NAME" \
            "${source[@]}"
