name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  transfer-windows-draft:
    if: github.ref == 'refs/heads/codex/windows-preview-draft'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: dxsbiocc/phi
    steps:
      - name: Attach the verified installer to a draft release
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42000458834 --name Phi-windows-x64 --dir artifact
          cd artifact
          printf '%s  %s\n' 'a5e2bce3d011bfc837d5259878af85f1520a171b5ace6380831482acd2eead44' phi-0.1.1-setup.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s' '' | base64 -d > notes.md
          gh release create windows-x64-preview-20261105 phi-0.1.1-setup.exe SHA256SUMS.txt \
            --draft --prerelease --target 'b1e7eeb58d4f088789643e17f94ab54cc279dfd1' \
            --title 'Phi Windows x64 内测（0.1.1 构建）' --notes-file notes.md
