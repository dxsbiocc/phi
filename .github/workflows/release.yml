name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-windows-chat:
    if: github.ref == 'refs/heads/codex/windows-chat-diagnose'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.15.0'
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-kernel.ts --target win32-x64
      - run: bun run runtime:fetch:win
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npx electron-builder --win --x64 --dir --publish never
      - name: Exercise local chat in the unpacked desktop with diagnostics
        shell: pwsh
        run: |
          $app = (Resolve-Path -LiteralPath 'dist/win-unpacked/phi.exe').Path
          node --import ./scripts/test-loader.mjs scripts/smoke-installed-desktop.ts --app $app
