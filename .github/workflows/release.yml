name: Release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  transfer-windows-draft:
    if: github.ref == 'refs/heads/codex/windows-preview-draft'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: dxsbiocc/phi
    steps:
      - name: Attach the verified Windows fix to the second preview draft
        shell: bash
        run: |
          set -euo pipefail
          gh run download 42041541513 --name Phi-windows-x64 --dir artifact
          cd artifact
          mv phi-0.1.1-setup.exe Phi-Windows-x64-preview-2.exe
          printf '%s  %s\n' '5aece4e40be17b24b1ca49b4952a03dbc92d98dcf7d401080513fb22cc8e3bc8' Phi-Windows-x64-preview-2.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s' '' | base64 -d > notes.md
          gh release create windows-x64-preview-20261105-r2 Phi-Windows-x64-preview-2.exe SHA256SUMS.txt \
            --draft --prerelease --target '87137a193dd5714e79be846550b03a4e8a9e3c31' \
            --title 'Phi Windows x64 内测第 2 版' --notes-file notes.md
